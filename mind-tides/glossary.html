<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Mind Tides — 52 четасики</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#ece9e1;font:16px/1.45 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:24px 18px 64px}header{position:sticky;top:0;background:#0d0f12ee;backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid #2b3038;z-index:2}h1{font-size:1.45rem;margin:0 0 4px}p{color:#aeb5c0;margin:.35rem 0}.back{color:#d7c58b;text-decoration:none}.controls{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}button{background:#191d23;color:#e8e8e8;border:1px solid #343a44;border-radius:999px;padding:9px 13px;font:inherit}button[aria-pressed=true]{border-color:#d7c58b;color:#f2df9e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#14181e;border:1px solid #282e37;border-radius:14px;padding:14px}.card b{display:block;font-size:1.05rem}.card small{color:#929ba8}.tag{display:inline-block;margin-top:8px;font-size:.75rem;color:#c9cfd7}.count{font-variant-numeric:tabular-nums;color:#d7c58b}@media(max-width:520px){main{padding-top:12px}.grid{grid-template-columns:1fr 1fr}.card{padding:11px}.card b{font-size:.95rem}}</style></head><body><main><header><a class="back" href="/mind-tides/">← Игра</a><h1>52 четасики</h1><p>Полный справочный корпус. <span class="count" id="count">52 / 52</span></p></header><div class="controls" id="filters"></div><section class="grid" id="grid" aria-live="polite"></section></main><script>const groups={universal:'7 всеобщих',occasional:'6 отдельных',unwholesome:'14 неблагих',beautifulUniversal:'19 прекрасных всеобщих',abstinence:'3 воздержания',immeasurable:'2 безмерных',wisdom:'1 мудрость'};const cards=[['Phassa','Контакт','universal'],['Vedanā','Чувство','universal'],['Saññā','Распознавание','universal'],['Cetanā','Воление','universal'],['Ekaggatā','Однонаправленность','universal'],['Jīvitindriya','Жизненная способность','universal'],['Manasikāra','Внимание','universal'],['Vitakka','Направление ума','occasional'],['Vicāra','Удержание ума','occasional'],['Adhimokkha','Решимость','occasional'],['Viriya','Усилие','occasional'],['Pīti','Восторг','occasional'],['Chanda','Желание действовать','occasional'],['Moha','Заблуждение','unwholesome'],['Ahirika','Бесстыдство','unwholesome'],['Anottappa','Безбоязненность проступка','unwholesome'],['Uddhacca','Возбуждение','unwholesome'],['Lobha','Жажда','unwholesome'],['Diṭṭhi','Воззрение','unwholesome'],['Māna','Самомнение','unwholesome'],['Dosa','Отвращение','unwholesome'],['Issā','Зависть','unwholesome'],['Macchariya','Скупость','unwholesome'],['Kukkucca','Сожаление','unwholesome'],['Thīna','Косность','unwholesome'],['Middha','Оцепенение','unwholesome'],['Vicikicchā','Сомнение','unwholesome'],['Saddhā','Доверие','beautifulUniversal'],['Sati','Осознанность','beautifulUniversal'],['Hiri','Нравственный стыд','beautifulUniversal'],['Ottappa','Нравственная осторожность','beautifulUniversal'],['Alobha','Не-жажда','beautifulUniversal'],['Adosa','Не-отвращение','beautifulUniversal'],['Tatramajjhattatā','Равновесие ума','beautifulUniversal'],['Kāyapassaddhi','Успокоение факторов','beautifulUniversal'],['Cittapassaddhi','Успокоение сознания','beautifulUniversal'],['Kāyalahutā','Лёгкость факторов','beautifulUniversal'],['Cittalahutā','Лёгкость сознания','beautifulUniversal'],['Kāyamudutā','Мягкость факторов','beautifulUniversal'],['Cittamudutā','Мягкость сознания','beautifulUniversal'],['Kāyakammaññatā','Работоспособность факторов','beautifulUniversal'],['Cittakammaññatā','Работоспособность сознания','beautifulUniversal'],['Kāyapāguññatā','Умелость факторов','beautifulUniversal'],['Cittapāguññatā','Умелость сознания','beautifulUniversal'],['Kāyujukatā','Прямота факторов','beautifulUniversal'],['Cittujukatā','Прямота сознания','beautifulUniversal'],['Sammāvācā','Правильная речь','abstinence'],['Sammākammanta','Правильное действие','abstinence'],['Sammā-ājīva','Правильные средства к жизни','abstinence'],['Karuṇā','Сострадание','immeasurable'],['Muditā','Сорадование','immeasurable'],['Paññindriya','Способность мудрости','wisdom']];let active='all';const filters=document.getElementById('filters'),grid=document.getElementById('grid'),count=document.getElementById('count');function render(){const list=active==='all'?cards:cards.filter(c=>c[2]===active);count.textContent=list.length+' / 52';grid.innerHTML=list.map((c,i)=>`<article class="card"><small>${String(cards.indexOf(c)+1).padStart(2,'0')}</small><b>${c[0]}</b><span>${c[1]}</span><span class="tag">${groups[c[2]]}</span></article>`).join('')}function set(k){active=k;[...filters.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));render()}[['all','Все'],...Object.entries(groups)].forEach(([k,v])=>{const b=document.createElement('button');b.dataset.k=k;b.textContent=v;b.onclick=()=>set(k);filters.appendChild(b)});set('all');</script></body></html>
