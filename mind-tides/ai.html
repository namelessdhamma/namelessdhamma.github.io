<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Tides — против ИИ</title><meta name="theme-color" content="#111111">
<style>html,body{margin:0;background:#0d0d0d;color:#eee;font-family:system-ui,sans-serif;height:100%}body{display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:#171717;border-bottom:1px solid #333}.bar strong{font-size:.95rem}.status{font-size:.82rem;color:#bbb}.actions{display:flex;gap:.5rem}.actions a,.actions button{background:#262626;color:#eee;border:1px solid #444;border-radius:.55rem;padding:.45rem .7rem;text-decoration:none;cursor:pointer}.actions button:focus,.actions a:focus{outline:2px solid #ddd;outline-offset:2px}iframe{width:100%;height:100%;border:0;background:#111}.thinking{color:#ddd}.error{color:#ffb4b4}</style>
</head><body>
<header class="bar"><div><strong>Mind Tides · одиночная игра</strong><div id="ai-status" class="status" aria-live="polite">Вы — Becoming. ИИ играет Fading.</div></div><div class="actions"><button id="restart" type="button">Новая партия</button><a href="/mind-tides/">Hot-seat</a></div></header>
<iframe id="game" src="/mind-tides/index.html" title="Mind Tides game"></iframe>
<script>
(()=>{
const frame=document.getElementById('game'),status=document.getElementById('ai-status');let busy=false,timer,blockedSignature='';
const ROLE_SCORE={'wise-recognition':100,'non-grasping-root':95,'non-aversion-root':90,'mindful-observation':85,'object-direction':55,'object-sustain':50,'one-pointedness':48,'pleasant-feeling':42,'rapture':40,'doubt':35,'remorse-worry':30,'sloth-torpor-pair':25,'attachment-root':10,'aversion-root':8};
function doc(){try{return frame.contentDocument}catch{return null}} function text(el){return(el?.textContent||'').trim()} function setStatus(m,k=''){status.textContent=m;status.className='status '+k}
function legalCards(d){return[...d.querySelectorAll('#hand .card-choice')].filter(el=>!el.disabled&&!el.matches('[aria-disabled="true"]'))}
function legalObjects(d){return[...d.querySelectorAll('#objects .object-choice')].filter(el=>!el.disabled&&!el.matches('[aria-disabled="true"]'))}
function cardScore(el,index){const role=text(el.querySelector('span'));let score=ROLE_SCORE[role]??20;const t=text(el).toLowerCase();if(/wisdom|paññ|non-grasp|alobha/.test(t))score+=18;if(/mindful|sati/.test(t))score+=12;if(/aversion|dosa|attachment|lobha/.test(t))score-=10;return{el,index,score,role}}
function objectScore(el,index){const t=text(el).toLowerCase();let score=10;if(/mental-trace|trace:|trace/.test(t))score+=70;if(/past-nama/.test(t))score+=20;if(/meditation-concept/.test(t))score+=10;if(/present|current/.test(t))score+=8;return{el,index,score}}
function rankedCards(d){return legalCards(d).map(cardScore).sort((a,b)=>b.score-a.score||a.index-b.index)}
function rankedObjects(d){return legalObjects(d).map(objectScore).sort((a,b)=>b.score-a.score||a.index-b.index)}
function stateSignature(d){return [text(d.querySelector('#actor')),text(d.querySelector('#hand')),text(d.querySelector('#objects')),text(d.querySelector('#winner'))].join('|')}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function findAndResolve(d){const cards=rankedCards(d);if(!cards.length)return{moved:false,pairs:0};let pairs=0;for(const card of cards){card.el.click();await wait(80);const objects=rankedObjects(d);for(const object of objects){pairs++;const radio=object.el.querySelector('input[type="radio"]');if(radio){radio.checked=true;radio.dispatchEvent(new Event('change',{bubbles:true}))}else object.el.click();await wait(60);const resolve=d.querySelector('#resolve');if(resolve&&!resolve.disabled&&!resolve.matches('[aria-disabled="true"]')){resolve.click();return{moved:true,pairs}}}}return{moved:false,pairs}}
function tick(){const d=doc();if(!d||busy)return;const winner=d.querySelector('#winner');if(winner&&!winner.hidden){blockedSignature='';setStatus('Партия завершена.');return}const handoff=d.querySelector('#handoff'),title=text(d.querySelector('#handoff-title')),actor=text(d.querySelector('#actor'));const aiHandoff=handoff&&!handoff.hidden&&/fading/i.test(title),aiTurn=/fading/i.test(actor)&&d.querySelector('#play-area')&&!d.querySelector('#play-area').hidden;if(!aiHandoff&&!aiTurn){blockedSignature='';setStatus('Ваш ход · Becoming');return}const signature=stateSignature(d);if(aiTurn&&signature===blockedSignature)return;busy=true;setStatus('ИИ обдумывает допустимый ход…','thinking');(async()=>{try{if(aiHandoff){blockedSignature='';d.querySelector('#reveal')?.click();return}const result=await findAndResolve(d);if(result.moved){blockedSignature='';setStatus(`ИИ завершил ход после проверки ${result.pairs} пар. Передайте ход Becoming.`)}else{blockedSignature=signature;setStatus(`ИИ проверил ${result.pairs} пар и не нашёл допустимого хода. Повторная проверка — только после изменения состояния.`,'error')}}catch(e){blockedSignature=signature;setStatus('Ошибка хода ИИ: '+String(e?.message||e),'error')}finally{busy=false}})()}
frame.addEventListener('load',()=>{blockedSignature='';clearInterval(timer);timer=setInterval(tick,600)});document.getElementById('restart').addEventListener('click',()=>{busy=false;blockedSignature='';frame.src='/mind-tides/index.html?ai='+Date.now()});
})();
</script></body></html>
