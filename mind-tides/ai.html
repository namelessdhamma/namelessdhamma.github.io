<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Tides — против ИИ</title><meta name="theme-color" content="#111111">
<style>html,body{margin:0;background:#0d0d0d;color:#eee;font-family:system-ui,sans-serif;height:100%}body{display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:#171717;border-bottom:1px solid #333}.bar strong{font-size:.95rem}.status{font-size:.82rem;color:#bbb;max-width:60rem}.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.actions a,.actions button,.actions select{background:#262626;color:#eee;border:1px solid #444;border-radius:.55rem;padding:.45rem .7rem;text-decoration:none;cursor:pointer}.actions button:focus,.actions a:focus,.actions select:focus{outline:2px solid #ddd;outline-offset:2px}iframe{width:100%;height:100%;border:0;background:#111}.thinking{color:#ddd}.error{color:#ffb4b4}</style>
</head><body>
<header class="bar"><div><strong>Mind Tides · одиночная игра</strong><div id="ai-status" class="status" aria-live="polite">Вы — Becoming. ИИ играет Fading.</div></div><div class="actions"><label>ИИ <select id="difficulty" aria-label="Стиль ИИ"><option value="strategic">Стратегический</option><option value="varied">Вариативный</option></select></label><button id="restart" type="button">Новая партия</button><a href="/mind-tides/">Hot-seat</a></div></header>
<iframe id="game" src="/mind-tides/index.html" title="Mind Tides game"></iframe>
<script>
(()=>{
const frame=document.getElementById('game'),status=document.getElementById('ai-status'),difficulty=document.getElementById('difficulty');let busy=false,timer,blockedSignature='',blockedUntil=0,retrySignature='',retryCount=0,turnNo=0;
const moveMemory=new Map(),cardMemory=new Map(),objectMemory=new Map();
const ROLE_SCORE={'wise-recognition':100,'non-grasping-root':95,'non-aversion-root':90,'mindful-observation':85,'object-direction':55,'object-sustain':50,'one-pointedness':48,'pleasant-feeling':42,'rapture':40,'doubt':35,'remorse-worry':30,'sloth-torpor-pair':25,'attachment-root':10,'aversion-root':8};
function doc(){try{return frame.contentDocument}catch{return null}} function text(el){return(el?.textContent||'').trim()} function setStatus(m,k=''){status.textContent=m;status.className='status '+k}
function legalCards(d){return[...d.querySelectorAll('#hand .card-choice')].filter(el=>!el.disabled&&!el.matches('[aria-disabled="true"]'))}
function legalObjects(d){return[...d.querySelectorAll('#objects .object-choice')].filter(el=>!el.disabled&&!el.matches('[aria-disabled="true"]'))}
function cardScore(el,index){const role=text(el.querySelector('span'));let score=ROLE_SCORE[role]??20;const t=text(el).toLowerCase();if(/wisdom|paññ|non-grasp|alobha/.test(t))score+=18;if(/mindful|sati/.test(t))score+=12;if(/aversion|dosa|attachment|lobha/.test(t))score-=10;return{el,index,score,role,label:text(el).replace(/\s+/g,' ').slice(0,70)}}
function objectScore(el,index){const t=text(el).toLowerCase();let score=10;if(/mental-trace|trace:|trace/.test(t))score+=70;if(/past-nama/.test(t))score+=20;if(/meditation-concept/.test(t))score+=10;if(/present|current/.test(t))score+=8;return{el,index,score,label:text(el).replace(/\s+/g,' ').slice(0,70)}}
function pairKey(card,object){return card.role+'|'+card.label+'|'+object.label}
function stableNoise(key){let h=2166136261;for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)}return((h>>>0)%1000)/1000}
function pairScore(card,object){let score=card.score+object.score;const c=text(card.el).toLowerCase(),o=text(object.el).toLowerCase();if(/wise-recognition|wisdom|paññ/.test(c)&&/mental-trace|trace/.test(o))score+=32;if(/mindful-observation|mindful|sati/.test(c)&&/present|current|mental-trace|trace/.test(o))score+=22;if(/non-grasping|alobha/.test(c)&&/past-nama|mental-trace|trace/.test(o))score+=16;if(/non-aversion/.test(c)&&/present|current/.test(o))score+=12;if(/attachment|lobha|aversion|dosa/.test(c)&&/mental-trace|trace/.test(o))score-=18;const key=pairKey(card,object),repeats=moveMemory.get(key)||0;score-=Math.min(24,repeats*8);if(difficulty.value==='varied'){const cardUses=cardMemory.get(card.label)||0,objectUses=objectMemory.get(object.label)||0;score-=Math.min(30,cardUses*7+objectUses*4);score+=stableNoise(key+'|'+turnNo)*14}return score}
function rationale(card,object){const c=text(card.el).toLowerCase(),o=text(object.el).toLowerCase();if(/wise-recognition|wisdom|paññ/.test(c)&&/trace/.test(o))return'мудрость направлена на след опыта';if(/mindful|sati/.test(c)&&/present|current|trace/.test(o))return'осознанность направлена на текущий опыт';if(/non-grasping|alobha/.test(c)&&/past-nama|trace/.test(o))return'нецепляние работает с накопленным следом';if(/non-aversion/.test(c)&&/present|current/.test(o))return'неотвращение применяется к текущему объекту';if(difficulty.value==='varied')return'вариативный стиль выбирает сильную, но менее повторяемую связку';return'наиболее сильная допустимая связка в текущем состоянии'}
function rankedCards(d){return legalCards(d).map(cardScore).sort((a,b)=>b.score-a.score||a.index-b.index)}
function rankedObjects(d){return legalObjects(d).map(objectScore).sort((a,b)=>b.score-a.score||a.index-b.index)}
function stateSignature(d){return [text(d.querySelector('#actor')),text(d.querySelector('#hand')),text(d.querySelector('#objects')),text(d.querySelector('#winner'))].join('|')}
function resetRetry(){retrySignature='';retryCount=0} function clearBlock(){blockedSignature='';blockedUntil=0}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function findAndResolve(d){const cards=rankedCards(d);if(!cards.length)return{moved:false,pairs:0};const pairs=[];for(const card of cards){for(const object of rankedObjects(d))pairs.push({card,object,score:pairScore(card,object)})}pairs.sort((a,b)=>b.score-a.score||a.card.index-b.card.index||a.object.index-b.object.index);let checked=0;for(const candidate of pairs){checked++;candidate.card.el.click();await wait(55);const object=candidate.object,radio=object.el.querySelector('input[type="radio"]');if(radio){radio.checked=true;radio.dispatchEvent(new Event('change',{bubbles:true}))}else object.el.click();await wait(45);const resolve=d.querySelector('#resolve');if(resolve&&!resolve.disabled&&!resolve.matches('[aria-disabled="true"]')){const why=rationale(candidate.card,object),key=pairKey(candidate.card,object);moveMemory.set(key,(moveMemory.get(key)||0)+1);cardMemory.set(candidate.card.label,(cardMemory.get(candidate.card.label)||0)+1);objectMemory.set(object.label,(objectMemory.get(object.label)||0)+1);resolve.click();turnNo++;return{moved:true,pairs:checked,score:candidate.score,why}}}return{moved:false,pairs:checked}}
function isFading(s){return/(?:fading|угасани)/i.test(s)}
function tick(){const d=doc();if(!d||busy)return;const winner=d.querySelector('#winner');if(winner&&!winner.hidden){clearBlock();resetRetry();setStatus('Партия завершена. ИИ сделал ходов: '+turnNo+'.');return}const handoff=d.querySelector('#handoff'),title=text(d.querySelector('#handoff-title')),actor=text(d.querySelector('#actor'));const aiHandoff=handoff&&!handoff.hidden&&isFading(title),aiTurn=isFading(actor)&&d.querySelector('#play-area')&&!d.querySelector('#play-area').hidden;if(!aiHandoff&&!aiTurn){clearBlock();resetRetry();setStatus('Ваш ход · Becoming');return}const signature=stateSignature(d);if(signature!==blockedSignature)clearBlock();if(aiTurn&&signature===blockedSignature&&Date.now()<blockedUntil)return;if(aiTurn&&signature===blockedSignature)clearBlock();busy=true;setStatus('ИИ оценивает допустимые комбинации…','thinking');(async()=>{try{if(aiHandoff){clearBlock();resetRetry();d.querySelector('#reveal')?.click();return}const result=await findAndResolve(d);if(result.moved){clearBlock();resetRetry();setStatus(`ИИ завершил ход · ${result.why} · проверено комбинаций: ${result.pairs}. Передайте ход Becoming.`)}else{blockedSignature=signature;blockedUntil=Date.now()+1800;resetRetry();setStatus(`ИИ проверил ${result.pairs} комбинаций и пока не нашёл допустимого хода. Повторит после короткой паузы или изменения состояния.`,'error')}}catch(e){if(retrySignature!==signature){retrySignature=signature;retryCount=0}retryCount++;if(retryCount<3){setStatus(`Временная ошибка хода ИИ. Повтор ${retryCount}/2…`,'thinking')}else{blockedSignature=signature;blockedUntil=Date.now()+3000;setStatus('ИИ временно приостановил ход после двух ошибок и попробует снова: '+String(e?.message||e),'error')}}finally{busy=false}})()}
frame.addEventListener('load',()=>{clearBlock();resetRetry();clearInterval(timer);timer=setInterval(tick,600)});document.getElementById('restart').addEventListener('click',()=>{busy=false;turnNo=0;moveMemory.clear();cardMemory.clear();objectMemory.clear();clearBlock();resetRetry();frame.src='/mind-tides/index.html?ai='+Date.now()});
})();
</script></body></html>
