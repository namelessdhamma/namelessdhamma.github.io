<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>СИНЕЕ МОРЕ · AI 1.0-rc1</title>
<style>
:root{
  --black:#000000;--surface:#050606;--surface-2:#090a0a;
  --neutral:#F2F2F0;--neutral-peak:#FFFFFF;--neutral-gray:#727270;--neutral-faint:#D0D0CC;
  --warm:#F3F0E8;--warm-peak:#FFFDF8;--cool:#EDF1F3;--cool-peak:#FAFCFD;
  --red:#d44740;--red-deep:#a62722;--text:#F2F2F0;--muted:#a9aaa8
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 50% 100%,rgba(242,242,240,.035),transparent 38%),linear-gradient(#020303,#000 38%,#000)}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--neutral-peak);outline-offset:2px}
.app{height:100dvh;max-width:620px;width:min(100vw,620px);margin:auto;padding:7px 9px 8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.title{margin:0 0 2px;color:var(--red);font:700 clamp(28px,7.4vw,42px)/1 Georgia,"Times New Roman",serif;letter-spacing:1.5px;text-shadow:0 0 3px rgba(255,100,92,.95),0 0 11px rgba(212,71,64,.68),0 0 24px rgba(166,39,34,.28)}
.settings{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.settingsCard{min-width:0;height:68px;padding:8px 5px 6px;border:1px solid rgba(242,242,240,.55);border-radius:11px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));box-shadow:inset 0 0 18px rgba(242,242,240,.025),0 0 9px rgba(242,242,240,.035);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.settingsCard .label{font-size:12px;line-height:1.05;font-weight:800;text-align:center}
.settingsCard .value{font-size:10px;line-height:1;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.settingsCard:disabled{opacity:.34}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.player{width:100%}
.ph{height:22px;display:flex;align-items:end;justify-content:space-between;font-size:15px;line-height:1;font-weight:800;letter-spacing:.15px}
.ph .side.light{color:var(--warm)}.ph .side.dark{color:var(--cool)}
.ph .activeName{text-shadow:0 0 5px currentColor,0 0 14px currentColor}
.ph .who{font-size:11px;color:var(--muted);letter-spacing:.25px}
.reserve{width:100%;height:48px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;align-items:end;padding:0 1px}
.pieceBtn{--side:var(--neutral);--peak:var(--neutral-peak);--rgb:242,242,240;position:relative;height:46px;min-width:0;padding:0;border:0;background:transparent;display:flex;align-items:flex-end;justify-content:center;color:var(--side)}
.pieceBtn.light{--side:var(--warm);--peak:var(--warm-peak);--rgb:243,240,232}.pieceBtn.dark{--side:var(--cool);--peak:var(--cool-peak);--rgb:237,241,243}
.pieceBtn .shape{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);width:min(calc(17px + var(--rank)*2.35px),92%);height:calc(12px + var(--rank)*1.65px);border:1px solid rgba(var(--rgb),.82);border-bottom-width:2px;border-radius:50% 50% 35% 35% / 66% 66% 34% 34%;background:radial-gradient(ellipse at 50% 88%,rgba(var(--rgb),.30),transparent 45%),radial-gradient(circle at 50% 16%,rgba(var(--rgb),.18),rgba(0,0,0,.64) 60%,rgba(0,0,0,.88));box-shadow:0 0 4px rgba(var(--rgb),.48),0 0 10px rgba(var(--rgb),.12),inset 0 -3px 5px rgba(var(--rgb),.15)}
.pieceBtn .shape:after{content:"";position:absolute;left:-6%;right:-6%;bottom:-3px;height:4px;border-radius:50%;border:1px solid rgba(var(--rgb),.70);box-shadow:0 0 5px rgba(var(--rgb),.22)}
.pieceBtn span{position:relative;z-index:2;margin-bottom:10px;font-size:12px;font-weight:800;color:var(--peak);text-shadow:0 0 4px rgba(var(--rgb),.58)}
.pieceBtn.sel .shape{border-color:var(--peak);box-shadow:0 0 5px rgba(var(--rgb),.8),0 0 16px rgba(var(--rgb),.30),inset 0 -3px 6px rgba(var(--rgb),.25);transform:translateX(-50%) translateY(-2px)}
.pieceBtn.sel span{transform:translateY(-2px)}.pieceBtn:disabled{opacity:.22}.pieceBtn:disabled .shape{box-shadow:none}
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;padding:1px;width:min(96vw,58dvh,540px);height:min(96vw,58dvh,540px);background:rgba(242,242,240,.82);border:1px solid rgba(242,242,240,.74);border-radius:16px;overflow:hidden;box-shadow:0 0 8px rgba(242,242,240,.18),0 0 24px rgba(242,242,240,.055),inset 0 0 9px rgba(255,255,255,.08)}
.board:after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 14px rgba(242,242,240,.14)}
.cell{--side:var(--neutral);--peak:var(--neutral-peak);--rgb:242,242,240;position:relative;border:0;background:radial-gradient(ellipse at 50% 51%,transparent 0 27%,rgba(242,242,240,.045) 27.7% 28.4%,transparent 29% 43%,rgba(242,242,240,.025) 43.7% 44.2%,transparent 45%),#020303;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;transition:background .16s ease,box-shadow .16s ease}
.cell:nth-child(1){border-top-left-radius:14px}.cell:nth-child(3){border-top-right-radius:14px}.cell:nth-child(7){border-bottom-left-radius:14px}.cell:nth-child(9){border-bottom-right-radius:14px}
.cell.legal{background:radial-gradient(ellipse at 50% 51%,rgba(242,242,240,.085) 0 28%,rgba(242,242,240,.20) 28.4% 29.1%,transparent 30% 43%,rgba(242,242,240,.075) 43.5% 44.1%,transparent 45%),#020303}
.cell.last{box-shadow:inset 0 0 18px rgba(242,242,240,.075)}.cell.win{box-shadow:inset 0 0 0 2px rgba(255,255,255,.72),inset 0 0 24px rgba(255,255,255,.12)}
.bp{--side:var(--neutral);--peak:var(--neutral-peak);--rgb:242,242,240;position:relative;display:flex;align-items:center;justify-content:center;color:var(--peak);font-weight:900;font-size:clamp(17px,4vw,28px);border:1px solid rgba(var(--rgb),.86);border-bottom-width:2px;border-radius:50% 50% 36% 36% / 66% 66% 34% 34%;background:radial-gradient(ellipse at 50% 88%,rgba(var(--rgb),.35),transparent 43%),radial-gradient(circle at 50% 16%,rgba(var(--rgb),.20),rgba(0,0,0,.62) 60%,rgba(0,0,0,.90));box-shadow:0 0 5px rgba(var(--rgb),.62),0 0 16px rgba(var(--rgb),.14),inset 0 -5px 8px rgba(var(--rgb),.18);text-shadow:0 0 5px rgba(var(--rgb),.62);animation:materialize .16s ease-out}
.bp.light{--side:var(--warm);--peak:var(--warm-peak);--rgb:243,240,232}.bp.dark{--side:var(--cool);--peak:var(--cool-peak);--rgb:237,241,243}
.bp:after{content:"";position:absolute;left:-7%;right:-7%;bottom:-4px;height:7px;border-radius:50%;border:1px solid rgba(var(--rgb),.72);box-shadow:0 0 6px rgba(var(--rgb),.22)}
.cell.stacked .bp:before{content:"";position:absolute;left:-16%;right:-16%;bottom:-10px;height:12px;border-radius:50%;border:1px solid rgba(var(--rgb),.52);box-shadow:0 0 5px rgba(var(--rgb),.11)}
.depth{position:absolute;right:7px;bottom:5px;color:var(--side);font-size:10px;font-weight:900;text-shadow:0 0 4px currentColor}
.msg{min-height:24px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--neutral)}
.actions{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.btn{border:1px solid rgba(242,242,240,.62);border-radius:10px;background:rgba(255,255,255,.018);color:var(--neutral);padding:9px 6px;font-weight:800;font-size:12px;box-shadow:inset 0 0 12px rgba(242,242,240,.025)}.btn:disabled{opacity:.26}
.end{display:none;width:100%;border:1px solid rgba(242,242,240,.34);border-radius:10px;background:rgba(255,255,255,.018);padding:6px;text-align:center}.end.open{display:block}.end b{color:var(--neutral-peak);text-shadow:0 0 4px rgba(255,255,255,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(4px)}.modal.open{display:flex}
.card{width:100%;max-width:410px;max-height:88dvh;overflow:auto;background:#050606;border:1px solid rgba(242,242,240,.62);border-radius:14px;padding:14px;box-shadow:0 0 30px rgba(242,242,240,.06)}
.card h2{margin:0 0 10px;text-align:center;color:var(--neutral);font-size:18px}.card p{color:#c2c3c1;font-size:12px;line-height:1.38}
.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 11px;border:1px solid rgba(242,242,240,.26);border-radius:10px;background:#080909;color:var(--neutral);position:relative}
.choice.selected{border-color:rgba(242,242,240,.82);box-shadow:inset 0 0 16px rgba(242,242,240,.045);padding-right:42px}.choice.selected:after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--neutral-peak)}
.choice b{display:block;color:var(--neutral-peak);font-size:14px}.choice span{display:block;color:#b5b6b4;font-size:12px;line-height:1.28;margin-top:3px}
.close{display:block;margin:12px auto 0;border:1px solid rgba(242,242,240,.54);border-radius:9px;padding:8px 14px;background:#090a0a;color:var(--neutral);font-weight:800}
@keyframes materialize{from{opacity:.55;transform:translateY(-2px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:430px){.app{padding-left:7px;padding-right:7px;gap:4px}.settingsCard{height:64px;padding-left:3px;padding-right:3px}.settingsCard .label{font-size:11px}.settingsCard .value{font-size:9px}.reserve{height:44px}.pieceBtn{height:42px}}
@media(max-height:720px){.settingsCard{height:58px}.title{font-size:25px}.reserve{height:40px}.pieceBtn{height:38px}.ph{height:18px;font-size:13px}.msg{min-height:20px;font-size:11px}.btn{padding:7px 4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="title">СИНЕЕ МОРЕ</div>
  <div class="settings" aria-label="Настройки игры">
    <button id="rules" class="settingsCard"><span class="label">Правила игры</span><span id="rulesValue" class="value">C · стек 2</span></button>
    <button id="opponent" class="settingsCard"><span class="label">С кем играть</span><span id="opponentValue" class="value">ИИ · средний</span></button>
    <button id="strategy" class="settingsCard"><span class="label">Стратегия ИИ</span><span id="strategyValue" class="value">Смешанная</span></button>
    <button id="theme" class="settingsCard"><span class="label">Тема</span><span class="value">ND Premium</span></button>
  </div>
  <span id="turn" class="srOnly" aria-live="polite" aria-label="Текущий ход"></span>
  <div class="player"><div class="ph"><span id="dn" class="side dark">ТЁМНЫЕ</span><span id="dh" class="who"></span></div><div id="darkRes" class="reserve"></div></div>
  <div id="board" class="board" aria-label="Игровое поле"></div>
  <div class="player"><div class="ph"><span id="ln" class="side light">СВЕТЛЫЕ</span><span id="lh" class="who"></span></div><div id="lightRes" class="reserve"></div></div>
  <div id="msg" class="msg" aria-live="polite" aria-atomic="true"></div>
  <div id="end" class="end"><b id="endTitle"></b><div id="endInfo" class="small"></div></div>
  <div class="actions"><button id="undo" class="btn">НАЗАД</button><button id="reset" class="btn">СБРОС</button><button id="next" class="btn">СЛЕДУЮЩАЯ</button></div>
</div>
<div id="rulesM" class="modal" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><div class="card"><h2 id="rulesTitle">ПРАВИЛА ИГРЫ</h2><button class="choice" data-rule="C"><b>C · СТЕК 2</b><span>В клетке максимум две фигуры. После одного накрытия клетка закрыта.</span></button><button class="choice" data-rule="D"><b>D · ЛЕСТНИЦА</b><span>Победа только если три верхние фигуры в линии идут по размеру строго вверх или строго вниз.</span></button><button class="choice" data-rule="CD"><b>CD · СТЕК 2 + ЛЕСТНИЦА</b><span>Оба правила одновременно.</span></button><p>Ход: выберите неиспользованную фигуру и поставьте её на пустую клетку либо накройте меньшую верхнюю фигуру соперника. Свою фигуру накрывать нельзя.</p><button class="close" data-close="rulesM">ЗАКРЫТЬ</button></div></div>
<div id="opponentM" class="modal" role="dialog" aria-modal="true" aria-labelledby="opponentTitle"><div class="card"><h2 id="opponentTitle">С КЕМ ИГРАТЬ</h2><button class="choice" data-opponent="two"><b>ДРУГОЙ ИГРОК</b><span>Игра вдвоём на одном устройстве.</span></button><button class="choice" data-opponent="easy"><b>ИИ · ЛЁГКИЙ</b><span>Живой соперник, который допускает заметные ошибки.</span></button><button class="choice" data-opponent="medium"><b>ИИ · СРЕДНИЙ</b><span>Тактически устойчивый соперник с умеренной глубиной расчёта.</span></button><button class="choice" data-opponent="hard"><b>ИИ · СЛОЖНЫЙ</b><span>Глубже считает варианты и избегает грубых промахов.</span></button><button class="close" data-close="opponentM">ЗАКРЫТЬ</button></div></div>
<div id="strategyM" class="modal" role="dialog" aria-modal="true" aria-labelledby="strategyTitle"><div class="card"><h2 id="strategyTitle">СТРАТЕГИЯ ИИ</h2><button class="choice" data-style="mixed"><b>СМЕШАННАЯ</b><span>В каждой партии новый характер соперника.</span></button><button class="choice" data-style="architect"><b>АРХИТЕКТОР</b><span>Строит долгие комбинации и гибкие лестницы.</span></button><button class="choice" data-style="hunter"><b>ОХОТНИК</b><span>Давит, накрывает и быстро создаёт угрозы.</span></button><button class="choice" data-style="sentinel"><b>СТРАЖ</b><span>Экономит сильные фигуры и разрушает ваши планы.</span></button><button class="choice" data-style="trickster"><b>ЛОВКАЧ</b><span>Ищет вилки, неожиданные линии и менее очевидные ходы.</span></button><button class="close" data-close="strategyM">ЗАКРЫТЬ</button></div></div>
<div id="themeM" class="modal" role="dialog" aria-modal="true" aria-labelledby="themeTitle"><div class="card"><h2 id="themeTitle">ТЕМА</h2><button class="choice selected" aria-pressed="true"><b>ND PREMIUM</b><span>Нейтральное серебро, тёплое и холодное серебряное смещение, чёрное поле.</span></button><button class="close" data-close="themeM">ЗАКРЫТЬ</button></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
