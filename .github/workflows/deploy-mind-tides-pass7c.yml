name: Deploy Mind Tides PASS 7C

# Historical deployment builder retained only for explicit manual recovery.
# It MUST NOT run on ordinary pushes and MUST NOT replace unrelated product trees.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-mind-tides-pass7c
  cancel-in-progress: false

jobs:
  verify-and-preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted product surfaces before any write
        shell: bash
        run: |
          set -euo pipefail
          test -f mind-tides/index.html
          test -f sinee-more/index.html
          test -f sinee-more/app.js
          test -f sinee-more/ai/engine.js

      - name: Re-assert accepted Mind Tides PASS 7C surface only
        shell: bash
        run: |
          set -euo pipefail
          # The accepted deployed surface is already versioned in Git.
          # Recovery is intentionally product-scoped: restore ONLY mind-tides/.
          git checkout 068c7847856140aca5304eaafb826f7d49e73101 -- mind-tides

          # Cross-product invariant: this workflow may never delete or replace Sinee More.
          test -f sinee-more/index.html
          test -f sinee-more/app.js
          test -f sinee-more/ai/engine.js

          git diff --exit-code -- sinee-more

          if git diff --quiet -- mind-tides; then
            echo 'Mind Tides already matches accepted PASS 7C surface; no commit needed.'
            exit 0
          fi

          git config user.name 'nd-automation'
          git config user.email 'namelessdhamma@gmail.com'
          git add mind-tides
          git commit -m 'fix(release): restore accepted Mind Tides PASS 7C surface'
          git push origin HEAD:main
