name: Deploy Mind Tides PASS 7C
on:
  push:
    paths:
      - '.github/workflows/deploy-mind-tides-pass7c.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact authoritative artifacts and build standalone browser surface
        env:
          ARCHIVE_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-d4d4-81f6-be77-7372e21b359c/raw?se=2026-09-22T23%3A19%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=8900ba65-8354-5035-be98-8fc47b695bd1&skoid=31bc9c1a-c7e0-460a-8671-bf4a3c419305&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A04%3A16Z&ske=2026-09-23T23%3A04%3A16Z&sks=b&skv=2026-02-06&sig=mHh2aNGCUC5QVOIv2qWgvpILfjE0tFdvwaCZyUZd/E4%3D'
          CANDIDATE_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-e1c4-81f6-bf7f-35030a030649/raw?se=2026-09-22T23%3A19%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=2f5d41f6-febd-5add-9142-8b760f7a211f&skoid=5cab1ff4-c20d-41dc-babb-df0c2cc21dd4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T22%3A53%3A01Z&ske=2026-09-23T22%3A53%3A01Z&sks=b&skv=2026-02-06&sig=W0OuyKxnqQLuF0fUBUQs/BwEiT9W0oFiJn2874edQ8A%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARCHIVE_URL" -o /tmp/mt.zip
          curl -fL "$CANDIDATE_URL" -o /tmp/candidate.txt
          rm -rf /tmp/mt && mkdir /tmp/mt
          unzip -q /tmp/mt.zip -d /tmp/mt
          python3 - <<'PY'
          from pathlib import Path
          import re,gzip,base64
          root=Path('/tmp/mt')
          p=Path('/tmp/candidate.txt').read_text()
          parts=re.split(r'^===== FILE: (.+?) =====\n',p,flags=re.M)
          for i in range(1,len(parts),2):
              path=root/parts[i]; path.parent.mkdir(parents=True,exist_ok=True); path.write_text(parts[i+1].rstrip()+"\n")
          entry=root/'client/app.js'; seen=set(); order=[]
          def visit(path):
              path=path.resolve()
              if path in seen:return
              seen.add(path); t=path.read_text()
              for spec in re.findall(r'import\s+[^;]*?from\s+["\']([^"\']+)["\'];?',t):
                  q=(root/spec.lstrip('/')) if spec.startswith('/dist/') else ((path.parent/spec) if spec.startswith('./') else None)
                  if q: visit(q)
              order.append(path)
          visit(entry)
          out=[]
          for path in order:
              t=path.read_text(); t=re.sub(r'^import\s+[^;]*?from\s+["\'][^"\']+["\'];?\s*','',t,flags=re.M); t=re.sub(r'^export\s+','',t,flags=re.M); out.append(t)
          js='\n'.join(out); idx=(root/'client/index.html').read_text(); css=(root/'client/styles.css').read_text()
          idx=re.sub(r'<link rel="stylesheet" href="/client/styles.css"\s*/>',lambda m:'<style>'+css+'</style>',idx)
          idx=re.sub(r'<script type="module" src="/client/app.js"></script>',lambda m:'<script>'+js+'</script>',idx)
          b64=base64.b64encode(gzip.compress(idx.encode(),9)).decode()
          loader='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Tides — PASS 7C</title></head><body><script>(async()=>{const b=Uint8Array.from(atob("'+b64+'"),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.textContent="Mind Tides load failed: "+e})</script></body></html>'
          Path('mind-tides/index.html').write_text(loader)
          assert 'Заменить карту' not in idx
          assert 'font-size: 12px' in idx and 'font-size: 10px' in idx
          PY
      - name: Commit deployed PASS 7C surface
        run: |
          git config user.name 'nd-automation'
          git config user.email 'namelessdhamma@gmail.com'
          git add mind-tides/index.html
          git commit -m 'Deploy Mind Tides PASS 7C repaired candidate' || exit 0
          git push
