name: ND VK runtime bootstrap audit

on:
  push:
    branches:
      - qualify/vk-gateway-runtime
      - qualify/vk-intelligence-router
    paths:
      - 'deploy/nd-vk-gateway/**'
      - 'tmp/nd_vk_gateway_v54_vault_paths.py'
      - '.github/workflows/nd-vk-runtime-audit.yml'
  pull_request:
    paths:
      - 'deploy/nd-vk-gateway/**'
      - 'tmp/nd_vk_gateway_v54_vault_paths.py'
      - '.github/workflows/nd-vk-runtime-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: |
          python -m unittest deploy/nd-vk-gateway/test_audit_runtime_bootstrap.py
          python -m unittest deploy/nd-vk-gateway/test_v54_vault_paths.py
      - name: Validate lock JSON
        run: python -m json.tool deploy/nd-vk-gateway/runtime-dependency-lock.v1.json >/dev/null
      - name: Validate intelligence qualification artifacts
        run: |
          python -m json.tool deploy/nd-vk-gateway/intelligence-candidates.v1.json >/dev/null
          python -m json.tool deploy/nd-vk-gateway/intelligence-suite.v1.json >/dev/null
          python -m py_compile deploy/nd-vk-gateway/run_intelligence_qualification.py
          python -m py_compile tmp/nd_vk_gateway_v54_vault_paths.py
          python deploy/nd-vk-gateway/run_intelligence_qualification.py --catalog-only
      - name: Build immutable VK runtime image
        run: docker build -f deploy/nd-vk-gateway/Dockerfile -t nd-vk-runtime:ci .
      - name: Re-audit built runtime filesystem
        run: docker run --rm --entrypoint python3 nd-vk-runtime:ci /app/audit_runtime_bootstrap.py /app
      - name: Compile packaged Python sources
        run: docker run --rm --entrypoint python3 nd-vk-runtime:ci -m compileall -q /app
      - name: Syntax-check packaged JavaScript sources
        run: |
          docker run --rm --entrypoint sh nd-vk-runtime:ci -c '
            set -eu
            find /app -type f \( -name "*.js" -o -name "*.mjs" \) -print | sort > /tmp/js-files
            test -s /tmp/js-files
            while IFS= read -r f; do
              node --check "$f" >/dev/null
            done < /tmp/js-files
          '
      - name: Export vendor manifest evidence
        run: |
          cid=$(docker create nd-vk-runtime:ci)
          docker cp "$cid:/app/vendor/vendor-manifest.json" vendor-manifest.json
          docker rm "$cid" >/dev/null
          python -m json.tool vendor-manifest.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nd-vk-runtime-vendor-manifest-${{ github.sha }}
          path: vendor-manifest.json
          if-no-files-found: error
          retention-days: 30
