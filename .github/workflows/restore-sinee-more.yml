name: Guard ND product release surfaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted product surfaces exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for path in \
            sinee-more/index.html \
            sinee-more/app.js \
            sinee-more/ai/engine.js \
            mind-tides/index.html; do
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Accepted product surface is missing. Guard is fail-closed; it will not restore a stale historical snapshot."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Accepted Sinee More and Mind Tides release surfaces are present."
