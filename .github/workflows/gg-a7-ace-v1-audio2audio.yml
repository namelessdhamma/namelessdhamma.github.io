name: A7 ACE v1 guide-audio fallback
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".github/workflows/gg-a7-ace-v1-audio2audio.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover accepted OpenUtau guide
        uses: actions/download-artifact@v4
        with:
          name: gg-mimosa-dark-long-human-vocal-final
          run-id: 37199773797
          github-token: ${{ github.token }}
          path: /tmp/guide
      - name: ACE v1 audio-to-audio
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "gradio_client>=1.8,<2"
          guide="$(find /tmp/guide -type f -name '*.wav' | head -n 1)"
          test -n "$guide"
          export GUIDE="$guide"
          mkdir -p "${GITHUB_WORKSPACE}/ace-v1"
          python - <<'PY'
          import os, pathlib, shutil, json
          from gradio_client import Client, handle_file
          guide=os.environ["GUIDE"]
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"ace-v1"
          client=Client("ACE-Step/ACE-Step", verbose=True)
          prompt=("solo female Russian a cappella, natural human singing voice, dry close studio vocal, "
                  "smooth coarticulation and syllable transitions, relaxed expressive delivery, "
                  "no instruments, no backing vocals, preserve source melody rhythm and phrasing")
          lyrics="[verse]\nЯ говорил не с ним, а с тем, кто долго стоял у окна и ждал"
          for strength,seed in [(0.72,"74021"),(0.88,"74022")]:
              result=client.predict(
                13.5,prompt,lyrics,60,15.0,"euler","apg",10.0,seed,
                0.5,0.0,3.0,True,False,True,"","0","0",
                True,strength,handle_file(guide),"none",
                api_name="/__call__"
              )
              audio=result[0] if isinstance(result,(tuple,list)) else result
              def path_of(x):
                  if isinstance(x,str): return x
                  if isinstance(x,dict): return x.get("path") or x.get("name")
                  return getattr(x,"path",None) or getattr(x,"name",None)
              p=path_of(audio)
              if not p or not pathlib.Path(p).exists():
                  raise RuntimeError(f"no audio returned at strength {strength}: {result!r}")
              dst=out/f"ACEv1_A2A_strength_{str(strength).replace('.','')}.wav"
              shutil.copy2(p,dst)
              print("SAVED",dst,dst.stat().st_size)
          (out/"metadata.json").write_text(json.dumps({"prompt":prompt,"lyrics":lyrics},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a7-ace-v1-a2a
          path: ace-v1/
          retention-days: 3
          if-no-files-found: warn
