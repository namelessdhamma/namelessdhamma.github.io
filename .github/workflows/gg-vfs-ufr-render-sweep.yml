name: GG VFS commercial female sweep
on:
  push:
    branches:
      - "experiment/gg-vfs-female-sweep-20261004"
    paths:
      - ".github/workflows/gg-vfs-ufr-render-sweep.yml"
      - ".nd-labs/gg-vfs/ufr_render_sweep.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install numpy==1.26.4 scipy==1.13.1 librosa==0.9.2 onnxruntime==1.16.3 pyyaml pypinyin soundfile tqdm diffsinger-utau==0.3.8
      - name: Recover cached ready-made UFR pack
        uses: actions/download-artifact@v4
        with:
          name: gg-vfs-kumi-discovery
          run-id: 37178003583
          github-token: ${{ github.token }}
          path: /tmp/ufr-cache
      - name: Extract ready-made UFR DiffSinger pack
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/ufr-cache -maxdepth 3 -type f -printf '%p %s bytes\n'
          pack="$(find /tmp/ufr-cache -type f -name 'ufr-pack.download' -print -quit)"
          test -n "$pack"
          mkdir -p /tmp/ufr
          unzip -q "$pack" -d /tmp/ufr
          root="$(find /tmp/ufr -type f -path '*/0_CORE/dsacoustic/millefeuille_v001.phonemes.json' -printf '%h\n' | sed 's#/0_CORE/dsacoustic$##' | head -n 1)"
          test -n "$root"
          echo "UFR_ROOT=$root" >> "$GITHUB_ENV"
          echo "Resolved UFR root: $root"
      - name: Render Russian comparison tracks
        run: |
          python .nd-labs/gg-vfs/ufr_render_sweep.py "$UFR_ROOT" gg-vocal-female-sweep
          cat gg-vocal-female-sweep/render-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vocal-commercial-female-sweep
          path: gg-vocal-female-sweep/
          retention-days: 3
