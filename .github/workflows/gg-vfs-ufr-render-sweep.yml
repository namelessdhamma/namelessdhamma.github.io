name: GG VFS commercial female sweep
on:
  push:
    branches:
      - "experiment/gg-vfs-female-sweep-20261004"
    paths:
      - ".github/workflows/gg-vfs-ufr-render-sweep.yml"
      - ".nd-labs/gg-vfs/ufr_render_sweep.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install numpy==1.26.4 scipy==1.13.1 librosa==0.9.2 onnxruntime==1.16.3 pyyaml pypinyin soundfile tqdm gdown diffsinger-utau==0.3.8
      - name: Download ready-made UFR DiffSinger pack
        run: |
          gdown "https://drive.google.com/uc?id=1Ve9cqJypDglNRPtjw-RoMqbin-xvU-WW" -O /tmp/ufr.zip
          mkdir -p /tmp/ufr
          unzip -q /tmp/ufr.zip -d /tmp/ufr
          test -f "/tmp/ufr/UFR-V1.0/UFR-V1.0/0_CORE/dsacoustic/millefeuille_v001.phonemes.json"
      - name: Render Russian comparison tracks
        run: |
          python .nd-labs/gg-vfs/ufr_render_sweep.py "/tmp/ufr/UFR-V1.0/UFR-V1.0" gg-vocal-female-sweep
          cat gg-vocal-female-sweep/render-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vocal-commercial-female-sweep
          path: gg-vocal-female-sweep/
          retention-days: 3
