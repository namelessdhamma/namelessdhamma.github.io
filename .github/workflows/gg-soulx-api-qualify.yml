name: GG SoulX SVC API qualification
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-soulx-api-qualify.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gradio_client
          python - <<'PY'
          import json
          from gradio_client import Client
          c=Client("Soul-AILab/SoulX-Singer",verbose=False)
          api=c.view_api(return_format="dict")
          print("NAMED", list(api.get("named_endpoints",{}).keys()))
          for k,v in api.get("named_endpoints",{}).items():
              if "svc" in k.lower() or any((p.get("label","").lower().startswith(("prompt audio","target audio","n_step","cfg")) for p in v.get("parameters",[]))):
                  print("ENDPOINT",k)
                  print(json.dumps(v,ensure_ascii=False,indent=2))
          PY
