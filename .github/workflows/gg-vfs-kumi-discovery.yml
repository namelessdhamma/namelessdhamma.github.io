name: GG VFS UFR Kumi discovery
on:
  push:
    branches:
      - "experiment/gg-vfs-female-sweep-20261004"
    paths:
      - ".github/workflows/gg-vfs-kumi-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download UFR pack
        run: |
          mkdir -p out
          python -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=1Ve9cqJypDglNRPtjw-RoMqbin-xvU-WW" -O out/ufr-pack.download || true
          ls -lh out
          file out/ufr-pack.download || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vfs-kumi-discovery
          path: out/
          retention-days: 1
