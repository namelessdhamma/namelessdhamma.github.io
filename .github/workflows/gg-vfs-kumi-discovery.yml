name: GG VFS UFR female-pack audit
on:
  push:
    branches:
      - "experiment/gg-vfs-female-sweep-20261004"
    paths:
      - ".github/workflows/gg-vfs-kumi-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and inspect UFR pack
        run: |
          set -e
          mkdir -p report
          python -m pip install --quiet gdown
          gdown "https://drive.google.com/uc?id=1Ve9cqJypDglNRPtjw-RoMqbin-xvU-WW" -O /tmp/ufr-pack
          stat -c "bytes=%s" /tmp/ufr-pack > report/pack-info.txt
          file /tmp/ufr-pack >> report/pack-info.txt
          if unzip -tqq /tmp/ufr-pack >/dev/null 2>&1; then
            echo "archive=zip" >> report/pack-info.txt
            unzip -l /tmp/ufr-pack | grep -Ei "Hitsune|Kumi|Mimosa|Saiun|character|dsconfig|phoneme|vocoder" > report/relevant-entries.txt || true
          else
            echo "archive=not_zip" >> report/pack-info.txt
            head -c 256 /tmp/ufr-pack | xxd >> report/pack-info.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gg-vfs-ufr-female-pack-audit
          path: report/
          retention-days: 1
