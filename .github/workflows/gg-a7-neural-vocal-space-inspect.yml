name: A7 Neural Vocal Space Inspect
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".github/workflows/gg-a7-neural-vocal-space-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect Seed-VC SVC public API
        run: |
          python -m pip install -q "gradio_client>=1.8,<2" "huggingface_hub>=0.35"
          python - <<'PY'
          from huggingface_hub import HfApi
          from gradio_client import Client
          import json
          targets=["Plachta/Seed-VC","Uniaff/Seed-VC","vincenthugging/Seed-VC","frascuchon/Seed-VC"]
          api=HfApi()
          for sid in targets:
              print("\n=== SPACE",sid,"===")
              try:
                  info=api.space_info(sid,expand=["runtime","sha","sdk"])
                  rt=info.runtime
                  print("RUNTIME",json.dumps({
                    "stage":getattr(rt,"stage",None) if rt else None,
                    "hardware":getattr(rt,"hardware",None) if rt else None,
                    "requested":getattr(rt,"requested_hardware",None) if rt else None,
                    "sha":info.sha,"sdk":info.sdk
                  }))
                  c=Client(sid,verbose=False)
                  d=c.view_api(return_format="dict")
                  named=d.get("named_endpoints",d)
                  for name,v in named.items():
                      pars=[(p.get("parameter_name"),p.get("parameter_has_default"),p.get("parameter_default")) for p in v.get("parameters",[])]
                      rets=[q.get("label") for q in v.get("returns",[])]
                      blob=(name+" "+" ".join(str(x) for x in pars+rets)).lower()
                      if any(k in blob for k in ["sing","svc","convert","source","reference","audio"]):
                          print("ENDPOINT",name,json.dumps({"params":pars,"returns":rets},ensure_ascii=False))
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:800])
          PY
