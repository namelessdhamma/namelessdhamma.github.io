name: A7 Neural Vocal Space Inspect
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".github/workflows/gg-a7-neural-vocal-space-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect optimized ACE-Step ZeroGPU forks
        run: |
          python -m pip install -q "gradio_client>=1.8,<2" "huggingface_hub>=0.35"
          python - <<'PY'
          from gradio_client import Client
          from huggingface_hub import HfApi
          import json
          targets=[
            "Opera8/Ace",
            "Kansasfan/Ace-Step-v1.5",
            "Blursed/Ace-Step-v1.5",
            "Blursed/ACE-Step-1.5-XL-ENHANCED",
            "multimodalart/Ace-Step-v1.5",
            "DarkCAlex/my-song-engine",
            "MBLF/ACE-Step-1.5",
          ]
          api=HfApi()
          for t in targets:
              print("\n=== SPACE",t,"===")
              try:
                  info=api.space_info(t,expand=["runtime","sha","sdk"])
                  rt=info.runtime
                  print("RUNTIME",json.dumps({
                    "stage":getattr(rt,"stage",None) if rt else None,
                    "hardware":getattr(rt,"hardware",None) if rt else None,
                    "sha":info.sha,"sdk":info.sdk
                  }))
                  c=Client(t,verbose=False)
                  d=c.view_api(return_format="dict")
                  named=d.get("named_endpoints",d)
                  for name,v in named.items():
                      pars=[(p.get("parameter_name"),p.get("parameter_has_default"),p.get("parameter_default")) for p in v.get("parameters",[])]
                      rets=[q.get("label") for q in v.get("returns",[])]
                      blob=(name+" "+" ".join(str(x) for x in pars+rets)).lower()
                      if any(k in blob for k in ["generate","generation","cover","audio2audio","source audio"]):
                          print("ENDPOINT",name,json.dumps({"params":pars,"returns":rets[:12]},ensure_ascii=False))
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:600])
          PY
