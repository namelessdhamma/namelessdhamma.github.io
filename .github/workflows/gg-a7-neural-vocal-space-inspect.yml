name: A7 Neural Vocal Space Inspect
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".github/workflows/gg-a7-neural-vocal-space-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Find warm plain-turbo ACE Spaces
        run: |
          python -m pip install -q "gradio_client>=1.8,<2" "huggingface_hub>=0.35" requests
          python - <<'PY'
          from huggingface_hub import HfApi
          from gradio_client import Client
          import requests,json,concurrent.futures
          api=HfApi()
          meta=requests.get("https://huggingface.co/api/models/ACE-Step/Ace-Step1.5",timeout=30).json()
          spaces=[]
          for x in meta.get("spaces",[]) or []:
              sid=x if isinstance(x,str) else x.get("id") or x.get("repo_id") or x.get("name")
              if sid and sid not in spaces: spaces.append(sid)
          def runtime(sid):
              try:
                  info=api.space_info(sid,expand=["runtime"])
                  rt=info.runtime
                  if rt and getattr(rt,"stage",None)=="RUNNING" and str(getattr(rt,"hardware","")).startswith("zero-"):
                      return sid
              except: pass
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              zero=[x for x in ex.map(runtime,spaces[:120]) if x]
          print("ZERO_COUNT",len(zero))
          rows=[]
          def inspect(sid):
              try:
                  d=Client(sid,verbose=False).view_api(return_format="dict")
                  ep=d.get("named_endpoints",d).get("/generation_wrapper")
                  if not ep:return {"id":sid,"error":"no_generation_wrapper"}
                  ps=ep.get("parameters",[])
                  defaults={p.get("parameter_name"):p.get("parameter_default") for p in ps}
                  return {"id":sid,"model":defaults.get("selected_model"),"steps":defaults.get("param_10"),
                          "batch":defaults.get("param_16"),"duration":defaults.get("param_15"),
                          "mode":defaults.get("generation_mode")}
              except Exception as e:
                  return {"id":sid,"error":type(e).__name__+":"+str(e)[:100]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for row in ex.map(inspect,zero): rows.append(row)
          print("ROWS",json.dumps(rows,ensure_ascii=False))
          print("PLAIN_TURBO",json.dumps([r for r in rows if r.get("model")=="acestep-v15-turbo"],ensure_ascii=False))
          PY
