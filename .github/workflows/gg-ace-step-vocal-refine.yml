name: GG ACE-Step vocal refinement qualification
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-ace-step-vocal-refine.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Recover accepted OpenUtau source
        uses: actions/download-artifact@v4
        with:
          name: gg-mimosa-dark-long-human-vocal-final
          run-id: 37199773797
          github-token: ${{ github.token }}
          path: source
      - name: Call official free ACE-Step 1.5 cover renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gradio_client
          src="$(find source -type f -name '*.wav' -print -quit)"
          test -n "$src"
          mkdir -p refined
          python - "$src" <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          from gradio_client import Client, handle_file

          src=sys.argv[1]
          client=Client("ACE-Step/Ace-Step-v1.5", verbose=False)
          lyrics="Я говорил не с ним, а с тем, кто долго стоял у окна и ждал"
          prompt=(
              "solo female Russian a cappella vocal; intimate expressive human singing; "
              "preserve the exact source melody, rhythm, phrase contour and lyric order; "
              "natural Russian coarticulation and palatalization; fluid consonant-to-vowel and syllable transitions; "
              "relaxed breath-supported tone; natural attacks and releases; no accompaniment; "
              "no robotic articulation, no metallic halo, no synthetic syllable seams"
          )
          kwargs=dict(
              selected_model="acestep-v15-xl-turbo",
              generation_mode="cover",
              simple_query_input="",
              simple_vocal_language="ru",
              param_4=prompt,
              param_5=lyrics,
              param_6=72,
              param_7="A minor",
              param_8="4",
              param_9="ru",
              param_10=8,
              param_11=7.0,
              param_12=False,
              param_13="6142026",
              param_14=handle_file(src),
              param_15=14.0,
              param_16=2,
              param_17=handle_file(src),
              param_18="",
              param_19=0.0,
              param_20=-1.0,
              param_21="Fill the audio semantic mask based on the given conditions:",
              param_22=0.92,
              param_23="cover",
              param_24=False,
              param_25=0.0,
              param_26=1.0,
              param_27=3.0,
              param_28="ode",
              param_29="",
              param_30="flac",
              param_31=0.75,
              param_32=False,
              param_33=2.0,
              param_34=0,
              param_35=0.9,
              param_36="robotic vocal, metallic resonance, syllable seams, hard phoneme cuts, accompaniment, instruments",
              param_37=False,
              param_38=False,
              param_39=False,
              param_41=False,
              param_42=False,
              param_43=True,
              param_44=True,
              param_45=0.5,
              param_46=8,
              param_47="vocals",
              param_48=[],
              param_49=False,
          )
          print("ACE_SUBMIT")
          result=client.predict(api_name="/generation_wrapper", **kwargs)
          print("ACE_RETURN_TYPE", type(result), len(result) if hasattr(result,"__len__") else None)
          out=Path("refined")
          manifest={"source":src,"lyrics":lyrics,"prompt":prompt,"cover_strength":0.92,"seed":"6142026","items":[]}
          if not isinstance(result,(list,tuple)):
              result=[result]
          for i,item in enumerate(result[:8],1):
              if not item:
                  continue
              p=None
              if isinstance(item,str):
                  p=item
              elif isinstance(item,dict):
                  p=item.get("path") or item.get("url")
              elif hasattr(item,"path"):
                  p=item.path
              if p and os.path.exists(p):
                  dst=out/f"ACE_Sample_{i}{Path(p).suffix or '.flac'}"
                  shutil.copy2(p,dst)
                  manifest["items"].append({"index":i,"path":str(dst),"size":dst.stat().st_size})
          # keep compact evidence from metadata/status fields
          manifest["result_types"]=[type(x).__name__ for x in result]
          manifest["generation_details"]=str(result[9])[:4000] if len(result)>9 else ""
          manifest["generation_status"]=str(result[10])[:2000] if len(result)>10 else ""
          manifest["seed_return"]=str(result[11])[:200] if len(result)>11 else ""
          Path("refined/manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(Path("refined/manifest.json").read_text())
          if not manifest["items"]:
              raise SystemExit("ACE-Step returned no downloadable audio")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ace-step-vocal-refinement
          path: refined/
          retention-days: 3
          if-no-files-found: warn
