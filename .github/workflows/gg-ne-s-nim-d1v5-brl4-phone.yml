name: GG Ne S Nim D1v5 brl4 phone test

on:
  push:
    branches:
      - compute/gg-ne-s-nim-d1v5-brl4-phones-20261006
    paths:
      - '.github/workflows/gg-ne-s-nim-d1v5-brl4-phone.yml'
      - 'docs/gg/songs/ne-s-nim-d1-v5-brl4-phone-test.json'
      - '.nd-labs/gg-songs/GGNeSNimBrl4PhoneTest.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git unzip ffmpeg libicu-dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ASR
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q faster-whisper==1.1.1 jiwer==3.0.4 soundfile requests pyyaml

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimBrl4PhoneTest.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimBrl4PhoneTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimBrl4PhoneTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimBrl4PhoneTest.cs

          curl -fL --retry 3 -o /tmp/awata.zip \
            https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"
          fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          if not (dst/'vocoder.yaml').exists():
              arc=pathlib.Path('/tmp/ezv.oudep')
              arc.write_bytes(urllib.request.urlopen(
                  'https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',
                  timeout=300).read())
              dst.mkdir(exist_ok=True)
              with zipfile.ZipFile(arc) as z:
                  names={n.replace('\\','/'):n for n in z.namelist()}
                  cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
                  data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
                  m=next(n for n in names if n.split('/')[-1]==model)
                  (dst/'vocoder.yaml').write_bytes(data)
                  with z.open(names[m]) as inf,(dst/model).open('wb') as out:
                      shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Build once
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release

      - name: Render timing variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/guides"
          cd /tmp/openutau
          for spec in \
            BASE:0:0 \
            V40Z40:-40:-40 \
            V60Z60:-60:-60 \
            V80Z80:-80:-80 \
            V60Z100:-60:-100 \
            V100Z60:-100:-60
          do
            IFS=: read tag vo zo <<< "$spec"
            echo "=== $tag v=$vo z=$zo ==="
            OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
            GG_VFS_OUT="$GITHUB_WORKSPACE/guides" \
            GG_VFS_TAG="BRL4_${tag}" \
            GG_VFS_SPEAKER_HINT="Mature" \
            GG_VFS_VARIANT="bridge_test" \
            GG_VFS_STEPS="64" \
            GG_SHARED_SCORE="$GITHUB_WORKSPACE/docs/gg/songs/ne-s-nim-d1-v5-brl4-phone-test.json" \
            GG_BR_V_OFFSET_TICKS="$vo" \
            GG_BR_Z_OFFSET_TICKS="$zo" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj \
              --configuration Release --no-build --filter RenderNeSNimBrl4PhoneTest
          done
          ls -lh "$GITHUB_WORKSPACE/guides"

      - name: Rank variants with phrase ASR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib
          from faster_whisper import WhisperModel
          from jiwer import wer,cer

          target="былого что осталось неизменным"
          def norm(s):
              s=s.lower().replace('ё','е')
              s=re.sub(r'[^а-я0-9 ]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          model=WhisperModel('small',device='cpu',compute_type='int8')
          rows=[]
          for path in sorted(pathlib.Path('guides').glob('BRL4_*__OPENUTAU_RU_QC.wav')):
              tag=path.name.split('__')[0].replace('BRL4_','')
              segs,_=model.transcribe(str(path),language='ru',beam_size=5,vad_filter=False,
                                      condition_on_previous_text=False,temperature=0.0)
              txt=' '.join(x.text.strip() for x in list(segs)).strip()
              nt,nr=norm(target),norm(txt)
              rows.append({'tag':tag,'transcript':txt,
                           'wer':float(wer(nt,nr)),'cer':float(cer(nt,nr))})
          rows.sort(key=lambda x:(x['cer'],x['wer']))
          result={'target':target,'winner':rows[0],'variants':rows,
                  'status':'PASS' if rows[0]['cer']<=0.20 else 'REJECT'}
          pathlib.Path('guides/qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['status']!='PASS':
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ne-s-nim-d1v5-brl4-phone-test
          path: |
            guides/*.wav
            guides/*manifest.txt
            guides/qa.json
          retention-days: 7
          if-no-files-found: warn
