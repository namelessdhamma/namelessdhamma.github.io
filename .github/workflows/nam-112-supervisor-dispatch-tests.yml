name: NAM-112 Supervisor Dispatch Prototype

on:
  push:
    branches:
      - nam-112-supervisor-dispatch-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dispatch unit tests
        run: python -m unittest -v tmp/test_nd_supervisor_dispatch_v01.py tmp/test_nd_supervisor_dispatch_v02.py tmp/test_nd_supervisor_resolver_v01.py
