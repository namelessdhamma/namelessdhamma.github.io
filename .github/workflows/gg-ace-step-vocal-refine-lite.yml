name: GG ACE-Step vocal refinement lite
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-ace-step-vocal-refine-lite.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Recover accepted OpenUtau source
        uses: actions/download-artifact@v4
        with:
          name: gg-mimosa-dark-long-human-vocal-final
          run-id: 37199773797
          github-token: ${{ github.token }}
          path: source
      - name: Prepare short qualification phrase
        shell: bash
        run: |
          set -euo pipefail
          src="$(find source -type f -name '*.wav' -print -quit)"
          test -n "$src"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -t 5.8 -ar 44100 -ac 1 source-short.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 source-short.wav
      - name: ACE-Step 1.5 lightweight cover
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gradio_client
          mkdir -p refined
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from gradio_client import Client, handle_file
          client=Client("ACE-Step/Ace-Step-v1.5", verbose=False)
          lyrics="Я говорил не с ним"
          prompt=(
              "solo female Russian a cappella vocal, intimate natural human singing, "
              "preserve source melody and timing closely, clear Russian diction, "
              "continuous coarticulation, soft consonant-vowel transitions, natural palatalization, "
              "relaxed breath-supported tone, no instruments, no robotic seams, no metallic resonance"
          )
          result=client.predict(
              selected_model="acestep-v15-turbo",
              generation_mode="cover",
              simple_query_input="",
              simple_vocal_language="ru",
              param_4=prompt,
              param_5=lyrics,
              param_6=72,
              param_7="A minor",
              param_8="4",
              param_9="ru",
              param_10=4,
              param_11=6.0,
              param_12=False,
              param_13="6142026",
              param_14=None,
              param_15=6.0,
              param_16=1,
              param_17=handle_file("source-short.wav"),
              param_18="",
              param_19=0.0,
              param_20=-1.0,
              param_21="Fill the audio semantic mask based on the given conditions:",
              param_22=0.88,
              param_23="cover",
              param_24=False,
              param_25=0.0,
              param_26=1.0,
              param_27=3.0,
              param_28="ode",
              param_29="",
              param_30="flac",
              param_31=0.70,
              param_32=False,
              param_33=1.8,
              param_34=0,
              param_35=0.9,
              param_36="robotic articulation, metallic resonance, hard phoneme cuts, instruments",
              param_37=False,
              param_38=False,
              param_39=False,
              param_41=False,
              param_42=False,
              param_43=False,
              param_44=False,
              param_45=0.5,
              param_46=4,
              param_47="vocals",
              param_48=[],
              param_49=False,
              api_name="/generation_wrapper"
          )
          out=Path("refined")
          if not isinstance(result,(list,tuple)): result=[result]
          manifest={"items":[],"types":[type(x).__name__ for x in result],"status":str(result[10])[:2000] if len(result)>10 else ""}
          for i,item in enumerate(result[:8],1):
              p=None
              if isinstance(item,str): p=item
              elif isinstance(item,dict): p=item.get("path") or item.get("url")
              elif hasattr(item,"path"): p=item.path
              if p and os.path.exists(p):
                  dst=out/f"ACE_Lite_{i}{Path(p).suffix or '.flac'}"
                  shutil.copy2(p,dst)
                  manifest["items"].append({"index":i,"path":str(dst),"size":dst.stat().st_size})
          Path("refined/manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(Path("refined/manifest.json").read_text())
          if not manifest["items"]:
              raise SystemExit("ACE-Step returned no audio")
          PY
      - name: Basic independent QC
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install faster-whisper soundfile librosa==0.10.2.post1 numpy
          python - <<'PY'
          import json,re
          from pathlib import Path
          import numpy as np, soundfile as sf, librosa
          from faster_whisper import WhisperModel
          model=WhisperModel("small",device="cpu",compute_type="int8")
          target="я говорил не с ним"
          def norm(s):
              s=s.lower().replace("ё","е"); s=re.sub(r"[^а-я\s]"," ",s)
              return re.sub(r"\s+"," ",s).strip()
          rows=[]
          for p in sorted(Path("refined").glob("ACE_Lite_*")):
              segs,_=model.transcribe(str(p),language="ru",beam_size=5,word_timestamps=True,temperature=0.0,condition_on_previous_text=False)
              segs=list(segs)
              text=norm(" ".join(x.text for x in segs))
              probs=[float(w.probability) for s in segs for w in (s.words or [])]
              y,sr=sf.read(p)
              if y.ndim>1:y=y.mean(axis=1)
              f0,_,_=librosa.pyin(y,fmin=librosa.note_to_hz("C2"),fmax=librosa.note_to_hz("C6"),sr=sr,frame_length=2048,hop_length=256)
              idx=np.where(np.isfinite(f0))[0]; jump=1.0
              if len(idx)>4:
                  vals=f0[idx]; d=1200*np.log2(vals[1:]/vals[:-1]); d=d[np.diff(idx)==1]
                  if len(d): jump=float(np.mean(np.abs(d)>350))
              rows.append({"file":p.name,"text":text,"exact":text==target,"mean_word":float(np.mean(probs)) if probs else 0.0,"gross_jump_rate":jump})
          Path("refined/qc.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          if not any(r["exact"] and r["gross_jump_rate"]<0.03 for r in rows):
              raise SystemExit("No ACE lightweight candidate passed basic QC")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ace-step-vocal-refinement-lite
          path: refined/
          retention-days: 3
          if-no-files-found: warn
