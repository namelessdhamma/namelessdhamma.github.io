name: GG Cloud Music Worker

on:
  push:
    branches:
      - gg/cloud-music-worker-v1
    paths:
      - 'gg-cloud-jobs/*.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Applio inference cache
        uses: actions/cache@v4
        with:
          path: .gg-applio-cache
          key: gg-applio-cpu-v2-${{ runner.os }}-324f4d89
      - name: Install free cloud studio runtime
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ardour curl ca-certificates jq python3 python3-pip xvfb dbus-x11 ffmpeg fluidsynth tar gzip unzip xauth git xdotool x11-utils patchelf build-essential libsndfile1 libportaudio2
          for p in lsp-plugins-lv2 x42-plugins dragonfly-reverb surge-xt sfizz avldrums.lv2 calf-plugins fluid-soundfont-gm megatools; do
            if apt-cache show "$p" >/dev/null 2>&1; then apt-get install -y --no-install-recommends "$p" || true; fi
          done
          echo 'GG_WORKER_RUNTIME=READY'
      - name: Resolve job marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          MARKER="gg-cloud-jobs/current.json"
          test -f "$GITHUB_WORKSPACE/$MARKER"
          JOB_FILE="$(jq -r '.job_file // empty' "$GITHUB_WORKSPACE/$MARKER")"
          if [ -n "$JOB_FILE" ]; then
            case "$JOB_FILE" in gg-cloud-jobs/*.json) MARKER="$JOB_FILE" ;; *) exit 2 ;; esac
            test -f "$GITHUB_WORKSPACE/$MARKER"
          fi
          echo "marker=$MARKER" >> "$GITHUB_OUTPUT"
          echo "GG_MARKER=$MARKER"

      - name: Mint GitHub OIDC identity and execute job
        shell: bash
        env:
          MARKER: ${{ steps.marker.outputs.marker }}
          GG_EVIDENCE_DIR: ${{ github.workspace }}/gg-worker-evidence
          GG_APPLIO_CACHE_DIR: ${{ github.workspace }}/.gg-applio-cache
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=gg-cloud-studio" | jq -r .value)"
          test -n "$OIDC"
          JOB_ID="$(python3 -c 'import json,os;print(json.load(open(os.environ["MARKER"])).get("job_id",""))')"
          if [ -z "$JOB_ID" ]; then
            BOOTSTRAP_BODY="$(python3 -c 'import json,os;d=json.load(open(os.environ["MARKER"])); b=d["bootstrap"]; print(json.dumps({"operation":b["operation"],"payload":b.get("payload",{})}))')"
            JOB_ID="$(curl -fsSL -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data "$BOOTSTRAP_BODY" https://gg-cloud-music-studio.onrender.com/runner/bootstrap | jq -r .job_id)"
          fi
          test -n "$JOB_ID"
          echo "GG_JOB_ID=$JOB_ID"
          python3 tools/gg_cloud_music_worker.py --job-id "$JOB_ID" --oidc-token "$OIDC"

      - name: Preserve worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-worker-evidence-${{ github.run_id }}
          path: gg-worker-evidence/
          if-no-files-found: ignore
          retention-days: 7
