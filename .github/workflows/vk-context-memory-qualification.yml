name: VK Context Memory Qualification
on:
  push:
    branches: ["qualify/vk-context-memory"]
    paths:
      - "deploy/nd-vk-gateway/context_memory.py"
      - "deploy/nd-vk-gateway/context_memory_store.py"
      - "deploy/nd-vk-gateway/context_gateway.py"
      - "deploy/nd-vk-gateway/vendor_runtime.py"
      - "deploy/nd-vk-gateway/Dockerfile"
      - "deploy/nd-vk-gateway/test_context_memory.py"
      - "deploy/nd-vk-gateway/test_context_gateway.py"
      - "deploy/nd-vk-gateway/test_vendor_successor_patches.py"
      - "deploy/nd-vk-gateway/CONTEXT_MEMORY_DECISION.md"
      - ".github/workflows/vk-context-memory-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile deploy/nd-vk-gateway/context_memory.py deploy/nd-vk-gateway/context_memory_store.py deploy/nd-vk-gateway/context_gateway.py deploy/nd-vk-gateway/vendor_runtime.py deploy/nd-vk-gateway/test_context_memory.py deploy/nd-vk-gateway/test_context_gateway.py deploy/nd-vk-gateway/test_vendor_successor_patches.py
      - name: A-I plus durable-store plus integrated-dispatch regression suite
        working-directory: deploy/nd-vk-gateway
        run: python -m unittest -v test_context_memory.py test_context_gateway.py test_vendor_successor_patches.py
      - name: Static authority and budget assertions
        working-directory: deploy/nd-vk-gateway
        run: |
          python - <<'PY'
          import context_memory as m
          import context_memory_store as ms
          assert m.DEFAULT_PACKET_BUDGET == 10000
          assert m.DEEP_PACKET_BUDGET == 18000
          assert m.FAST_PACKET_BUDGET == 7000
          assert sum(m.LAYER_LIMITS.values()) <= 10000
          assert ms.SHARED_NOTES_FOLDER_ID == '1cF1qB25BZPKmtvgoXXkSMrEh_LnYJiRD'
          s=m.new_state('452972559')
          p=m.build_context_packet(s,'обычный вопрос')
          assert p['provider_agnostic'] is True
          assert p['authority_rule']=='fresh_authority_and_exact_artifact_state_override_derived_memory'
          print('VK_CONTEXT_MEMORY_STATIC_GATE_PASS')
          PY
      - name: Build immutable candidate and execute real vendoring patches
        run: docker build -f deploy/nd-vk-gateway/Dockerfile -t nd-vk-context-memory:candidate .
      - name: Inspect packaged context and successor manifest
        run: |
          docker run --rm --entrypoint python3 nd-vk-context-memory:candidate - <<'PY'
          import json, pathlib
          root=pathlib.Path('/app')
          for f in ('context_memory.py','context_memory_store.py','context_gateway.py'):
              assert (root/f).is_file(), f
          m=json.loads((root/'vendor/vendor-manifest.json').read_text())
          assert set(m['qualified_successor_patches_expected']) == {
              'readonly_vault_orientation_paths_v54','context_broker_args_v1','context_dispatch_hook_v1'
          }
          applied={p for e in m['entries'] for p in e.get('qualified_successor_patches',[])}
          assert applied==set(m['qualified_successor_patches_expected'])
          print('VK_CONTEXT_IMMUTABLE_IMAGE_GATE_PASS')
          PY
