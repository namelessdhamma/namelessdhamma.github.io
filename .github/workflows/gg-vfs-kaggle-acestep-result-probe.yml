name: GG VFS ACE-Step Kaggle direct result probe
on:
  workflow_dispatch:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-vfs-kaggle-acestep-result-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p result-probe
          python - <<'PY'
          import json,os,requests
          tok=os.environ["KAGGLE_API_TOKEN"]; user=os.environ["KAGGLE_USERNAME_SLUG"]; slug="gg-vfs-ace-2216c6d8342585e8"
          def pack(r):
              try:b=r.json()
              except:b=r.text[:6000]
              return {"status":r.status_code,"headers":{"location":r.headers.get("location"),"content-type":r.headers.get("content-type")},"body":b}
          H={"Authorization":"Bearer "+tok,"Accept":"application/json","Content-Type":"application/json"}
          r=requests.post("https://api.kaggle.com/v1/security.OAuthService/IntrospectToken",headers=H,json={"token":tok},timeout=30)
          result={"introspect":pack(r),"legacy":{}}
          for mode,auth in [("bearer",None),("basic",(user,tok))]:
              hdr={"Authorization":"Bearer "+tok} if mode=="bearer" else {}
              for endpoint in ["status","output"]:
                  url="https://www.kaggle.com/api/v1/kernels/"+endpoint
                  rr=requests.get(url,headers=hdr,auth=auth,params={"userName":user,"kernelSlug":slug},timeout=30,allow_redirects=False)
                  result["legacy"][mode+"_"+endpoint]=pack(rr)
          open("result-probe/probe.json","w").write(json.dumps(result,ensure_ascii=False,indent=2,default=str))
          print(json.dumps(result,ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gg-vfs-ace-step15-result-probe
          path: result-probe/
          retention-days: 1
          if-no-files-found: error
