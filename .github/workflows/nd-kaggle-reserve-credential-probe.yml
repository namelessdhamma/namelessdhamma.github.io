name: ND Kaggle Reserve Credential Probe

on:
  push:
    branches:
      - kaggle-ltx-github-reserve-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - name: Verify Kaggle credential availability and identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "ND_KAGGLE_RESERVE_SECRET=ABSENT"
            exit 2
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ["KAGGLE_API_TOKEN"]
          req=urllib.request.Request(
              "https://api.kaggle.com/v1/security.OAuthService/IntrospectToken",
              data=json.dumps({"token":token}).encode(),
              headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "Content-Type":"application/json",
                  "User-Agent":"nd-ltx-github-reserve-probe/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          if not data.get("active") or not data.get("username"):
              raise SystemExit("Kaggle token inactive or identity unavailable")
          expected=os.environ.get("KAGGLE_USERNAME_SLUG","").strip()
          if expected and data["username"] != expected:
              raise SystemExit("Kaggle username mismatch")
          print("ND_KAGGLE_RESERVE_SECRET=PRESENT")
          print("ND_KAGGLE_RESERVE_IDENTITY="+data["username"])
          PY
