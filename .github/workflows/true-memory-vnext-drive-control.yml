name: ND True Memory vNEXT Drive Control

on:
  push:
    paths:
      - '.nd-runtime/true-memory-vnext-command.json'

permissions:
  contents: write
  id-token: write

concurrency:
  group: nd-true-memory-vnext-drive
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute bounded True Memory vNEXT Drive command
        env:
          ENDPOINT: https://nd-notebooklm-oauth-mcp.vercel.app/doctor/github
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          cmd=Path('.nd-runtime/true-memory-vnext-command.json')
          outp=Path('.nd-runtime/true-memory-vnext-result.json')
          payload=json.loads(cmd.read_text(encoding='utf-8'))

          req_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          sep='&' if '?' in req_url else '?'
          token_url=req_url+sep+urllib.parse.urlencode({'audience':'nd-notebooklm'})
          req=urllib.request.Request(
              token_url,
              headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              oidc=json.load(r)['value']

          raw=json.dumps(payload,ensure_ascii=False).encode('utf-8')
          call=urllib.request.Request(
              os.environ['ENDPOINT'],
              data=raw,
              method='POST',
              headers={
                  'Authorization':'Bearer '+oidc,
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'nd-true-memory-vnext-drive-control/1.0',
              },
          )
          try:
              with urllib.request.urlopen(call,timeout=150) as r:
                  body=r.read().decode('utf-8','replace')
                  result=json.loads(body) if body else {}
                  status=r.status
          except urllib.error.HTTPError as e:
              status=e.code
              body=e.read().decode('utf-8','replace')
              try: result=json.loads(body)
              except Exception: result={'ok':False,'error':'http_'+str(status),'detail':body[:1200]}

          out={'request_id':payload.get('request_id'),'status_code':status,'response':result}
          outp.parent.mkdir(parents=True,exist_ok=True)
          outp.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nd-runtime/true-memory-vnext-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "runtime(true-memory): persist vNEXT Drive result [skip ci]"
          git pull --rebase origin main
          git push origin main
