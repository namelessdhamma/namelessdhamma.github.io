name: GG VFS Awata v3 optional-variance-compatible singing
on:
  push:
    branches: [experiment/gg-vfs-awata-v3]
    paths: [.github/workflows/gg-vfs-awata-compat.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-vocal-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU-only inference packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet 'numpy==1.26.4' 'scipy==1.13.1' 'librosa==0.9.2' 'onnxruntime==1.16.3' 'pyyaml>=6' 'pypinyin>=0.50' soundfile tqdm
          python -m pip install --disable-pip-version-check --quiet --no-deps diffsinger-utau==0.3.8
      - name: Retrieve licensed female voicebank and upstream vocoder for noncommercial audition
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 400 -o awata-v3.zip https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          unzip -tqq awata-v3.zip
          mkdir awata
          unzip -q awata-v3.zip -d awata
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 160 -o vocoder.oudep https://github.com/openvpi/vocoders/releases/download/pc-nsf-hifigan-44.1k-hop512-128bin-2025.02/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02.oudep
          unzip -tqq vocoder.oudep
          mkdir -p awata/Awata_Weak_DS_v3/dsvocoder
          unzip -q vocoder.oudep -d awata/Awata_Weak_DS_v3/dsvocoder
          python - <<'PY'
          from pathlib import Path
          import yaml
          root=Path('awata/Awata_Weak_DS_v3/dsvocoder')
          cfg=root/'vocoder.yaml'
          files=list(root.rglob('*'))
          print('Vocoder package files',[(str(p.relative_to(root)),p.stat().st_size) for p in files if p.is_file()])
          if not cfg.exists():
              models=[p for p in root.rglob('*.onnx') if p.is_file()]
              if not models:raise RuntimeError('No ONNX vocoder in official dependency')
              rel=str(models[0].relative_to(root))
              cfg.write_text(yaml.safe_dump({'name':'pc_nsf_hifigan_44.1k_hop512_128bin_2025.02','model':rel,'num_mel_bins':128,'hop_size':512,'sample_rate':44100,'win_size':2048,'fft_size':2048,'mel_fmin':40,'mel_fmax':16000,'mel_base':'e','mel_scale':'slaney','pitch_controllable':True,'force_on_cpu':True}))
          print('Vocoder config',cfg.read_text()[:2000])
          PY
      - name: Actual three-voice acoustic model and vocoder inference
        shell: bash
        run: |
          python .nd-labs/gg-vfs/gg_vfs_render_direct.py
          find gg-vocal-audition -maxdepth 1 -name '*REAL_SINGING.wav' -type f -print
          test "$(find gg-vocal-audition -maxdepth 1 -name '*REAL_SINGING.wav' -type f | wc -l)" -ge 1
      - name: Save genuine rendered WAV and audit, not copyrighted model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-vfs-awata-v3-actual-russian-singing
          path: gg-vocal-audition/
          retention-days: 2
          if-no-files-found: ignore
