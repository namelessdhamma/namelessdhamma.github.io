name: ND Mail Daily

on:
  schedule:
    # Two checks 12 hours apart: 15:07 and 03:07 Asia/Bangkok.
    - cron: "7 8 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_USER: namelessdhamma@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.ND_MAIL_GMAIL_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.ND_MAIL_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.ND_MAIL_TELEGRAM_CHAT_ID }}
      ND_MAIL_MONITOR_ENABLED: "true"
      ND_MAIL_TIMEZONE: "Asia/Bangkok"
    steps:
      - uses: actions/checkout@v4
      - name: Check Gmail and notify Telegram
        run: python3 tmp/nd_mail_monitor_v1.py
