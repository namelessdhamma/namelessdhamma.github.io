name: ND Mail Daily

on:
  schedule:
    # DAY slot (Bangkok): primary 15:00, fallbacks 15:30, 16:00, 16:30, 17:00.
    - cron: "0 8 * * *"
    - cron: "30 8 * * *"
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
    - cron: "0 10 * * *"
    # NIGHT slot (Bangkok): primary 03:00, fallbacks 03:30, 04:00, 04:30, 05:00.
    - cron: "0 20 * * *"
    - cron: "30 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nd-mail-daily
  cancel-in-progress: false

jobs:
  check-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAIL_USER: namelessdhamma@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.ND_MAIL_GMAIL_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.ND_MAIL_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.ND_MAIL_TELEGRAM_CHAT_ID }}
      ND_MAIL_MONITOR_ENABLED: "true"
      ND_MAIL_TIMEZONE: "Asia/Bangkok"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve report slot
        id: slot
        shell: bash
        run: |
          set -eu
          bangkok_date="$(TZ=Asia/Bangkok date +%F)"
          schedule="${{ github.event.schedule }}"
          case "$schedule" in
            "0 8 * * *"|"30 8 * * *"|"0 9 * * *"|"30 9 * * *"|"0 10 * * *")
              slot="day"
              ;;
            "0 20 * * *"|"30 20 * * *"|"0 21 * * *"|"30 21 * * *"|"0 22 * * *")
              slot="night"
              ;;
            *)
              slot="qualification"
              ;;
          esac
          echo "date=$bangkok_date" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Restore slot-delivery marker
        id: marker
        if: steps.slot.outputs.slot != 'qualification'
        uses: actions/cache/restore@v4
        with:
          path: .nd-mail-slot-delivered
          key: nd-mail-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}

      - name: Prepare rolling 24-hour window
        if: steps.marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tmp/nd_mail_monitor_v1.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "from datetime import datetime, timezone",
              "from datetime import datetime, timezone, timedelta",
          )
          s = s.replace(
              "start_local = now_local.replace(hour=0, minute=0, second=0, microsecond=0)",
              "start_local = now_local - timedelta(hours=24)",
          )
          s = s.replace(
              "Сегодня важных писем не было",
              "За последние 24 часа важных писем не было",
          )
          s = s.replace(
              "📬 <b>Сегодня важное</b>",
              "📬 <b>Важное за последние 24 часа</b>",
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Check Gmail and notify Telegram
        if: steps.marker.outputs.cache-hit != 'true'
        run: python3 tmp/nd_mail_monitor_v1.py

      - name: Mark slot delivered
        if: success() && steps.marker.outputs.cache-hit != 'true' && steps.slot.outputs.slot != 'qualification'
        run: echo "${{ steps.slot.outputs.date }} ${{ steps.slot.outputs.slot }}" > .nd-mail-slot-delivered

      - name: Save slot-delivery marker
        if: success() && steps.marker.outputs.cache-hit != 'true' && steps.slot.outputs.slot != 'qualification'
        uses: actions/cache/save@v4
        with:
          path: .nd-mail-slot-delivered
          key: nd-mail-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}

      - name: Telegram failure alert
        if: failure()
        shell: bash
        run: |
          curl --fail --silent --show-error             --request POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=⚠️ ND Mail: попытка проверки почты завершилась с ошибкой. Автоматический резерв попробует снова в течение ближайших 30 минут."
