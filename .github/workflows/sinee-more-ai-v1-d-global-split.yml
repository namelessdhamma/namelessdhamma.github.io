name: Sinee More AI v1 D Global Split
# diagnostic-sample: 1

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-global-split.yml'

permissions:
  contents: read

jobs:
  d-global-split:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capacity off, conflict retained
        continue-on-error: true
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          sed -i 's/ladderGlobalCapacity: 16,/ladderGlobalCapacity: 0,/' ai/evaluation.js
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-capacity-off.json
          cp /tmp/evaluation.js ai/evaluation.js

      - name: Conflict off, capacity retained
        continue-on-error: true
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          sed -i 's/ladderResourceConflict: 8/ladderResourceConflict: 0/' ai/evaluation.js
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-conflict-off.json
          cp /tmp/evaluation.js ai/evaluation.js

      - name: Restore evaluation
        if: always()
        run: git checkout -- ai/evaluation.js

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-global-split
          path: sinee-more/d-*-off.json
          if-no-files-found: ignore
