name: NotebookLM Vercel OAuth MCP CI

on:
  push:
    branches:
      - notebooklm-remote-mcp
    paths:
      - 'tools/notebooklm-mcp/remote-vercel-oauth/**'
      - '.github/workflows/notebooklm-vercel-oauth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/notebooklm-mcp/remote-vercel-oauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify pinned upstream OAuth + FastMCP imports
        run: |
          python - <<'PY'
          from fastmcp import FastMCP
          from notebooklm.mcp._oauth import SelfHostedOAuthProvider
          from vercel.blob import BlobClient
          print('OAUTH_IMPORTS_OK')
          PY
