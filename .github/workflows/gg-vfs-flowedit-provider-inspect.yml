name: GG VFS FlowEdit result diagnosis
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-vfs-flowedit-provider-inspect.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,requests
          t=os.environ["KAGGLE_API_TOKEN"].strip();u=os.environ["KAGGLE_USERNAME_SLUG"].strip()
          slug="gg-vfs-ace8423-flowedit-8855c06cd61ed77a"
          h={"Authorization":"Bearer "+t,"Accept":"application/json","Content-Type":"application/json","User-Agent":"nd-vfs-flowedit-diagnose/1.0"}
          api="https://api.kaggle.com/v1/kernels.KernelsApiService/DownloadKernelOutput"
          for p in ["gg-vfs-flowedit-output/result.json","gg-vfs-flowedit-output/child.log"]:
              r=requests.post(api,headers=h,json={"ownerSlug":u,"kernelSlug":slug,"filePath":p,"versionNumber":1},timeout=40,allow_redirects=False)
              print("PATH",p,"HTTP",r.status_code)
              if 300<=r.status_code<400 and r.headers.get("location"):
                  g=requests.get(r.headers["location"],timeout=180)
                  print("SIGNED",g.status_code,"BYTES",len(g.content))
                  if g.ok:
                      print(g.text[-16000:])
          PY
