name: ND LTX Compose
run-name: ND LTX Compose ${{ github.event.client_payload.request_id || github.event.issue.number }}

on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [nd_ltx_compose]

permissions:
  contents: read
  issues: write

jobs:
  compose:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'nd_ltx_compose') ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[ND-LTX-COMPOSE]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ND_REQUEST_ID: ${{ github.event.client_payload.request_id || github.event.issue.number }}
      ND_LTX_COMPOSE_MANIFEST: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.manifest) || github.event.issue.body }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json, os
          m=json.loads(os.environ.get("ND_LTX_COMPOSE_MANIFEST","{}"))
          if not isinstance(m,dict): raise SystemExit("manifest must be a JSON object")
          clips=m.get("clips") or []
          timeline=m.get("timeline") or []
          if not (1 <= len(clips) <= 12): raise SystemExit("clips must contain 1..12 items")
          if not (1 <= len(timeline) <= 40): raise SystemExit("timeline must contain 1..40 items")
          for i,c in enumerate(clips):
              if not str(c.get("url","")).startswith("https://"):
                  raise SystemExit(f"clip {i} missing https url")
          print("manifest ok:", len(clips), "clips /", len(timeline), "timeline items")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Compose LTX production cut
        run: python .github/scripts/nd_ltx_compose.py

      - name: Upload MP4 and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd-ltx-compose-${{ env.ND_REQUEST_ID }}
          path: |
            ltx-compose-output.mp4
            ltx-compose-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Comment issue result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if test -s ltx-compose-output.mp4; then
            STATE="PASS / MP4"
          else
            STATE="FAIL / NO_MP4"
          fi
          gh issue comment "$ISSUE" --body "ND LTX Compose: $STATE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID. Artifact: nd-ltx-compose-$ISSUE."
