# direct-runtime-qualified: 2026-09-18
name: ND TikTok GitHub Direct

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Direct TikTok tool to invoke
        required: true
        type: choice
        default: tiktok_status
        options:
          - tiktok_status
          - tiktok_user
          - tiktok_list_videos
          - tiktok_creator_info
          - tiktok_publish_status
          - tiktok_upload_draft_url
          - tiktok_direct_post_video_url
          - tiktok_publish_photos
      arguments_json:
        description: JSON object with tool arguments
        required: false
        default: "{}"
        type: string
  push:
    paths:
      - ".github/workflows/nd-tiktok-github-fallback.yml"
      - "tmp/nd-tiktok-github-direct.mjs"

permissions:
  contents: write

concurrency:
  group: nd-tiktok-github-direct
  cancel-in-progress: false

jobs:
  tiktok-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ND_TIKTOK_GH_CLIENT_KEY: ${{ secrets.ND_TIKTOK_GH_CLIENT_KEY }}
      ND_TIKTOK_GH_CLIENT_SECRET: ${{ secrets.ND_TIKTOK_GH_CLIENT_SECRET }}
      ND_TIKTOK_GH_STATE_KEY: ${{ secrets.ND_TIKTOK_GH_STATE_KEY }}
      REQUESTED_TOOL: ${{ inputs.tool }}
      REQUESTED_ARGUMENTS: ${{ inputs.arguments_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate direct runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ND_TIKTOK_GH_CLIENT_KEY"
          test -n "$ND_TIKTOK_GH_CLIENT_SECRET"
          test -n "$ND_TIKTOK_GH_STATE_KEY"
          test -s tmp/tiktok-github-token-state.json
          node --check tmp/nd-tiktok-github-direct.mjs

      - name: Direct TikTok read-only health check
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node tmp/nd-tiktok-github-direct.mjs tiktok_user '{}' > /tmp/direct-read.json
          jq -e '.ok == true and .route == "github-actions-direct" and .tool == "tiktok_user"' /tmp/direct-read.json >/dev/null

      - name: Direct TikTok operation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TOOL="${REQUESTED_TOOL:-tiktok_status}"
          ARGS="${REQUESTED_ARGUMENTS:-{}}"
          printf '%s' "$ARGS" | jq -e 'type == "object"' >/dev/null
          node tmp/nd-tiktok-github-direct.mjs "$TOOL" "$ARGS" | tee /tmp/direct-operation.json
          jq -e '.ok == true and .route == "github-actions-direct"' /tmp/direct-operation.json >/dev/null

      - name: Persist encrypted token state and qualification evidence
        if: always() && (github.event_name == 'push' || success())
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tmp/tiktok-github-token-state.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Persist direct TikTok GitHub token state"
          git push