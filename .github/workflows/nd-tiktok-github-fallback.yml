# direct-runtime-qualification: 2026-09-18.1
name: ND TikTok GitHub Direct

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Direct TikTok tool to invoke
        required: true
        type: choice
        default: tiktok_status
        options:
          - tiktok_status
          - tiktok_user
          - tiktok_list_videos
          - tiktok_creator_info
          - tiktok_publish_status
          - tiktok_upload_draft_url
          - tiktok_direct_post_video_url
          - tiktok_publish_photos
      arguments_json:
        description: JSON object with tool arguments
        required: false
        default: "{}"
        type: string
  push:
    paths:
      - ".github/workflows/nd-tiktok-github-fallback.yml"
      - "tmp/nd-tiktok-github-direct.mjs"

permissions:
  contents: write

concurrency:
  group: nd-tiktok-github-direct
  cancel-in-progress: false

jobs:
  tiktok-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ND_TIKTOK_GH_CLIENT_KEY: ${{ secrets.ND_TIKTOK_GH_CLIENT_KEY }}
      ND_TIKTOK_GH_CLIENT_SECRET: ${{ secrets.ND_TIKTOK_GH_CLIENT_SECRET }}
      ND_TIKTOK_GH_STATE_KEY: ${{ secrets.ND_TIKTOK_GH_STATE_KEY }}
      REQUESTED_TOOL: ${{ inputs.tool }}
      REQUESTED_ARGUMENTS: ${{ inputs.arguments_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate direct runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ND_TIKTOK_GH_CLIENT_KEY"
          test -n "$ND_TIKTOK_GH_CLIENT_SECRET"
          test -n "$ND_TIKTOK_GH_STATE_KEY"
          test -s tmp/tiktok-github-token-state.json
          node --check tmp/nd-tiktok-github-direct.mjs

      - name: Direct TikTok qualification
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          node tmp/nd-tiktok-github-direct.mjs tiktok_user '{}' > /tmp/direct-read.json
          jq -e '.ok == true and .route == "github-actions-direct" and .tool == "tiktok_user"' /tmp/direct-read.json >/dev/null

          MEDIA_B64="$(tr -d '\r\n' < tmp/nd-tiktok-github-qualification.mp4.b64)"
          WRITE_ARGS="$(jq -cn --arg media "$MEDIA_B64" '{media_base64:$media,mime_type:"video/mp4"}')"
          node tmp/nd-tiktok-github-direct.mjs tiktok_upload_draft_base64 "$WRITE_ARGS" > /tmp/direct-write.json
          jq -e '.ok == true and .result.upload_status == 201' /tmp/direct-write.json >/dev/null
          PUBLISH_ID="$(jq -er '.result.publish_id' /tmp/direct-write.json)"

          sleep 3
          STATUS_ARGS="$(jq -cn --arg id "$PUBLISH_ID" '{publish_id:$id}')"
          node tmp/nd-tiktok-github-direct.mjs tiktok_publish_status "$STATUS_ARGS" > /tmp/direct-status.json
          FINAL_STATUS="$(jq -r '.result.data.status // ""' /tmp/direct-status.json)"

          if [[ "$FINAL_STATUS" != "SEND_TO_USER_INBOX" ]]; then
            sleep 3
            node tmp/nd-tiktok-github-direct.mjs tiktok_publish_status "$STATUS_ARGS" > /tmp/direct-status.json
            FINAL_STATUS="$(jq -r '.result.data.status // ""' /tmp/direct-status.json)"
          fi
          test "$FINAL_STATUS" = "SEND_TO_USER_INBOX"

          mkdir -p tmp
          jq -n             --arg route "github-actions-direct"             --arg run_id "$GITHUB_RUN_ID"             --arg source_sha "$GITHUB_SHA"             --arg publish_id "$PUBLISH_ID"             --arg final_status "$FINAL_STATUS"             '{
              qualified_at:(now|todateiso8601),
              route:$route,
              railway_in_data_path:false,
              direct_api_host:"open.tiktokapis.com",
              read:{tool:"tiktok_user",status:"PASS"},
              write:{tool:"tiktok_upload_draft_base64",upload_status:201,publish_id:$publish_id,final_status:$final_status,public_post:false},
              token_state:"AES-256-GCM ciphertext",
              run_id:$run_id,
              source_sha:$source_sha,
              qualification:"PASS"
            }' > tmp/tiktok-github-direct-qualification.json

      - name: Direct TikTok operation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TOOL="${REQUESTED_TOOL:-tiktok_status}"
          ARGS="${REQUESTED_ARGUMENTS:-{}}"
          printf '%s' "$ARGS" | jq -e 'type == "object"' >/dev/null
          node tmp/nd-tiktok-github-direct.mjs "$TOOL" "$ARGS" | tee /tmp/direct-operation.json
          jq -e '.ok == true and .route == "github-actions-direct"' /tmp/direct-operation.json >/dev/null

      - name: Persist encrypted token state and qualification evidence
        if: always() && (github.event_name == 'push' || success())
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tmp/tiktok-github-token-state.json
          if [[ -f tmp/tiktok-github-direct-qualification.json ]]; then
            git add tmp/tiktok-github-direct-qualification.json
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Persist direct TikTok GitHub token state"
          git push
