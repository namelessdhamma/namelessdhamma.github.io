name: ND Kaggle LTX GitHub Reserve

on:
  push:
    branches:
      - main
      - qualify/ltx-multiroute-free
      - nam-397-anti-hang-pilot
    paths:
      - '.nd-control/ltx/request.json'
      - '.github/workflows/nd-kaggle-ltx-reserve.yml'
      - 'vercel/nd-kaggle-ltx-reserve/lib/ltx-core.js'
      - 'vercel/nd-kaggle-ltx-reserve/api/mcp.js'
      - 'vercel/nd-kaggle-ltx-reserve/test/anti-hang.mjs'
      - 'railway/nd-omniroute/ltx_control.mjs'
      - 'railway/nd-omniroute/ltx_mcp_v2.mjs'
      - 'railway/nd-omniroute/test/ltx_mcp_v2_anti_hang.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
      ND_LTX_INPUT_TOKEN: ${{ secrets.ND_LTX_INPUT_TOKEN }}
      ND_LTX_RAILWAY_BASE: https://nd-external-intelligence-production.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Validate multiroute reserve core
        shell: bash
        run: |
          set -euo pipefail
          node --check vercel/nd-kaggle-ltx-reserve/lib/ltx-core.js
          node --check vercel/nd-kaggle-ltx-reserve/api/mcp.js
          node --check vercel/nd-kaggle-ltx-reserve/api/health.js
          node --check railway/nd-omniroute/ltx_control.mjs
          node --check railway/nd-omniroute/ltx_mcp_v2.mjs
          node vercel/nd-kaggle-ltx-reserve/test/anti-hang.mjs
          node railway/nd-omniroute/test/ltx_mcp_v2_anti_hang.mjs
          node --input-type=module <<'NODE'
          import {submit} from './vercel/nd-kaggle-ltx-reserve/lib/ltx-core.js';
          const ok=o=>new Response(JSON.stringify(o),{status:200,headers:{'content-type':'application/json'}});
          let kernels=[],saveCalls=0,quotaCalls=0;
          globalThis.fetch=async (url,opts={})=>{
            const u=String(url), body=opts.body?JSON.parse(String(opts.body)):{};
            if(u.includes('/security.OAuthService/IntrospectToken')) return ok({active:true,username:'testuser'});
            if(u.includes('/kernels.KernelsApiService/ListKernels')){
              const search=String(body.search||'').toLowerCase();
              return ok({kernels:kernels.filter(k=>String(k.slug).toLowerCase().includes(search))});
            }
            if(u.includes('/kernels.KernelsApiService/GetAcceleratorQuotaStatistics')){
              quotaCalls++; return ok({gpuQuota:{timeUsed:'0s',timeReserved:'0s',totalTimeAllowed:'108000s'}});
            }
            if(u.includes('/kernels.KernelsApiService/SaveKernel')){
              saveCalls++;
              const slug=String(body.slug).split('/').pop();
              kernels=[{slug,ref:'testuser/'+slug,author:'testuser',currentVersionNumber:1}];
              return ok({versionNumber:1});
            }
            if(u.includes('/kernels.KernelsApiService/GetKernelSessionStatus')) return ok({status:1});
            throw new Error('unexpected mocked fetch '+u);
          };
          const cfg={token:'test-token',username:'testuser',inputToken:'',railwayBase:'https://example.invalid'};
          const args={start_image_url:'https://example.org/start.jpg',end_image_url:'https://example.org/end.jpg',prompt:'storm',duration_seconds:2,width:512,height:288,seed:42};
          const a=await submit(args,cfg), b=await submit(args,cfg);
          if(a.state!=='SUBMITTED'||b.state!=='RUNNING'||b.reused_existing!==true) throw new Error('idempotency contract failed');
          if(a.request_id!==b.request_id||a.effect_id!==b.effect_id||saveCalls!==1||quotaCalls!==1) throw new Error('duplicate submit detected');
          console.log('ND_LTX_MULTIROUTE_CORE=PASS');
          NODE

      - name: Execute one bounded reserve operation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nd-ltx-gha
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {configFromEnv,health,submit,reconcile,status,result} from './vercel/nd-kaggle-ltx-reserve/lib/ltx-core.js';

          const path='.nd-control/ltx/request.json';
          let request={op:'health',nonce:'implicit'};
          if(fs.existsSync(path)) request=JSON.parse(fs.readFileSync(path,'utf8'));
          const cfg=configFromEnv();
          const secretAvailability={
            KAGGLE_API_TOKEN:Boolean(cfg.token),
            KAGGLE_USERNAME_SLUG:Boolean(cfg.username),
            ND_LTX_INPUT_TOKEN:Boolean(cfg.inputToken)
          };
          const controlIdentity={
            head_sha:String(process.env.GITHUB_SHA||'')||null,
            run_id:String(process.env.GITHUB_RUN_ID||'')||null,
            run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT||0)||null,
            workflow:String(process.env.GITHUB_WORKFLOW||'')||null
          };
          let out;
          try{
            const op=String(request.op||'health');
            if(op==='health'){
              out={ok:true,state:'HEALTH',route:'github_actions',secret_availability:secretAvailability,provider_health:health(cfg),request};
            }else if(!cfg.token){
              out={ok:false,state:'BLOCKED_SECRET_MISSING',route:'github_actions',secret_availability:secretAvailability,request};
            }else if(op==='submit'){
              out={route_control:'github_actions',...(await submit(request.args||{},cfg))};
            }else if(op==='reconcile'){
              out={route_control:'github_actions',...(await reconcile({effect_id:request.effect_id,effect_token:request.effect_token},cfg))};
            }else if(op==='status'){
              out={route_control:'github_actions',...(await status({request_id:request.request_id},cfg))};
            }else if(op==='result'){
              out={route_control:'github_actions',...(await result({request_id:request.request_id},cfg))};
            }else{
              out={ok:false,state:'INVALID_OPERATION',route:'github_actions',error:'op must be health|submit|reconcile|status|result',request};
            }
          }catch(e){
            out={ok:false,state:e?.code==='CONTROL_DEADLINE'?'CONTROL_DEADLINE':'ERROR',outcome_state:e?.outcome_state||null,error_code:e?.code||null,timeout_ms:e?.timeout_ms||null,route:'github_actions',error:String(e?.message||e).slice(0,1600),request};
          }
          out={...out,control_identity:controlIdentity};
          fs.writeFileSync('/tmp/nd-ltx-gha/result.json',JSON.stringify(out,null,2)+'\n');
          console.log('ND_LTX_GHA_RESULT='+JSON.stringify(out));
          NODE

      - name: Materialize ready provider result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='/tmp/nd-ltx-gha/result.json';
          if(!fs.existsSync(p)) process.exit(0);
          const out=JSON.parse(fs.readFileSync(p,'utf8'));
          if(out?.state!=='READY'||!out?.provider_video_url) process.exit(0);
          async function downloadBounded(url,maxBytes,label){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(new Error(label+' deadline')),60000);
            try{
              const response=await fetch(url,{signal:controller.signal});
              if(!response.ok) throw new Error(label+' fetch failed '+response.status);
              const declared=Number(response.headers.get('content-length')||0);
              if(declared>maxBytes) throw new Error(label+' exceeds byte limit');
              if(!response.body?.getReader){
                const b=Buffer.from(await response.arrayBuffer());
                if(b.length>maxBytes) throw new Error(label+' exceeds byte limit');
                return b;
              }
              const reader=response.body.getReader();
              const chunks=[]; let total=0;
              while(true){
                const part=await reader.read();
                if(part.done) break;
                const b=Buffer.from(part.value); total+=b.length;
                if(total>maxBytes){try{await reader.cancel('byte_limit')}catch{};throw new Error(label+' exceeds byte limit');}
                chunks.push(b);
              }
              return Buffer.concat(chunks,total);
            }finally{
              clearTimeout(timer);
            }
          }
          const video=await downloadBounded(out.provider_video_url,150*1024*1024,'video');
          fs.writeFileSync('/tmp/nd-ltx-gha/result.mp4',video);
          if(out?.provider_receipt_url){
            try{
              const receipt=await downloadBounded(out.provider_receipt_url,2*1024*1024,'receipt');
              fs.writeFileSync('/tmp/nd-ltx-gha/provider-receipt.json',receipt);
            }catch{}
          }
          console.log('ND_LTX_RESULT_MATERIALIZED=PASS');
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nd-kaggle-ltx-reserve-result
          path: /tmp/nd-ltx-gha/
          retention-days: 7
