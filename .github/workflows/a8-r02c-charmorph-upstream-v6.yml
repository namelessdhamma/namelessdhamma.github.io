name: A8 R02C CharMorph Upstream V6

on:
  push:
    paths:
      - '.github/workflows/a8-r02c-charmorph-upstream-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git git-lfs xz-utils libgl1 libx11-6 libxrender1 libxi6 libxkbcommon0
          git lfs install

      - name: Fetch exact CharMorph code and Vitruvian LFS data
        run: |
          mkdir -p /tmp/a8-r02c-v6
          cd /tmp/a8-r02c-v6
          git clone https://github.com/Upliner/CharMorph.git CharMorph
          cd CharMorph
          git checkout ec5e13dcd5a7330b35fa7474b3abd2f406d77bd2
          mkdir -p data/characters
          git clone https://github.com/Upliner/CharMorph-Vitruvian.git data/characters/Vitruvian
          cd data/characters/Vitruvian
          git checkout c252d1fc7f00ba59d87b66b3d32fa3471fc6ee44
          git lfs pull
          echo "=== LFS materialization ==="
          stat -c '%n %s' char.blend rigs.blend hair.blend eyebrows.blend
          test "$(stat -c %s char.blend)" -gt 1000000
          test "$(stat -c %s rigs.blend)" -gt 1000000
          echo "Morph files: $(find morphs -type f | wc -l)"
          echo "Texture files: $(find textures -type f | wc -l)"
          du -sh .

      - name: Install Blender 4.5.14 LTS
        run: |
          cd /tmp/a8-r02c-v6
          curl -L --fail --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ./blender-4.5.14-linux-x64/blender --version | head -n 3

      - name: Generate masculine identity headlessly
        run: |
          cat > /tmp/a8-r02c-v6/generate.py <<'PY'
          import bpy, sys, os, json, traceback, math
          from mathutils import Vector

          ROOT="/tmp/a8-r02c-v6"
          ADDON=os.path.join(ROOT,"CharMorph")
          PRESET=os.path.join(ADDON,"data","characters","Vitruvian","presets","Ultra Masculine.yaml")
          OUT=os.path.join(ROOT,"out")
          os.makedirs(OUT,exist_ok=True)
          sys.path.insert(0,ROOT)

          report={}
          try:
              import CharMorph
              CharMorph.register()
              report["addon_registered"]=True
              from CharMorph.lib.charlib import library
              report["library_dir"]=library.dirpath
              report["characters"]=sorted(library.chars.keys())
              if "Vitruvian" not in library.chars:
                  raise RuntimeError("Vitruvian missing from CharMorph library")

              ui=bpy.context.window_manager.charmorph_ui
              ui.base_model="Vitruvian"
              ui.use_sk=False
              ui.import_morphs=False
              ui.import_expressions=False
              ui.tex_downscale="2K"
              r=bpy.ops.charmorph.import_char()
              report["import_char"]=list(r)
              if "FINISHED" not in r:
                  raise RuntimeError("import_char failed")

              char_obj=bpy.context.view_layer.objects.active
              report["base_object"]=char_obj.name
              report["base_vertices"]=len(char_obj.data.vertices)

              r2=getattr(bpy.ops.charmorph,"import")(filepath=PRESET)
              report["apply_preset"]=list(r2)
              if "FINISHED" not in r2:
                  raise RuntimeError("preset import failed")

              from CharMorph import common
              m=common.manager.morpher
              keys=["Gender_Male","BodyType_Muscular","BodyType_MesoMorph","Jaw_Width","Jaw_Mandible","Chin_ChinCleft","Arms_BicepSize"]
              report["morph_values"]={k:float(m.core.prop_get(k)) for k in keys}

              # Save editable identity result before any finalization.
              bpy.ops.wm.save_as_mainfile(filepath=os.path.join(OUT,"vitruvian-ultra-masculine-editable.blend"))

              # Export current morphed mesh as GLB for downstream Godot feasibility.
              bpy.ops.object.select_all(action='DESELECT')
              char_obj.select_set(True)
              bpy.context.view_layer.objects.active=char_obj
              bpy.ops.export_scene.gltf(
                  filepath=os.path.join(OUT,"ultra-masculine-static.glb"),
                  export_format='GLB',
                  use_selection=True,
                  export_materials='EXPORT',
                  export_yup=True,
              )
              report["glb_size"]=os.path.getsize(os.path.join(OUT,"ultra-masculine-static.glb"))
              report["ok"]=True
          except Exception as e:
              report["ok"]=False
              report["error"]=repr(e)
              report["traceback"]=traceback.format_exc()
              print(report["traceback"])
          finally:
              with open(os.path.join(OUT,"report.json"),"w") as f:
                  json.dump(report,f,indent=2)
              print(json.dumps(report,indent=2))
              if not report.get("ok"):
                  raise SystemExit(2)
          PY
          mkdir -p /tmp/a8-r02c-v6/out
          /tmp/a8-r02c-v6/blender-4.5.14-linux-x64/blender -b --python /tmp/a8-r02c-v6/generate.py

      - name: Verify identity artifact
        run: |
          cd /tmp/a8-r02c-v6/out
          test -s ultra-masculine-preview.png
          test -s ultra-masculine-static.glb
          test -s vitruvian-ultra-masculine-editable.blend
          python3 - <<'PY'
          import json
          d=json.load(open("report.json"))
          assert d["ok"]
          assert d["morph_values"]["Gender_Male"] > 0.99
          assert d["morph_values"]["BodyType_Muscular"] > 0.99
          assert d["glb_size"] > 100000
          print(json.dumps(d,indent=2))
          PY
          sha256sum ultra-masculine-static.glb vitruvian-ultra-masculine-editable.blend > sha256.txt
          printf '{"route":"R02C","recipe":"CHARMORPH_UPSTREAM_V6","charmorph_commit":"ec5e13dcd5a7330b35fa7474b3abd2f406d77bd2","vitruvian_data_commit":"c252d1fc7f00ba59d87b66b3d32fa3471fc6ee44","blender":"4.5.14-LTS","preset":"Ultra Masculine","goal":"prove editable upstream identity generation before finalization"}\n' > receipt.json

      - name: Upload V6
        uses: actions/upload-artifact@v4
        with:
          name: a8-r02c-charmorph-upstream-v6
          path: |
            /tmp/a8-r02c-v6/out/ultra-masculine-preview.png
            /tmp/a8-r02c-v6/out/ultra-masculine-static.glb
            /tmp/a8-r02c-v6/out/report.json
            /tmp/a8-r02c-v6/out/sha256.txt
            /tmp/a8-r02c-v6/out/receipt.json
          retention-days: 7
