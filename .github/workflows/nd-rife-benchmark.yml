name: ND RIFE CPU Benchmark

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    if: startsWith(github.event.issue.title, '[ND-RIFE-BENCH]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip

      - name: Install RIFE CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          python -m pip install numpy==1.23.5 opencv-python-headless==4.8.1.78 gdown==5.2.0 tqdm sk-video moviepy

      - name: Benchmark Practical-RIFE lite
        run: python .github/scripts/nd_rife_cpu_benchmark.py

      - name: Upload benchmark receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd-rife-benchmark-${{ github.event.issue.number }}
          path: |
            rife-benchmark.mp4
            rife-benchmark-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if test -s rife-benchmark.mp4; then STATE="PASS / MP4"; else STATE="FAIL / NO_MP4"; fi
          gh issue comment "$ISSUE" --body "ND RIFE CPU benchmark: $STATE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID."
