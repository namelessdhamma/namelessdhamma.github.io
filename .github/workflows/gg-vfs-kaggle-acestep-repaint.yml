name: GG VFS ACE8423 native repaint diction

on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths:
      - ".github/workflows/gg-vfs-kaggle-acestep-repaint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repaint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - name: Submit and retrieve exact repaint effect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/run_repaint.py <<'PY'
          import base64,hashlib,json,os,re,time
          from pathlib import Path
          import requests

          token=os.environ["KAGGLE_API_TOKEN"].strip()
          expected_user=os.environ.get("KAGGLE_USERNAME_SLUG","").strip()
          sha=os.environ["GITHUB_SHA"]
          api="https://api.kaggle.com/v1"
          H={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json","User-Agent":"nd-vfs-repaint/1.0"}
          out=Path("out")

          def rpc(service,method,body=None,timeout=40):
              r=requests.post(f"{api}/{service}/{method}",headers=H,json=body or {},timeout=timeout)
              if not r.ok:
                  raise RuntimeError(f"{method} HTTP {r.status_code}: {r.text[:1800]}")
              return r.json() if r.text.strip() else {}

          ident=rpc("security.OAuthService","IntrospectToken",{"token":token})
          user=str(ident.get("username") or "")
          if not ident.get("active") or not user: raise RuntimeError("Kaggle token inactive")
          if expected_user and expected_user!=user: raise RuntimeError("Kaggle username mismatch")

          q=rpc("kernels.KernelsApiService","GetAcceleratorQuotaStatistics",{})
          def secs(v):
              if isinstance(v,(int,float)): return float(v)
              if isinstance(v,str):
                  m=re.match(r"^(-?\d+(?:\.\d+)?)s$",v); return float(m.group(1)) if m else float(v or 0)
              if isinstance(v,dict): return float(v.get("seconds",0))+float(v.get("nanos",0))/1e9
              return 0.0
          g=q.get("gpuQuota") or q.get("gpu_quota") or {}
          used=secs(g.get("timeUsed",g.get("time_used",0))); total=secs(g.get("totalTimeAllowed",g.get("total_time_allowed",0)))
          rem=max(0,total-used)
          quota={"used_hours":round(used/3600,3),"total_hours":round(total/3600,3),"remaining_hours":round(rem/3600,3)}
          if total<=0 or rem<15*60:
              (out/"submit.json").write_text(json.dumps({"state":"FREE_ONLY_BLOCKED","quota":quota},indent=2))
              raise RuntimeError("FREE_ONLY_BLOCKED")

          original_caption="solo female a cappella vocal, warm young adult low-mezzo contralto, intimate and naturally resonant, clear native Russian diction, realistic human singing, expressive legato, varied natural vowel durations, subtle breaths, organic consonant-vowel transitions, dry close studio vocal, no instruments, no harmony, no choir, no reverb, no synthetic buzzing"
          request={
            "baseline":{
              "caption":original_caption,
              "lyrics":"[Verse]\nЯ говорила не с ним, а с тем, кто долго стоял у окна и ждал.",
              "duration":15,
              "seed":8423,
              "source_url":"https://raw.githubusercontent.com/namelessdhamma/namelessdhamma.github.io/b0525d1/gg-vfs-assets/accepted/GG-VFS-F01_ACE-Step15_RU_8423_1.wav",
              "expected_sha256":"a9052e4b08086a41f97b1c3ff4d2ee5072a56129b8fa6d7ed3260a992fbc5be2"
            },
            "repaint":{
              "start":0.0,
              "end":6.9,
              "caption":original_caption+", preserve the same singer identity and melodic performance; every written Russian word must remain audibly articulated; lexical stress follows the accent marks; do not omit particles or prepositions",
              "lyrics":"[Verse]\nЯ говори́ла не с ним,\nа с тем, кто до́лго стоя́л,\nу окна́ и ждал.",
              "strengths":[0.20,0.40],
              "seed":8423
            }
          }
          req64=base64.b64encode(json.dumps(request,ensure_ascii=False).encode()).decode()
          worker_url=f"https://raw.githubusercontent.com/namelessdhamma/namelessdhamma.github.io/{sha}/railway/nd-omniroute/kaggle_acestep_repaint_worker.py"
          script="\n".join([
              "import base64,sys,urllib.request",
              "from pathlib import Path",
              f"Path('/kaggle/working/gg-vfs-ace-repaint-request.json').write_bytes(base64.b64decode('{req64}'))",
              f"u='{worker_url}'",
              "w=Path('/kaggle/working/kaggle_acestep_repaint_worker.py')",
              "w.write_bytes(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'nd-vfs-repaint/1.0'}),timeout=120).read())",
              "sys.argv=['kaggle_acestep_repaint_worker.py','/kaggle/working/gg-vfs-ace-repaint-request.json']",
              "exec(compile(w.read_text(encoding='utf-8'),str(w),'exec'),{'__name__':'__main__'})",
          ])
          token16=hashlib.sha256((sha+"|ace8423-exact-source-repaint-0-6.9|0.2|0.4").encode()).hexdigest()[:16]
          requested_slug=f"gg-vfs-ace8423-repaint-{token16}"
          title=f"GG VFS ACE8423 Repaint {token16}"

          save=rpc("kernels.KernelsApiService","SaveKernel",{
              "slug":f"{user}/{requested_slug}",
              "newTitle":title,
              "text":script,
              "language":"python","kernelType":"script",
              "datasetDataSources":[],"kernelDataSources":[],"competitionDataSources":[],
              "categoryIds":[],"modelDataSources":[],
              "isPrivate":True,"enableGpu":True,"enableTpu":False,"enableInternet":True,
              "kernelExecutionType":"SaveAndRunAll","machineShape":"NvidiaTeslaT4",
              "sessionTimeoutSeconds":3300
          })
          if save.get("error") or save.get("invalidKernelSources") or save.get("invalid_kernel_sources"):
              raise RuntimeError("SaveKernel rejected: "+json.dumps(save)[:1800])
          version=int(save.get("versionNumber") or save.get("version_number") or 1)

          # This title slug is deterministic; preserve the effect handle immediately.
          # If readback later disagrees, reconcile by ListKernels before any resubmit.
          slug=requested_slug
          handle={"state":"SUBMITTED","provider_ref":f"{user}/{slug}/v{version}","requested_slug":requested_slug,"actual_slug":slug,"workflow_sha":sha,"quota":quota,"request":request}
          (out/"submit.json").write_text(json.dumps(handle,ensure_ascii=False,indent=2))
          print(json.dumps(handle,ensure_ascii=False,indent=2),flush=True)

          # Same-effect bounded output watch only. No GetKernelSessionStatus and no resubmit.
          expected=[
              "gg-vfs-ace-repaint-output/result.json",
              "gg-vfs-ace-repaint-output/REPRODUCTION_RECIPE.md",
              "gg-vfs-ace-repaint-output/BASELINE_8423_EXACT.wav",
              "gg-vfs-ace-repaint-output/GG-VFS-F01_ACE8423_REPAINT_0p2.wav",
              "gg-vfs-ace-repaint-output/GG-VFS-F01_ACE8423_REPAINT_0p4.wav"
          ]
          deadline=time.time()+22*60
          listing=None
          while time.time()<deadline:
              listing=rpc("kernels.KernelsApiService","ListKernelSessionOutput",{"userName":user,"kernelSlug":slug,"versionLabel":f"v{version}","pageSize":100})
              names={str(x.get("fileName") or x.get("name") or x.get("path")) for x in (listing.get("files",[]) or [])}
              # exact deliverables may sit beyond page1; direct-download probes are authoritative.
              r=requests.post(f"{api}/kernels.KernelsApiService/DownloadKernelOutput",headers=H,json={"ownerSlug":user,"kernelSlug":slug,"filePath":"gg-vfs-ace-repaint-output/result.json","versionNumber":version},timeout=30,allow_redirects=False)
              if r.status_code in range(200,400):
                  break
              print("WAIT_OUTPUT",len(names),flush=True)
              time.sleep(30)
          else:
              raise RuntimeError("repaint effect did not expose terminal result within bounded watch")

          def download(name):
              r=requests.post(f"{api}/kernels.KernelsApiService/DownloadKernelOutput",headers=H,json={"ownerSlug":user,"kernelSlug":slug,"filePath":name,"versionNumber":version},timeout=40,allow_redirects=False)
              if 300<=r.status_code<400 and r.headers.get("location"):
                  data=requests.get(r.headers["location"],timeout=180).content
              elif r.ok:
                  u=None
                  if "json" in r.headers.get("content-type",""):
                      try:
                          o=r.json();u=o.get("url") or o.get("redirectUrl") or o.get("redirect_url") or o.get("downloadUrl") or o.get("download_url")
                      except Exception: pass
                  data=requests.get(u,timeout=180).content if u else r.content
              else:
                  raise RuntimeError(f"download {name} HTTP {r.status_code}: {r.text[:1000]}")
              p=out/Path(name).name;p.write_bytes(data)
              return {"provider":name,"file":p.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          got=[download(n) for n in expected]
          idx={"state":"READY","provider_ref":handle["provider_ref"],"downloads":got}
          (out/"result-index.json").write_text(json.dumps(idx,indent=2))
          print(json.dumps(idx,indent=2),flush=True)
          PY
          python /tmp/run_repaint.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vfs-ace8423-repaint-diction
          path: out/
          retention-days: 30
          if-no-files-found: error
