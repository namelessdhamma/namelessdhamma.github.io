name: Sinee More AI v1 D Strength Probe
# diagnostic-sample: 3

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-strength-probe.yml'

permissions:
  contents: read

jobs:
  d-strength-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: D diagnostic with Medium deliberate errors disabled
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/difficulty.js')
          s=p.read_text()
          old='strategicErrorRate: 0.58,'
          if old not in s:
              raise SystemExit('medium strategicErrorRate anchor missing')
          p.write_text(s.replace(old, 'strategicErrorRate: 0,', 1))
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 24 --budget-scale 0.10 --json d-strength-medium-no-errors.json
      - name: Restore diagnostic patch
        if: always()
        run: git checkout -- ai/difficulty.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-strength-probe
          path: sinee-more/d-strength-medium-no-errors.json
          if-no-files-found: ignore
