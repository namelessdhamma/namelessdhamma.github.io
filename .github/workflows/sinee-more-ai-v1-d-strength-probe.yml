name: Sinee More AI v1 D Strength Probe
# diagnostic-sample: 1

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-strength-probe.yml'

permissions:
  contents: read

jobs:
  d-strength-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: D-only difficulty strength diagnostic
        run: node tools/qualification.js --strength-only --rules D --games-per-pair 24 --budget-scale 0.10 --json d-strength-probe.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-strength-probe
          path: sinee-more/d-strength-probe.json
          if-no-files-found: ignore
