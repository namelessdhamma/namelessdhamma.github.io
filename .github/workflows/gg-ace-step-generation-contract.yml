name: GG ACE-Step generation contract
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-ace-step-generation-contract.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade gradio_client
          python - <<'PY'
          import json
          from gradio_client import Client
          c=Client("ACE-Step/Ace-Step-v1.5",verbose=False)
          api=c.view_api(return_format="dict")
          x=api["named_endpoints"]["/generation_wrapper"]
          print("GENERATION_WRAPPER_JSON_BEGIN")
          print(json.dumps(x,ensure_ascii=False,indent=2))
          print("GENERATION_WRAPPER_JSON_END")
          PY
