name: Sinee More AI v1 D Medium Full-Root Error Control
# diagnostic-sample: 3

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-persona-control.yml'

permissions:
  contents: read

jobs:
  d-medium-full-root-error:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: D Medium deliberate errors on normal full root set
        continue-on-error: true
        shell: bash
        run: |
          cp ai/engine.js /tmp/engine.js
          trap 'cp /tmp/engine.js ai/engine.js' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/engine.js')
          s=p.read_text()
          old="""      : deliberateError
        ? boundedMistakeSample(
            position,
            decisionMoves,
            rule,
            policy.errorCandidateLimit
          )
        : openingSearchCandidates(position, decisionMoves, rule, policy);"""
          new="""      : deliberateError
        ? (
            difficulty === 'medium' && rule === RULE_D
              ? openingSearchCandidates(position, decisionMoves, rule, policy)
              : boundedMistakeSample(
                  position,
                  decisionMoves,
                  rule,
                  policy.errorCandidateLimit
                )
          )
        : openingSearchCandidates(position, decisionMoves, rule, policy);"""
          if old not in s:
              raise SystemExit('deliberate root-candidate anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 12 --budget-scale 1.0 --json d-medium-full-root-error.json

      - name: Restore engine
        if: always()
        run: git checkout -- ai/engine.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-medium-full-root-error
          path: sinee-more/d-medium-full-root-error.json
          if-no-files-found: ignore
