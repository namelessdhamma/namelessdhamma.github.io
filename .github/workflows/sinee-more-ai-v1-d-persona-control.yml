name: Sinee More AI v1 D Persona Control
# diagnostic-sample: 1

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-persona-control.yml'

permissions:
  contents: read

jobs:
  d-persona-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: D with Medium persona influence matched to Hard
        continue-on-error: true
        shell: bash
        run: |
          cp ai/difficulty.js /tmp/difficulty.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/difficulty.js')
          s=p.read_text()
          # Replace only the Medium block's first matching values.
          marker='medium: Object.freeze({'
          a,b=s.split(marker,1)
          b=b.replace('personaWeight: 0.6,','personaWeight: 0.35,',1)
          b=b.replace('openingPersonaWeight: 6,','openingPersonaWeight: 3,',1)
          p.write_text(a+marker+b)
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-persona-control.json
          cp /tmp/difficulty.js ai/difficulty.js
      - name: Restore difficulty
        if: always()
        run: git checkout -- ai/difficulty.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-persona-control
          path: sinee-more/d-persona-control.json
          if-no-files-found: ignore
