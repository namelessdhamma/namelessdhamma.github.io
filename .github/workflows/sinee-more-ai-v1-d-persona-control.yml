name: Sinee More AI v1 D Medium Search-Only Control
# diagnostic-sample: 2

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-persona-control.yml'

permissions:
  contents: read

jobs:
  d-medium-search-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production D with Medium deliberate errors disabled
        continue-on-error: true
        shell: bash
        run: |
          cp ai/difficulty.js /tmp/difficulty.js
          trap 'cp /tmp/difficulty.js ai/difficulty.js' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/difficulty.js')
          s=p.read_text()
          marker='medium: Object.freeze({'
          a,b=s.split(marker,1)
          b=b.replace('strategicErrorRate: 0.58,','strategicErrorRate: 0,',1)
          p.write_text(a+marker+b)
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 1.0 --json d-medium-search-only.json
      - name: Restore difficulty
        if: always()
        run: git checkout -- ai/difficulty.js
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-medium-search-only
          path: sinee-more/d-medium-search-only.json
          if-no-files-found: ignore
