name: ND Kaggle LTX Public Reserve Qualification

on:
  push:
    branches:
      - qualify/kaggle-ltx-public-reserve
    paths:
      - '.github/workflows/nd-kaggle-ltx-public-reserve-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RAILWAY_TOKEN: ${{ secrets.ND_RAILWAY_RECOVERY_TOKEN }}
      LTX_PATH_TOKEN: ${{ secrets.ND_LTX_MCP_PATH_TOKEN }}
      LTX_INPUT_TOKEN: ${{ secrets.ND_LTX_INPUT_TOKEN }}
      DRIVE_BRIDGE_TOKEN: ${{ secrets.ND_DRIVE_BRIDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Report secret-route availability without values
        shell: python
        run: |
          import json, os
          out={
            'ND_RAILWAY_RECOVERY_TOKEN':bool(os.environ.get('RAILWAY_TOKEN')),
            'ND_LTX_MCP_PATH_TOKEN':bool(os.environ.get('LTX_PATH_TOKEN')),
            'ND_LTX_INPUT_TOKEN':bool(os.environ.get('LTX_INPUT_TOKEN')),
            'ND_DRIVE_BRIDGE_TOKEN':bool(os.environ.get('DRIVE_BRIDGE_TOKEN')),
          }
          print('ND_LTX_PUBLIC_RESERVE_SECRET_AVAILABILITY='+json.dumps(out,sort_keys=True))
