name: Patch NotebookLM Drive Bind

on:
  push:
    branches: [notebooklm-remote-mcp]
    paths:
      - .github/workflows/patch-notebooklm-drive-bind.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notebooklm-remote-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal Drive search-and-bind patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_drive_bind.py
          python /tmp/patch_drive_bind.py
          python -m py_compile tools/notebooklm-mcp/remote-vercel-oauth/app.py
          python tools/notebooklm-mcp/remote-vercel-oauth/tests/test_drive_source_contract.py
      - name: Commit production patch
        shell: bash
        run: |
          git config user.name 'namelessdhamma-bot'
          git config user.email 'namelessdhamma@gmail.com'
          git add tools/notebooklm-mcp/remote-vercel-oauth/app.py
          if git diff --cached --quiet; then
            echo 'No production change required'
          else
            git commit -m 'feat(notebooklm): add safe Drive search-and-bind operation'
            git push origin HEAD:notebooklm-remote-mcp
          fi
