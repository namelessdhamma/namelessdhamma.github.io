name: A8 R02C Canonical Identity V7

on:
  push:
    paths:
      - '.github/workflows/a8-r02c-canonical-identity-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git git-lfs xz-utils unzip xvfb ffmpeg libgl1 libx11-6 libxrender1 libxi6 libxkbcommon0 libxcursor1 libxinerama1 libxrandr2 mesa-vulkan-drivers
          git lfs install
          mkdir -p /tmp/a8-r02c-v7/out /tmp/a8-r02c-v7/godot/assets

      - name: Fetch exact CharMorph and Vitruvian data
        run: |
          cd /tmp/a8-r02c-v7
          git clone -q https://github.com/Upliner/CharMorph.git CharMorph
          cd CharMorph
          git checkout -q ec5e13dcd5a7330b35fa7474b3abd2f406d77bd2
          mkdir -p data/characters
          git clone -q https://github.com/Upliner/CharMorph-Vitruvian.git data/characters/Vitruvian
          cd data/characters/Vitruvian
          git checkout -q c252d1fc7f00ba59d87b66b3d32fa3471fc6ee44
          git lfs pull -q
          test "$(stat -c %s char.blend)" -gt 1000000

      - name: Install Blender 4.5.14 LTS and Godot 4.6
        run: |
          cd /tmp/a8-r02c-v7
          curl -L --fail --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          tar -xf blender.tar.xz
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.6-stable_linux.x86_64

      - name: Write headless identity generator
        run: |
          cat > /tmp/a8-r02c-v7/generate.py <<'PY'
          import bpy, sys, os, json, traceback, numpy as np

          ROOT="/tmp/a8-r02c-v7"
          ADDON=os.path.join(ROOT,"CharMorph")
          PRESET=os.path.join(ADDON,"data","characters","Vitruvian","presets","Ultra Masculine.yaml")
          OUT=os.path.join(ROOT,"out")
          PROFILE=os.environ["PROFILE"]
          sys.path.insert(0,ROOT)

          PROFILES={
            "silas":{
              "Gender_Male":1.0,
              "BodyType_Muscular":0.52,
              "BodyType_MesoMorph":0.62,
              "BodyType_EctoMorph":0.24,
              "BodyType_EndoMorph":0.0,
              "BodyType_Lean":0.34,
              "Jaw_Width":0.34,
              "Jaw_Mandible":0.26,
              "Chin_ChinCleft":0.06,
              "Cheeks_BoneDefinition":0.58,
              "Cheeks_BuccalFat":-0.16,
              "Age_Old":0.07,
              "Nose_BridgeProminence":0.18,
              "Nose_Potrusion":0.07,
              "Neck_Girth":0.03,
              "Shoulders_ShoulderWidth":0.16,
              "Arms_BicepSize":0.50
            },
            "red_pirate":{
              "Gender_Male":1.0,
              "BodyType_Muscular":0.72,
              "BodyType_MesoMorph":0.80,
              "BodyType_EctoMorph":0.0,
              "BodyType_EndoMorph":0.18,
              "BodyType_Lean":0.06,
              "Jaw_Width":0.84,
              "Jaw_Mandible":0.58,
              "Chin_ChinCleft":0.46,
              "Cheeks_BoneDefinition":0.36,
              "Cheeks_BuccalFat":0.22,
              "Age_Old":0.20,
              "Nose_BridgeProminence":0.10,
              "Nose_Potrusion":0.16,
              "Neck_Girth":0.25,
              "Shoulders_ShoulderWidth":0.36,
              "Arms_BicepSize":0.76
            }
          }

          report={"profile":PROFILE}
          try:
              import CharMorph
              CharMorph.register()
              ui=bpy.context.window_manager.charmorph_ui
              ui.base_model="Vitruvian"
              ui.use_sk=False
              ui.import_morphs=False
              ui.import_expressions=False
              ui.tex_downscale="2K"
              r=bpy.ops.charmorph.import_char()
              if "FINISHED" not in r: raise RuntimeError("import_char failed")
              char_obj=bpy.context.view_layer.objects.active
              from CharMorph import common
              m=common.manager.morpher

              base=np.empty(len(char_obj.data.vertices)*3,dtype=np.float64)
              char_obj.data.vertices.foreach_get("co",base)

              r2=getattr(bpy.ops.charmorph,"import")(filepath=PRESET)
              if "FINISHED" not in r2: raise RuntimeError("baseline preset failed")

              names={morph.name for morph in m.core.morphs_l2 if morph.name}
              applied={}
              missing=[]
              for k,v in PROFILES[PROFILE].items():
                  if k in names:
                      m.core.prop_set(k,float(v))
                      applied[k]=float(v)
                  else:
                      missing.append(k)
              m.update()

              final=np.empty(len(char_obj.data.vertices)*3,dtype=np.float64)
              char_obj.data.vertices.foreach_get("co",final)
              delta=(final-base).reshape((-1,3))
              mags=np.linalg.norm(delta,axis=1)

              # Add game-ready Mixamo rig after identity is frozen.
              bpy.context.view_layer.objects.active=char_obj
              char_obj.select_set(True)
              ui.rig="mixamo"
              rr=bpy.ops.charmorph.rig()
              rig=char_obj.find_armature()
              if "FINISHED" not in rr or rig is None:
                  raise RuntimeError("mixamo rig creation failed")

              # Export selected mesh+rig with material placeholders only.
              bpy.ops.object.select_all(action='DESELECT')
              char_obj.select_set(True)
              rig.select_set(True)
              bpy.context.view_layer.objects.active=rig
              glb=os.path.join(OUT,PROFILE+".glb")
              bpy.ops.export_scene.gltf(
                  filepath=glb,
                  export_format='GLB',
                  use_selection=True,
                  export_materials='NONE',
                  export_yup=True,
                  export_skins=True,
                  export_animations=False,
              )

              report.update({
                "ok":True,
                "vertices":len(char_obj.data.vertices),
                "geometry_rms":float(np.sqrt(np.mean(np.square(mags)))),
                "geometry_max":float(np.max(mags)),
                "vertices_changed":int(np.count_nonzero(mags>1e-7)),
                "applied":applied,
                "missing":missing,
                "rig_name":rig.name,
                "rig_bones":len(rig.data.bones),
                "glb_size":os.path.getsize(glb)
              })
          except Exception as e:
              report["ok"]=False
              report["error"]=repr(e)
              report["traceback"]=traceback.format_exc()
              print(report["traceback"])
          with open(os.path.join(OUT,PROFILE+".json"),"w") as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          if not report.get("ok"): raise SystemExit(2)
          PY

      - name: Generate Silas and red-pirate identities
        run: |
          BLENDER=/tmp/a8-r02c-v7/blender-4.5.14-linux-x64/blender
          PROFILE=silas "$BLENDER" -b --python /tmp/a8-r02c-v7/generate.py
          PROFILE=red_pirate "$BLENDER" -b --python /tmp/a8-r02c-v7/generate.py
          python3 - <<'PY'
          import json, math
          a=json.load(open('/tmp/a8-r02c-v7/out/silas.json'))
          b=json.load(open('/tmp/a8-r02c-v7/out/red_pirate.json'))
          assert a["ok"] and b["ok"]
          assert not a["missing"] and not b["missing"]
          assert a["rig_bones"] > 40 and b["rig_bones"] > 40
          assert a["glb_size"] > 100000 and b["glb_size"] > 100000
          # Profile settings themselves must be materially distinct.
          diff=sum(abs(a["applied"][k]-b["applied"][k]) for k in a["applied"])
          assert diff > 2.0
          json.dump({"silas":a,"red_pirate":b,"profile_parameter_L1":diff},open('/tmp/a8-r02c-v7/out/identity-comparison.json','w'),indent=2)
          print("profile_parameter_L1",diff)
          PY
          cp /tmp/a8-r02c-v7/out/silas.glb /tmp/a8-r02c-v7/godot/assets/
          cp /tmp/a8-r02c-v7/out/red_pirate.glb /tmp/a8-r02c-v7/godot/assets/

      - name: Write isolated Godot identity lineup
        run: |
          G=/tmp/a8-r02c-v7/godot
          cat > "$G/project.godot" <<'EOF'
          [application]
          config/name="A8 R02C Identity V7"
          run/main_scene="res://main.tscn"
          [display]
          window/size/viewport_width=960
          window/size/viewport_height=540
          [rendering]
          renderer/rendering_method="forward_plus"
          EOF
          cat > "$G/main.tscn" <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource path="res://main.gd" type="Script" id="1"]
          [node name="IdentityV7" type="Node3D"]
          script = ExtResource("1")
          EOF
          cat > "$G/main.gd" <<'EOF'
          extends Node3D
          var a: Node3D
          var b: Node3D
          var cam: Camera3D
          var t := 0.0

          func _ready():
              var env:=Environment.new()
              env.background_mode=Environment.BG_COLOR
              env.background_color=Color(0.012,0.018,0.028)
              env.ambient_light_source=Environment.AMBIENT_SOURCE_COLOR
              env.ambient_light_color=Color(0.18,0.24,0.34)
              env.ambient_light_energy=0.5
              env.tonemap_mode=Environment.TONE_MAPPER_AGX
              env.ssao_enabled=true
              var we:=WorldEnvironment.new();we.environment=env;add_child(we)
              a=(load("res://assets/silas.glb") as PackedScene).instantiate()
              b=(load("res://assets/red_pirate.glb") as PackedScene).instantiate()
              add_child(a);add_child(b)
              a.position=Vector3(-0.72,0,0);b.position=Vector3(0.72,0,0)
              a.rotation_degrees.y=-6;b.rotation_degrees.y=6
              _paint(a,Color(0.46,0.30,0.23))
              _paint(b,Color(0.52,0.29,0.21))
              var key:=DirectionalLight3D.new();key.light_color=Color(0.62,0.76,1.0);key.light_energy=2.0;key.rotation_degrees=Vector3(-50,-25,0);add_child(key)
              var warm:=OmniLight3D.new();warm.position=Vector3(-2.2,2.5,2.0);warm.light_color=Color(1.0,0.42,0.16);warm.light_energy=6.0;warm.omni_range=7;add_child(warm)
              cam=Camera3D.new();cam.position=Vector3(0,1.55,4.1);cam.fov=38;cam.current=true;add_child(cam);cam.look_at(Vector3(0,1.38,0),Vector3.UP)

          func _paint(n:Node,c:Color):
              if n is MeshInstance3D:
                  var m:=StandardMaterial3D.new();m.albedo_color=c;m.roughness=0.55;n.material_override=m
              for ch in n.get_children(): _paint(ch,c)

          func _process(delta):
              t+=delta
              var yaw:=sin(t*1.6)*4.0
              a.rotation_degrees.y=-6+yaw
              b.rotation_degrees.y=6-yaw
          EOF

      - name: Import and render identity lineup
        run: |
          GODOT=/tmp/a8-r02c-v7/godot-bin/Godot_v4.6-stable_linux.x86_64
          PROJ=/tmp/a8-r02c-v7/godot
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          "$GODOT" --headless --editor --path "$PROJ" --quit-after 6
          cd "$PROJ"
          xvfb-run -a "$GODOT" --path . --rendering-method forward_plus --write-movie /tmp/a8-r02c-v7/out/identity-lineup.avi --fixed-fps 24 --quit-after 48
          ffmpeg -y -v error -i /tmp/a8-r02c-v7/out/identity-lineup.avi -c:v libx264 -crf 15 -pix_fmt yuv420p /tmp/a8-r02c-v7/out/identity-lineup.mp4
          rm -f /tmp/a8-r02c-v7/out/identity-lineup.avi
          ffmpeg -y -v error -i /tmp/a8-r02c-v7/out/identity-lineup.mp4 -vf "select='eq(n,24)'" -vframes 1 /tmp/a8-r02c-v7/out/identity-lineup.png
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -show_entries format=duration,size -of json /tmp/a8-r02c-v7/out/identity-lineup.mp4 > /tmp/a8-r02c-v7/out/ffprobe.json
          sha256sum /tmp/a8-r02c-v7/out/*.glb /tmp/a8-r02c-v7/out/identity-lineup.mp4 > /tmp/a8-r02c-v7/out/sha256.txt

      - name: Upload V7
        uses: actions/upload-artifact@v4
        with:
          name: a8-r02c-canonical-identity-v7
          path: /tmp/a8-r02c-v7/out
          retention-days: 7
