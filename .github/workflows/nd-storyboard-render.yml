name: ND Storyboard Renderer
run-name: ND Storyboard ${{ github.event.client_payload.request_id || github.event.issue.number || github.ref_name }}

on:
  create:
  issues:
    types: [opened]
  repository_dispatch:
    types: [nd_storyboard_render]

permissions:
  contents: read
  issues: write

jobs:
  render:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'nd_storyboard_render') ||
      (github.event_name == 'create' && github.ref_type == 'tag' && startsWith(github.ref_name, 'nd-storyboard/')) ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[ND-STORYBOARD]') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ND_REQUEST_ID: ${{ github.event.client_payload.request_id || github.event.issue.number || github.ref_name }}
      ND_STORYBOARD_MANIFEST: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.manifest) || github.event.issue.body }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve durable tag request
        if: github.event_name == 'create'
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="$GITHUB_REF_NAME"
          case "$TAG_NAME" in
            nd-storyboard/*) ;;
            *) echo "unexpected tag: $TAG_NAME" >&2; exit 2 ;;
          esac
          TAG_BODY="$(git for-each-ref "refs/tags/$TAG_NAME" --format='%(contents)')"
          test -n "$TAG_BODY"
          export TAG_BODY
          python - <<'PY'
          import json, os
          record=json.loads(os.environ['TAG_BODY'])
          request_id=str(record.get('request_id') or '').strip()
          manifest=record.get('manifest')
          effect_id=str(record.get('effect_id') or '')
          if record.get('schema') != 'nd-storyboard-request-v2':
              raise SystemExit('invalid storyboard request schema')
          if not request_id.startswith('sb-r') or not effect_id.startswith('storyboard:'):
              raise SystemExit('invalid storyboard request identity')
          if not isinstance(manifest,dict):
              raise SystemExit('invalid storyboard manifest')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              out.write('ND_REQUEST_ID='+request_id+'\n')
              out.write('ND_STORYBOARD_MANIFEST<<NDJSON\n')
              out.write(json.dumps(manifest,separators=(',',':'))+'\n')
              out.write('NDJSON\n')
          print('durable tag request:',request_id)
          PY

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json, os
          m=json.loads(os.environ.get("ND_STORYBOARD_MANIFEST","{}"))
          if not isinstance(m,dict):
              raise SystemExit("manifest must be a JSON object")
          frames=m.get("frames") or []
          if len(frames)<2 or len(frames)>40:
              raise SystemExit("frames must contain 2..40 items")
          for i,f in enumerate(frames):
              if not str(f.get("url","")).startswith(("http://","https://")):
                  raise SystemExit(f"frame {i} missing http(s) url")
          print("manifest ok:",len(frames),"frames","request",os.environ.get("ND_REQUEST_ID"))
          PY

      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render storyboard
        run: python .github/scripts/nd_storyboard_renderer.py

      - name: Upload MP4 and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd-storyboard-${{ env.ND_REQUEST_ID }}
          path: |
            storyboard-output.mp4
            storyboard-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Comment issue result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if test -s storyboard-output.mp4; then
            STATE="PASS / MP4"
          else
            STATE="FAIL / NO_MP4"
          fi
          gh issue comment "$ISSUE" --body "ND Storyboard Renderer: $STATE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID. Artifact: nd-storyboard-$ISSUE."
