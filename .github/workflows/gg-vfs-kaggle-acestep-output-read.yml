name: GG VFS ACE-Step direct output read
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-vfs-kaggle-acestep-output-read.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - name: Read existing v1 outputs without status API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib,json,os,requests
          from pathlib import Path
          token=os.environ["KAGGLE_API_TOKEN"].strip()
          user=os.environ["KAGGLE_USERNAME_SLUG"].strip()
          slug="gg-vfs-ace-step-ru-bca086e8febcc3c9"; version=1
          api="https://api.kaggle.com/v1/kernels.KernelsApiService/DownloadKernelOutput"
          h={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json","User-Agent":"nd-vfs-direct-output/1.1"}
          out=Path("out")
          names=[
            "gg-vfs-ace-output/result.json",
            "gg-vfs-ace-output/REPRODUCTION_RECIPE.md",
            "gg-vfs-ace-output/GG-VFS-F01_ACE-Step15_RU_8423_1.wav",
            "gg-vfs-ace-output/GG-VFS-F01_ACE-Step15_RU_8424_1.wav",
          ]
          got=[]
          for name in names:
              r=requests.post(api,headers=h,json={"ownerSlug":user,"kernelSlug":slug,"filePath":name,"versionNumber":version},timeout=40,allow_redirects=False)
              rec={"provider":name,"http":r.status_code}
              try:
                  if 300<=r.status_code<400 and r.headers.get("location"):
                      data=requests.get(r.headers["location"],timeout=180).content
                  elif r.ok:
                      data=None
                      if "json" in r.headers.get("content-type",""):
                          try:
                              o=r.json()
                              u=o.get("url") or o.get("redirectUrl") or o.get("redirect_url") or o.get("downloadUrl") or o.get("download_url")
                          except Exception:
                              u=None
                          if u: data=requests.get(u,timeout=180).content
                      if data is None: data=r.content
                  else:
                      rec["error"]=r.text[:1600]; got.append(rec); print(json.dumps(rec),flush=True); continue
                  p=out/Path(name).name
                  p.write_bytes(data)
                  rec.update({"file":p.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              except Exception as e:
                  rec["error"]=repr(e)
              got.append(rec); print(json.dumps(rec),flush=True)
          (out/"direct-index.json").write_text(json.dumps({"provider_ref":f"{user}/{slug}/v1","files":got},indent=2))
          if not any(x.get("file","").endswith(".wav") for x in got):
              # result.json is still a valid terminal diagnosis; fail only after preserving it.
              raise SystemExit(3)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-vfs-ace-step15-direct-output-v1
          path: out/
          retention-days: 30
          if-no-files-found: error
