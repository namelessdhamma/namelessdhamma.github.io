name: Sinee More AI v1 D Medium Budget Sweep
# diagnostic-sample: 1

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-medium-budget-sweep.yml'

permissions:
  contents: read

jobs:
  d-medium-budget-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Medium 180 ms
        continue-on-error: true
        shell: bash
        run: |
          cp ai/difficulty.js /tmp/difficulty.js
          sed -i '0,/timeBudgetMs: 220/s//timeBudgetMs: 180/' ai/difficulty.js
          node tools/qualification.js --strength-only --rules D --games-per-pair 4 --budget-scale 1.0 --json d-medium-180.json
          cp /tmp/difficulty.js ai/difficulty.js

      - name: Medium 160 ms
        continue-on-error: true
        shell: bash
        run: |
          cp ai/difficulty.js /tmp/difficulty.js
          sed -i '0,/timeBudgetMs: 220/s//timeBudgetMs: 160/' ai/difficulty.js
          node tools/qualification.js --strength-only --rules D --games-per-pair 4 --budget-scale 1.0 --json d-medium-160.json
          cp /tmp/difficulty.js ai/difficulty.js

      - name: Medium 140 ms
        continue-on-error: true
        shell: bash
        run: |
          cp ai/difficulty.js /tmp/difficulty.js
          sed -i '0,/timeBudgetMs: 220/s//timeBudgetMs: 140/' ai/difficulty.js
          node tools/qualification.js --strength-only --rules D --games-per-pair 4 --budget-scale 1.0 --json d-medium-140.json
          cp /tmp/difficulty.js ai/difficulty.js

      - name: Restore difficulty
        if: always()
        run: git checkout -- ai/difficulty.js
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-medium-budget-sweep
          path: sinee-more/d-medium-*.json
          if-no-files-found: ignore
