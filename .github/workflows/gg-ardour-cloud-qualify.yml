name: GG Ardour Cloud Runtime Qualification

on:
  push:
    branches:
      - qualify/gg-ardour-cloud-v1
    paths:
      - '.github/workflows/gg-ardour-cloud-qualify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:sid
    steps:
      - name: Install Ardour cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ardour curl ca-certificates grep coreutils findutils \
            xvfb dbus-x11 python3 procps xauth xdotool x11-utils
          ARDOUR_BIN="$(command -v ardour9 || command -v ardour)"
          "$ARDOUR_BIN" --version
          find /usr/lib -type f -name 'libardour_mcp_http.so' -print | tee /tmp/mcp-files.txt
          grep -q 'libardour_mcp_http' /tmp/mcp-files.txt
          find /usr/lib -type f -iname '*dummy*audio*backend*' -o -iname '*ardour*dummy*' 2>/dev/null | tee /tmp/dummy-files.txt || true
          echo 'GG_ARDOUR_PACKAGE_AND_MCP=PASS'

      - name: Seed software-only Ardour engine
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          mkdir -p "$HOME/.config/ardour9" /tmp/gg-cloud
          touch "$HOME/.config/ardour9/.a9"
          cat >"$HOME/.config/ardour9/config" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Ardour>
            <Config>
              <Option name="try-autostart-engine" value="1"/>
              <Option name="hide-dummy-backend" value="0"/>
              <Option name="discover-plugins-on-start" value="0"/>
            </Config>
            <Metadata/>
            <Extra>
              <AudioMIDISetup>
                <EngineStates>
                  <State backend="None (Dummy)" driver="Normal Speed" device="Silence"
                         input-device="" output-device="" sample-rate="48000" buffer-size="1024"
                         n-periods="0" input-latency="0" output-latency="0"
                         lm-input="" lm-output="" active="1" use-buffered-io="0"
                         midi-option="No MIDI I/O" lru="1">
                    <MIDIDevices/>
                  </State>
                </EngineStates>
              </AudioMIDISetup>
            </Extra>
          </Ardour>
          XML
          Xvfb :99 -screen 0 1280x800x24 >/tmp/gg-xvfb.log 2>&1 &
          echo $! >/tmp/gg-xvfb.pid
          sleep 1
          kill -0 "$(cat /tmp/gg-xvfb.pid)"
          echo 'GG_ARDOUR_DUMMY_ENGINE_CONFIG=PASS'

      - name: Create current Ardour session headlessly with official utility
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          export LANG=C.UTF-8
          command -v ardour9-new_session
          ardour9-new_session --version
          rm -rf /tmp/gg-cloud/GGCloud
          set +e
          ardour9-new_session -s 48000 -m 2 /tmp/gg-cloud/GGCloud GGCloud | tee /tmp/gg-new-session.log
          NEW_SESSION_RC=${PIPESTATUS[0]}
          set -e
          SESSION_FILE=/tmp/gg-cloud/GGCloud/GGCloud.ardour
          test -s "$SESSION_FILE"
          grep -q '<Session' "$SESSION_FILE"
          grep -q 'sample-rate="48000"' "$SESSION_FILE"
          python3 - "$SESSION_FILE" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          print("GG_ARDOUR_SESSION_XML=PASS")
          PY
          echo "$SESSION_FILE" >/tmp/gg-session-file.txt
          echo "GG_ARDOUR_NEW_SESSION_RC=$NEW_SESSION_RC"
          echo 'GG_ARDOUR_HEADLESS_SESSION_UTILITY=PASS_VALID_SESSION_MATERIALIZED'

      - name: Enable native MCP in session
        shell: bash
        run: |
          set -euo pipefail
          SESSION_FILE="$(cat /tmp/gg-session-file.txt)"
          python3 - "$SESSION_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          p = sys.argv[1]
          tree = ET.parse(p)
          root = tree.getroot()
          cps = root.find("ControlProtocols")
          if cps is None:
              cps = ET.SubElement(root, "ControlProtocols")
          target = None
          for child in cps.findall("Protocol"):
              if child.get("name") == "MCP HTTP Server (Experimental)":
                  target = child
                  break
          if target is None:
              target = ET.SubElement(cps, "Protocol")
          target.set("name", "MCP HTTP Server (Experimental)")
          target.set("active", "yes")
          target.set("port", "4820")
          target.set("debug-level", "1")
          target.set("config", "")
          tree.write(p, encoding="UTF-8", xml_declaration=True)
          print("GG_MCP_SESSION_STATE_PATCH=PASS")
          PY
          grep -q 'MCP HTTP Server (Experimental)' "$SESSION_FILE"

      - name: Restart session and qualify native MCP
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          export DISPLAY=:99
          export LANG=C.UTF-8
          export USER=root
          export LOGNAME=root
          export ARDOUR_TRY_AUTOSTART_ENGINE=1
          ARDOUR_BIN="$(command -v ardour9 || command -v ardour)"
          SESSION_FILE="$(cat /tmp/gg-session-file.txt)"
          dbus-run-session -- "$ARDOUR_BIN" -a -n -P "$SESSION_FILE" >/tmp/gg-ardour-mcp.log 2>&1 &
          echo $! >/tmp/gg-ardour.pid

          SETUP_ACCEPTED=0
          for i in $(seq 1 30); do
            WID="$(xdotool search --onlyvisible --name 'Audio/MIDI Setup' 2>/dev/null | head -n1 || true)"
            if [ -n "$WID" ]; then
              xdotool key --window "$WID" Return || true
              SETUP_ACCEPTED=1
              echo "GG_ARDOUR_AUDIO_MIDI_SETUP=ACCEPTED window=$WID"
              break
            fi
            if ! kill -0 "$(cat /tmp/gg-ardour.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "GG_ARDOUR_AUDIO_MIDI_SETUP_ACCEPTED=$SETUP_ACCEPTED"

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"gg-cloud-qualifier","version":"1"}}}' \
              http://127.0.0.1:4820/mcp >/tmp/gg-mcp-init.json 2>/tmp/gg-curl.err; then
              READY=1
              break
            fi
            if ! kill -0 "$(cat /tmp/gg-ardour.pid)" 2>/dev/null; then break; fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo '--- Ardour MCP log ---'
            cat /tmp/gg-ardour-mcp.log || true
            echo '--- curl error ---'
            cat /tmp/gg-curl.err || true
            echo '--- X windows ---'
            xwininfo -root -tree 2>/dev/null || true
            echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=FAIL_NO_ENDPOINT'
            exit 41
          fi

          cat /tmp/gg-mcp-init.json
          grep -q 'ardour-mcp-http' /tmp/gg-mcp-init.json
          echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=PASS_JSONRPC_INITIALIZE'

          curl -fsS --max-time 3 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            http://127.0.0.1:4820/mcp >/tmp/gg-mcp-tools.json
          test -s /tmp/gg-mcp-tools.json
          grep -q 'midi_note' /tmp/gg-mcp-tools.json
          grep -q 'plugin' /tmp/gg-mcp-tools.json
          grep -q 'track' /tmp/gg-mcp-tools.json
          echo "GG_MCP_TOOL_BYTES=$(wc -c </tmp/gg-mcp-tools.json)"
          echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=PASS_TOOL_SURFACE'

          kill "$(cat /tmp/gg-ardour.pid)" 2>/dev/null || true
          kill "$(cat /tmp/gg-xvfb.pid)" 2>/dev/null || true

      - name: Mark cloud DAW runtime qualification
        shell: bash
        run: |
          echo 'GG_ARDOUR_CLOUD_RUNTIME_STAGE=NATIVE_MCP_HEADLESS_DUMMY_QUALIFIED'
