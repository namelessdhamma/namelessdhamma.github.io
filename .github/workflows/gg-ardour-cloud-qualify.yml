name: GG Ardour Cloud Runtime Qualification

on:
  push:
    branches:
      - qualify/gg-ardour-cloud-v1
    paths:
      - '.github/workflows/gg-ardour-cloud-qualify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:sid
    steps:
      - name: Install current Debian sid studio runtime
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ardour raysession curl ca-certificates grep coreutils findutils \
            xvfb dbus-x11 jackd2 python3 procps xauth

      - name: Verify Ardour version and native MCP HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          ARDOUR_BIN="$(command -v ardour9 || command -v ardour || true)"
          test -n "$ARDOUR_BIN"
          echo "ARDOUR_BIN=$ARDOUR_BIN"
          "$ARDOUR_BIN" --version | tee /tmp/ardour-version.txt
          dpkg-query -W -f='ARDOUR_DEBIAN_VERSION=${Version}\n' ardour
          command -v ray_control
          command -v ray-daemon

          find /usr/lib /usr/share -type f \
            \( -iname '*mcp_http*' -o -iname '*mcp*http*' \) \
            -print 2>/dev/null | tee /tmp/mcp-files.txt || true

          if ! grep -q 'libardour_mcp_http' /tmp/mcp-files.txt; then
            echo 'GG_ARDOUR_NATIVE_MCP=FAIL_NOT_PACKAGED'
            exit 21
          fi
          echo 'GG_ARDOUR_NATIVE_MCP=PASS_PACKAGED'

      - name: Start non-realtime JACK and headless X display
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          mkdir -p "$HOME"
          jackd -r -d dummy -r 48000 -p 1024 >/tmp/gg-jack.log 2>&1 &
          echo $! >/tmp/gg-jack.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/gg-jack.pid)" 2>/dev/null; then
            echo '--- JACK startup ---'
            cat /tmp/gg-jack.log || true
            echo 'GG_JACK_DUMMY=FAIL'
            exit 29
          fi
          echo 'GG_JACK_DUMMY=PASS'

          Xvfb :99 -screen 0 1280x800x24 >/tmp/gg-xvfb.log 2>&1 &
          echo $! >/tmp/gg-xvfb.pid
          export DISPLAY=:99
          echo 'DISPLAY=:99' >/tmp/gg-display.env
          sleep 1
          kill -0 "$(cat /tmp/gg-xvfb.pid)"
          echo 'GG_XVFB=PASS'

      - name: Create Ardour session through NSM without desktop wizard
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          export DISPLAY=:99
          export LANG=C.UTF-8

          ray_control start
          ray_control open_session_off GGCloud
          CLIENT_ID="$(ray_control add_executable ardour not_start | tail -n1 | tr -d '\r')"
          if [ -z "$CLIENT_ID" ]; then
            echo 'GG_RAYSESSION_ADD_ARDOUR=FAIL'
            exit 31
          fi
          echo "$CLIENT_ID" >/tmp/gg-client-id.txt
          echo "GG_RAYSESSION_CLIENT_ID=$CLIENT_ID"

          ray_control client "$CLIENT_ID" open

          SESSION_ROOT="$(ray_control get_session_path)"
          echo "GG_RAYSESSION_PATH=$SESSION_ROOT"
          SESSION_FILE="$(find "$SESSION_ROOT" -type f -name '*.ardour' -print -quit 2>/dev/null || true)"
          if [ -z "$SESSION_FILE" ]; then
            echo '--- Ray clients ---'
            ray_control list_clients || true
            echo '--- Ardour processes ---'
            ps aux | grep -E '[a]rdour|[r]ay' || true
            echo 'GG_ARDOUR_HEADLESS_SESSION=FAIL_NOT_CREATED'
            exit 32
          fi
          echo "$SESSION_FILE" >/tmp/gg-session-file.txt
          echo "GG_SESSION_FILE=$SESSION_FILE"
          echo 'GG_ARDOUR_HEADLESS_SESSION=PASS_NSM_CREATED'

          ray_control client "$CLIENT_ID" save || true
          ray_control client "$CLIENT_ID" stop
          sleep 2

      - name: Enable native MCP in saved session state
        shell: bash
        run: |
          set -euo pipefail
          SESSION_FILE="$(cat /tmp/gg-session-file.txt)"
          python3 - "$SESSION_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          p = sys.argv[1]
          tree = ET.parse(p)
          root = tree.getroot()
          cps = root.find("ControlProtocols")
          if cps is None:
              cps = ET.SubElement(root, "ControlProtocols")
          target = None
          for child in cps.findall("Protocol"):
              if child.get("name") == "MCP HTTP Server (Experimental)":
                  target = child
                  break
          if target is None:
              target = ET.SubElement(cps, "Protocol")
          target.set("name", "MCP HTTP Server (Experimental)")
          target.set("active", "yes")
          target.set("port", "4820")
          target.set("debug-level", "1")
          target.set("config", "")
          tree.write(p, encoding="UTF-8", xml_declaration=True)
          print("GG_MCP_SESSION_STATE_PATCH=PASS")
          PY
          grep -n -A3 -B1 'MCP HTTP Server' "$SESSION_FILE"

      - name: Restart Ardour through NSM and qualify native MCP JSON-RPC
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/tmp/gg-home
          export DISPLAY=:99
          CLIENT_ID="$(cat /tmp/gg-client-id.txt)"

          ray_control client "$CLIENT_ID" open

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"gg-cloud-qualifier","version":"1"}}}' \
              http://127.0.0.1:4820/mcp >/tmp/gg-mcp-init.json 2>/tmp/gg-curl.err; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo '--- curl error ---'
            cat /tmp/gg-curl.err || true
            echo '--- Ray clients ---'
            ray_control list_clients || true
            echo '--- Ardour processes ---'
            ps aux | grep -E '[a]rdour|[r]ay' || true
            echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=FAIL_NO_ENDPOINT'
            exit 41
          fi

          cat /tmp/gg-mcp-init.json
          grep -q 'ardour-mcp-http' /tmp/gg-mcp-init.json
          echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=PASS_JSONRPC_INITIALIZE'

          curl -fsS --max-time 3 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            http://127.0.0.1:4820/mcp >/tmp/gg-mcp-tools.json

          test -s /tmp/gg-mcp-tools.json
          echo "GG_MCP_TOOL_BYTES=$(wc -c </tmp/gg-mcp-tools.json)"
          grep -q 'midi_note' /tmp/gg-mcp-tools.json
          grep -q 'plugin' /tmp/gg-mcp-tools.json
          grep -q 'track' /tmp/gg-mcp-tools.json
          echo 'GG_ARDOUR_NATIVE_MCP_RUNTIME=PASS_TOOL_SURFACE'

          ray_control client "$CLIENT_ID" stop || true
          ray_control quit || true
          kill "$(cat /tmp/gg-xvfb.pid)" 2>/dev/null || true
          kill "$(cat /tmp/gg-jack.pid)" 2>/dev/null || true

      - name: Mark cloud DAW runtime qualification
        shell: bash
        run: |
          set -euo pipefail
          echo 'GG_ARDOUR_CLOUD_RUNTIME_STAGE=NATIVE_MCP_HEADLESS_NSM_QUALIFIED'
