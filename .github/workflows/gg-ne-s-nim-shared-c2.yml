name: GG Ne S Nim Shared Score C2 Qualification

on:
  push:
    branches:
      - compute/gg-ne-s-nim-c2-20261006
    paths:
      - '.github/workflows/gg-ne-s-nim-shared-c2.yml'
      - 'docs/gg/songs/ne-s-nim-shared-score-c2.json'
      - '.nd-labs/gg-songs/GGNeSNimSharedC2Test.cs'
      - 'tools/gg_ne_s_nim_shared_b_arrange.py'
      - 'tools/gg_audio_qa.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Applio runtime
        uses: actions/cache/restore@v4
        with:
          path: .gg-applio-cache
          key: gg-applio-cpu-v2-\${{ runner.os }}-324f4d89

      - name: Restore Awata RVC
        uses: actions/cache/restore@v4
        with:
          path: .gg-rvc-model-cache
          key: gg-rvc-awata-v1.2-\${{ runner.os }}

      - name: Install audio and analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git unzip ffmpeg fluidsynth fluid-soundfont-gm build-essential \
            libsndfile1 libportaudio2 patchelf libicu-dev
          python -m pip install -q \
            mido numpy scipy soundfile librosa==0.10.2.post1 pyyaml \
            faster-whisper==1.1.1 jiwer==3.0.4

      - name: Render arrangement from shared score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p song/arrangement
          python tools/gg_ne_s_nim_shared_c2_arrange.py \
            docs/gg/songs/ne-s-nim-shared-score-c2.json \
            "$GITHUB_WORKSPACE/song/arrangement"

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimSharedC2Test.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimSharedC2Test.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimSharedC2Test.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimSharedC2Test.cs

          curl -fL --retry 3 -o /tmp/awata.zip \
            https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"
          fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          if not (dst/'vocoder.yaml').exists():
              arc=pathlib.Path('/tmp/ezv.oudep')
              arc.write_bytes(urllib.request.urlopen(
                  'https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',
                  timeout=300).read())
              dst.mkdir(exist_ok=True)
              with zipfile.ZipFile(arc) as z:
                  names={n.replace('\\','/'):n for n in z.namelist()}
                  cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
                  data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
                  m=next(n for n in names if n.split('/')[-1]==model)
                  (dst/'vocoder.yaml').write_bytes(data)
                  with z.open(names[m]) as inf,(dst/model).open('wb') as out:
                      shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Render clean vocal guide from same shared score
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release
          mkdir -p "$GITHUB_WORKSPACE/song/vocal"
          OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
          GG_VFS_OUT="$GITHUB_WORKSPACE/song/vocal" \
          GG_VFS_TAG="NE_S_NIM_SHARED_C2_GUIDE" \
          GG_VFS_SPEAKER_HINT="Mature" \
          GG_VFS_VARIANT="shared_c2" \
          GG_VFS_STEPS="64" \
          GG_SHARED_SCORE="$GITHUB_WORKSPACE/docs/gg/songs/ne-s-nim-shared-score-c2.json" \
          dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj \
            --configuration Release --no-build --filter RenderNeSNimSharedC2
          guide="$(find "$GITHUB_WORKSPACE/song/vocal" -name '*OPENUTAU_RU_QC.wav' -print -quit)"
          test -s "$guide"
          cp "$guide" "$GITHUB_WORKSPACE/song/vocal/00_GUIDE_C2.wav"

      - name: Render D North Star
        shell: bash
        env:
          GG_APPLIO_CACHE_DIR: \${{ github.workspace }}/.gg-applio-cache
          GG_RVC_MODEL_CACHE_DIR: \${{ github.workspace }}/.gg-rvc-model-cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,runpy,subprocess
          ns=runpy.run_path('tools/gg_cloud_music_worker.py',run_name='gg_shared_c2')
          work=pathlib.Path('/tmp/applio-c2'); work.mkdir(exist_ok=True)
          root,vpy,rt=ns['ensure_applio_runtime'](work)
          model,index,meta=ns['install_rvc_model']('awata-weak-rvc-v1.2','Original',work)
          guide=pathlib.Path('song/vocal/00_GUIDE_C2.wav').resolve()
          out=pathlib.Path('song/vocal/D_C2_FCPE_IDX050.wav').resolve()
          code="import os,sys; root,source,out,model,index=sys.argv[1:6]; os.chdir(root); sys.path.insert(0,root); from core import run_infer_script; run_infer_script(input_path=source,output_path=out,pth_path=model,index_path=index,export_format='WAV',embedder_model='contentvec',pitch=0,index_rate=0.50,volume_envelope=1.0,protect=0.5,f0_method='fcpe',split_audio=True,f0_autotune=False,f0_autotune_strength=1.0,proposed_pitch=False,proposed_pitch_threshold=155.0,clean_audio=False,clean_strength=0.5,formant_shifting=False,formant_qfrency=1.0,formant_timbre=1.0,post_process=False,reverb=False,pitch_shift=False,limiter=False,gain=False,distortion=False,chorus=False,bitcrush=False,clipping=False,compressor=False,delay=False,reverb_room_size=0.5,reverb_damping=0.5,reverb_wet_gain=0.33,reverb_dry_gain=0.4,reverb_width=1.0,reverb_freeze_mode=0.0,pitch_shift_semitones=0.0,limiter_threshold=-6.0,limiter_release_time=0.01,gain_db=0.0,distortion_gain=25.0,chorus_rate=1.0,chorus_depth=0.25,chorus_center_delay=7.0,chorus_feedback=0.0,chorus_mix=0.5,bitcrush_bit_depth=8,clipping_threshold=-6.0,compressor_threshold=0.0,compressor_ratio=1.0,compressor_attack=1.0,compressor_release=100.0,delay_seconds=0.5,delay_feedback=0.0,delay_mix=0.5,sid=0)"
          p=subprocess.run([str(vpy),'-c',code,str(root),str(guide),str(out),str(model),str(index)],
                           cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=2400)
          print(p.stdout[-12000:])
          if p.returncode or not out.exists() or out.stat().st_size==0:
              raise SystemExit('Applio D C2 failed')
          PY

      - name: Mix qualification cut
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p song/master
          ffmpeg -y -v error -i song/vocal/D_C2_FCPE_IDX050.wav \
            -af "highpass=f=80,equalizer=f=2400:t=q:w=1:g=1.5,acompressor=threshold=-18dB:ratio=2.1:attack=14:release=150,aresample=48000,volume=1.12" \
            song/vocal/D_C2_MIX.wav
          ffmpeg -y -v error \
            -i song/arrangement/instrumental.wav \
            -i song/vocal/D_C2_MIX.wav \
            -filter_complex "[0:a]volume=0.86[inst];[inst][1:a]amix=inputs=2:duration=longest:normalize=0,acompressor=threshold=-10dB:ratio=2.0:attack=14:release=180,alimiter=limit=0.95,loudnorm=I=-14:LRA=11:TP=-1.0[out]" \
            -map "[out]" -ar 48000 -c:a pcm_s24le song/master/NE_S_NIM_C2.wav
          ffmpeg -y -v error -i song/master/NE_S_NIM_C2.wav \
            -codec:a libmp3lame -b:a 320k song/master/NE_S_NIM_C2.mp3

      - name: Rendered-audio QA
        shell: bash
        run: |
          set +e
          python tools/gg_audio_qa.py \
            --vocal song/vocal/D_C2_FCPE_IDX050.wav \
            --instrumental song/arrangement/instrumental.wav \
            --drums song/arrangement/processed/drums.wav \
            --bpm 108 \
            --out song/qa-audio.json
          echo "audio_qa_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Russian singing ASR QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib
          from faster_whisper import WhisperModel
          from jiwer import wer,cer

          score=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-shared-score-c2.json').read_text())
          target=score['target_text']

          def norm(s):
              s=s.lower().replace('ё','е')
              s=re.sub(r'[^а-я0-9 ]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          model=WhisperModel('small',device='cpu',compute_type='int8')
          for label,path in [
              ('guide','song/vocal/00_GUIDE_C2.wav'),
              ('d','song/vocal/D_C2_FCPE_IDX050.wav')]:
              segments,info=model.transcribe(path,language='ru',beam_size=5,vad_filter=True,condition_on_previous_text=True)
              segs=list(segments)
              transcript=' '.join(s.text.strip() for s in segs).strip()
              nt,nr=norm(target),norm(transcript)
              result={
                'language':info.language,
                'target':target,
                'transcript':transcript,
                'normalized_target':nt,
                'normalized_transcript':nr,
                'wer':float(wer(nt,nr)),
                'cer':float(cer(nt,nr)),
                'segments':[{'start':s.start,'end':s.end,'text':s.text.strip()} for s in segs]
              }
              pathlib.Path(f'song/qa-asr-{label}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
              print(label,json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Critic gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,sys
          aq=json.loads(pathlib.Path('song/qa-audio.json').read_text())
          gd=json.loads(pathlib.Path('song/qa-asr-guide.json').read_text())
          dd=json.loads(pathlib.Path('song/qa-asr-d.json').read_text())
          failures=list(aq.get('failures',[]))
          if gd['wer']>0.55: failures.append('guide_asr_wer')
          if gd['cer']>0.35: failures.append('guide_asr_cer')
          if dd['wer']>0.50: failures.append('d_asr_wer')
          if dd['cer']>0.30: failures.append('d_asr_cer')
          result={
            'status':'PASS' if not failures else 'REJECT',
            'audio':aq,
            'asr_guide':{'wer':gd['wer'],'cer':gd['cer'],'transcript':gd['transcript']},
            'asr_d':{'wer':dd['wer'],'cer':dd['cer'],'transcript':dd['transcript']},
            'failures':failures,
            'gate_version':'C2'
          }
          pathlib.Path('song/qualification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if failures: sys.exit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ne-s-nim-shared-c2
          path: |
            song/master/
            song/vocal/00_GUIDE_C2.wav
            song/vocal/D_C2_FCPE_IDX050.wav
            song/arrangement/instrumental.mp3
            song/arrangement/composition-map.json
            song/qa-audio.json
            song/qa-asr-guide.json
            song/qa-asr-d.json
            song/qualification.json
          retention-days: 7
          if-no-files-found: warn
