name: A8 R02C Einar Clean Hero V9

on:
  push:
    paths:
      - '.github/workflows/a8-r02c-einar-hero-v9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  einar-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip xz-utils libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 mesa-vulkan-drivers
          mkdir -p /tmp/a8-einar-v9/{bin,src,out,godot,publish}

      - name: Restore immutable source archives
        uses: actions/cache@v4
        with:
          path: |
            /tmp/a8-einar-v8/src/einar.zip
            /tmp/a8-einar-v8/src/blender.tar.xz
          key: a8-einar-v1-blender-3.6.20-archives

      - name: Fetch official Einar and Blender 3.6 LTS
        run: |
          set -euxo pipefail
          EINAR='https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip'
          CACHE=/tmp/a8-einar-v8/src
          mkdir -p "$CACHE"
          if [ ! -s "$CACHE/einar.zip" ]; then
            curl -L --fail --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 -A 'Mozilla/5.0' -e 'https://studio.blender.org/characters/einar/v1/' -o "$CACHE/einar.zip" "$EINAR"
          fi
          echo '3cbb5a1dd9ffd3ca39edab420a83ea7f7db337b435a78ef27a0c87ff3e6977f7  /tmp/a8-einar-v8/src/einar.zip' | sha256sum -c -
          cp "$CACHE/einar.zip" /tmp/a8-einar-v9/src/einar.zip
          cd /tmp/a8-einar-v9/src
          rm -rf einar
          unzip -q einar.zip -d einar
          test -f einar/einar_release_v1.blend
          if [ ! -s "$CACHE/blender.tar.xz" ]; then
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 -o "$CACHE/blender.tar.xz" https://download.blender.org/release/Blender3.6/blender-3.6.20-linux-x64.tar.xz
          fi
          cp "$CACHE/blender.tar.xz" blender.tar.xz
          rm -rf /tmp/a8-einar-v9/bin/blender-3.6.20-linux-x64
          tar -xJf blender.tar.xz -C /tmp/a8-einar-v9/bin
          BLENDER=$(find /tmp/a8-einar-v9/bin -maxdepth 2 -type f -name blender | head -n1)
          "$BLENDER" --version | head -n2

      - name: Build clean hero export in Blender
        run: |
          set -euxo pipefail
          cat > /tmp/a8-einar-v9/src/hero_export.py <<'PY'
          import bpy, os, json, glob, re
          OUT='/tmp/a8-einar-v9/out'
          TEX='/tmp/a8-einar-v9/src/einar/textures'
          os.makedirs(OUT,exist_ok=True)
          bpy.context.scene.render.engine='BLENDER_EEVEE'
          bpy.context.scene.render.use_simplify=False
          print('V94_SIMPLIFY=',bpy.context.scene.render.use_simplify)
          try:
              bpy.ops.file.find_missing_files(directory=TEX)
          except Exception as e:
              print('find_missing_files:',e)

          all_files=[p for p in glob.glob(TEX+'/**/*',recursive=True) if os.path.isfile(p)]
          lower={p.lower():p for p in all_files}

          def pick(include, exclude=()):
              c=[]
              for p in all_files:
                  s=p.lower()
                  if all(x.lower() in s for x in include) and not any(x.lower() in s for x in exclude):
                      if os.path.splitext(s)[1] in ('.png','.jpg','.jpeg','.tif','.tiff','.exr'):
                          c.append(p)
              c.sort(key=lambda p:(0 if '/face/' in p.lower() else 1,len(p),p))
              return c[0] if c else None

          tex={
            'skin_color':pick(('skin','albedo')) or pick(('skin','color')),
            'skin_rough':pick(('skin','rough')) or pick(('face','rough')),
            'skin_normal':pick(('skin','normal')) or pick(('face','normal')),
            'eye_color':pick(('eyes','albedo')) or pick(('eye','albedo')),
            'hair_color':pick(('hair','color')),
            'hair_rough':pick(('hair','rough')),
            'cloth_color':pick(('clothing','color_base')) or pick(('sweater','color')),
            'cloth_normal':pick(('clothing','normal_base')) or pick(('sweater','normal')),
            'cloth_rough':pick(('clothing','rough')) or pick(('sweater','rough')),
          }
          print('V9_TEXTURE_MAP=',json.dumps(tex,indent=2))

          def img(path, noncolor=False):
              if not path or not os.path.exists(path): return None
              im=bpy.data.images.load(path,check_existing=True)
              if getattr(im,'source',None)=='TILED':
                  print('SKIP_UDIM',path); return None
              if noncolor:
                  try: im.colorspace_settings.name='Non-Color'
                  except: pass
              return im

          def pbr(name,base,rough,metal=0.0,color=None,roughmap=None,normal=None,alpha=False,color_texture_weight=1.0):
              m=bpy.data.materials.get(name) or bpy.data.materials.new(name)
              m.use_nodes=True
              m.diffuse_color=base
              if alpha:
                  m.blend_method='HASHED'
                  m.show_transparent_back=True
              nt=m.node_tree; nt.nodes.clear()
              out=nt.nodes.new('ShaderNodeOutputMaterial')
              bs=nt.nodes.new('ShaderNodeBsdfPrincipled')
              bs.inputs['Base Color'].default_value=base
              bs.inputs['Roughness'].default_value=rough
              bs.inputs['Metallic'].default_value=metal
              if 'Alpha' in bs.inputs: bs.inputs['Alpha'].default_value=base[3]
              if 'Subsurface' in bs.inputs:
                  try: bs.inputs['Subsurface'].default_value=0.08 if 'SKIN' in name else 0.0
                  except: pass
              nt.links.new(bs.outputs['BSDF'],out.inputs['Surface'])
              ci=img(color,False)
              if ci:
                  n=nt.nodes.new('ShaderNodeTexImage'); n.image=ci
                  if color_texture_weight < 0.999:
                      mix=nt.nodes.new('ShaderNodeMixRGB')
                      mix.blend_type='MIX'
                      mix.inputs[0].default_value=1.0-max(0.0,min(1.0,color_texture_weight))
                      mix.inputs[2].default_value=base
                      nt.links.new(n.outputs['Color'],mix.inputs[1])
                      nt.links.new(mix.outputs['Color'],bs.inputs['Base Color'])
                  else:
                      nt.links.new(n.outputs['Color'],bs.inputs['Base Color'])
                  if alpha and 'Alpha' in n.outputs and 'Alpha' in bs.inputs:
                      nt.links.new(n.outputs['Alpha'],bs.inputs['Alpha'])
              ri=img(roughmap,True)
              if ri:
                  n=nt.nodes.new('ShaderNodeTexImage'); n.image=ri
                  ramp=nt.nodes.new('ShaderNodeValToRGB')
                  ramp.color_ramp.elements[0].color=(0.36,0.36,0.36,1)
                  ramp.color_ramp.elements[1].color=(0.68,0.68,0.68,1)
                  nt.links.new(n.outputs['Color'],ramp.inputs['Fac'])
                  nt.links.new(ramp.outputs['Color'],bs.inputs['Roughness'])
              ni=img(normal,True)
              if ni:
                  n=nt.nodes.new('ShaderNodeTexImage'); n.image=ni
                  nm=nt.nodes.new('ShaderNodeNormalMap'); nm.inputs['Strength'].default_value=0.85
                  nt.links.new(n.outputs['Color'],nm.inputs['Color'])
                  nt.links.new(nm.outputs['Normal'],bs.inputs['Normal'])
              return m

          mats={
            'skin':pbr('A8V97_SKIN',(0.64,0.42,0.32,1),0.56,color=tex['skin_color'],normal=tex['skin_normal']),
            'iris':pbr('A8V97_IRIS',(0.18,0.15,0.12,1),0.20,color=tex['eye_color']),
            'pupil':pbr('A8V97_PUPIL',(0.02,0.02,0.02,1),0.16,color=tex['eye_color']),
            'sclera':pbr('A8V97_SCLERA',(0.70,0.68,0.64,1),0.30,color=tex['eye_color']),
            'cornea':pbr('A8V97_CORNEA',(0.92,0.97,1.0,0.08),0.035,alpha=True),
            'meniscus':pbr('A8V97_MENISCUS',(0.72,0.86,0.94,0.18),0.05,alpha=True),
            'hair':pbr('A8V97_HAIR',(0.028,0.011,0.004,1),0.56),
            'cloth':pbr('A8V97_CLOTH',(0.10,0.13,0.16,1),0.62,color=tex['cloth_color'],roughmap=tex['cloth_rough'],normal=tex['cloth_normal']),
            'mouth':pbr('A8V97_MOUTH',(0.34,0.08,0.06,1),0.46),
            'gums':pbr('A8V97_GUMS',(0.30,0.055,0.05,1),0.42),
            'teeth':pbr('A8V97_TEETH',(0.72,0.67,0.56,1),0.34),
            'dark':pbr('A8V97_DARK',(0.045,0.05,0.06,1),0.62),
          }
          mats['cornea'].blend_method='BLEND'
          mats['meniscus'].blend_method='BLEND'

          names=[
            'GEO-einar_head',
            'GEO-eye.L','GEO-eye.R','GEO-eye.cornea.L','GEO-eye.cornea.R',
            'GEO-eye.meniscus.L','GEO-eye.meniscus.R',
            'GEO-eye.plica_semilunaris.L','GEO-eye.plica_semilunaris.R',
            'GEO-einar_tongue','GEO-einar_teeth_upper','GEO-einar_teeth_lower',
            'GEO-einar_sweater','GEO-einar_jacket_main','GEO-einar_jacket_collar1','GEO-einar_jacket_collar2'
          ]
          chosen=[]
          missing=[]
          for n in names:
              o=bpy.data.objects.get(n)
              if o and o.type=='MESH':
                  chosen.append(o)
              else:
                  missing.append(n)
          print('V9_CHOSEN=',[o.name for o in chosen])
          print('V9_MISSING=',missing)

          def choose_slot(obj_name,old_name):
              key=(obj_name+' '+old_name).lower()
              if 'einar.skin' in key or obj_name=='GEO-einar_head': return mats['skin']
              if 'pupil' in key: return mats['pupil']
              if 'iris' in key: return mats['iris']
              if 'white' in key: return mats['sclera']
              if 'cornea' in key or 'eyes_shell' in key: return mats['cornea']
              if 'meniscus' in key: return mats['meniscus']
              if 'plica' in key: return mats['gums']
              if any(k in key for k in ('eyelash','hair_mesh')): return mats['hair']
              if 'tongue' in key: return mats['mouth']
              if 'gum' in key: return mats['gums']
              if 'teeth' in key: return mats['teeth']
              if any(k in key for k in ('sweater','jacket','cloth','fabric')): return mats['cloth']
              return mats['dark']

          # Force the source hero meshes to their actual high-detail viewport state before snapshot.
          modifier_report={}
          for o in chosen:
              rows=[]
              for mod in o.modifiers:
                  row={'name':mod.name,'type':mod.type,'show_viewport':mod.show_viewport,'show_render':mod.show_render}
                  if mod.type=='SUBSURF':
                      mod.show_viewport=True
                      mod.show_render=True
                      mod.levels=max(2,int(mod.levels))
                      mod.render_levels=max(2,int(mod.render_levels))
                      row['levels']=mod.levels
                      row['render_levels']=mod.render_levels
                  elif mod.type in {'CORRECTIVE_SMOOTH','LATTICE','SURFACE_DEFORM','SHRINKWRAP','DATA_TRANSFER','CAST'}:
                      mod.show_viewport=True
                      mod.show_render=True
                  elif mod.type=='NODES' and any(t in mod.name.lower() for t in ('displacement','stretch','store')):
                      mod.show_viewport=True
                      mod.show_render=True
                      row['forced_nodes']=True
                  rows.append(row)
              modifier_report[o.name]=rows
          bpy.context.view_layer.update()
          print('V94_MODIFIERS=',json.dumps(modifier_report,indent=2))

          # Preserve each semantic surface instead of replacing all slots on an object with one material.
          for o in chosen:
              old=[m.name if m else '' for m in o.data.materials]
              if len(o.data.materials)==0:
                  o.data.materials.append(choose_slot(o.name,''))
              else:
                  for i in range(len(o.data.materials)):
                      o.data.materials[i]=choose_slot(o.name,old[i])
              o.hide_viewport=False; o.hide_render=False
              print('MAT92',o.name,old,'=>',[m.name if m else '' for m in o.data.materials])

          # Bake the evaluated current hero state into clean static meshes so subdivision,
          # corrective/surface-deform and geometry-node results survive the fidelity gate.
          clean=bpy.data.collections.new('A8_V97_HERO_SNAPSHOT')
          bpy.context.scene.collection.children.link(clean)
          dg=bpy.context.evaluated_depsgraph_get()
          snapshots=[]
          snap_fail=[]
          for src in chosen:
              try:
                  ev=src.evaluated_get(dg)
                  me=bpy.data.meshes.new_from_object(ev,preserve_all_data_layers=True,depsgraph=dg)
                  if me is None or len(me.polygons)==0:
                      snap_fail.append({'name':src.name,'reason':'no_polygons'})
                      continue
                  ob=bpy.data.objects.new('A8V97_'+src.name,me)
                  ob.matrix_world=src.matrix_world.copy()
                  clean.objects.link(ob)
                  snapshots.append(ob)
              except Exception as e:
                  snap_fail.append({'name':src.name,'reason':repr(e)})
          print('V97_SNAPSHOT=',[(o.name,len(o.data.polygons)) for o in snapshots])
          print('V97_SNAPSHOT_FAIL=',snap_fail)
          for ob in snapshots:
              if ob.type=='MESH':
                  for p in ob.data.polygons: p.use_smooth=True

          head_snap=next((o for o in snapshots if 'GEO-einar_head' in o.name),None)
          if head_snap is not None and len(head_snap.data.polygons)<30000:
              # Deterministic fallback: apply Catmull-Clark on the already-evaluated clean snapshot.
              for ob in list(snapshots):
                  if any(k in ob.name for k in ('GEO-einar_head','GEO-eye.L','GEO-eye.R','GEO-eye.cornea')):
                      bpy.context.view_layer.objects.active=ob
                      for q in bpy.context.selected_objects: q.select_set(False)
                      ob.select_set(True)
                      sub=ob.modifiers.new('A8V97_CatmullClark','SUBSURF')
                      sub.subdivision_type='CATMULL_CLARK'
                      sub.levels=2
                      sub.render_levels=2
                      bpy.ops.object.modifier_apply(modifier=sub.name)
              head_snap=next((o for o in snapshots if 'GEO-einar_head' in o.name),None)
              print('V97_MANUAL_SUBDIV_APPLIED=',len(head_snap.data.polygons) if head_snap else -1)
          assert head_snap is not None and len(head_snap.data.polygons)>=30000, 'V97_HEAD_NOT_HIGH_DETAIL:'+str(len(head_snap.data.polygons) if head_snap else -1)

          # V9.6: convert the real Einar CURVES directly from source point data.
          # Explicit matrix_world transform avoids the V9.5 ObjectInfo/host-space ambiguity.
          # Cross-ribbons give 360-degree visibility at a fraction of the 18M-poly tube cost.
          hair_specs=[
              ('GEO-einar_hair',2,0.00068),
              ('GEO-einar_eyebrows',1,0.00038),
              ('GEO-einar_beard',6,0.00046),
              ('GEO-einar_mustache',3,0.00042),
              ('GEO-einar_eyelashes',2,0.00025),
          ]
          hair_report=[]
          hair_fail=[]

          from mathutils import Vector
          def add_ribbon_strands(src_name,stride,width):
              src=bpy.data.objects.get(src_name)
              if src is None or src.type!='CURVES':
                  hair_fail.append({'name':src_name,'reason':'missing_or_not_CURVES'})
                  return None
              curves=src.data.curves
              pts=src.data.points
              verts=[]
              faces=[]
              used=0
              minv=Vector((1e9,1e9,1e9)); maxv=Vector((-1e9,-1e9,-1e9))
              for ci,c in enumerate(curves):
                  if ci % stride: continue
                  try:
                      first=int(c.first_point_index); count=int(c.points_length)
                  except Exception as e:
                      hair_fail.append({'name':src_name,'reason':'curve_slice_api:'+repr(e)})
                      return None
                  if count<2: continue
                  pw=[]
                  for pi in range(first,first+count):
                      p=src.matrix_world @ Vector(pts[pi].position)
                      pw.append(p)
                      minv.x=min(minv.x,p.x);minv.y=min(minv.y,p.y);minv.z=min(minv.z,p.z)
                      maxv.x=max(maxv.x,p.x);maxv.y=max(maxv.y,p.y);maxv.z=max(maxv.z,p.z)
                  base=len(verts)
                  # two perpendicular ribbons per strand; taper gently toward tip
                  for j,p in enumerate(pw):
                      if j==0:t=(pw[1]-pw[0]).normalized()
                      elif j==len(pw)-1:t=(pw[-1]-pw[-2]).normalized()
                      else:t=(pw[j+1]-pw[j-1]).normalized()
                      ref=Vector((0,0,1)) if abs(t.z)<0.85 else Vector((0,1,0))
                      n=t.cross(ref).normalized()
                      b=t.cross(n).normalized()
                      taper=max(0.30,1.0-0.70*(j/max(1,len(pw)-1)))
                      w=width*taper
                      verts.extend((p+n*w,p-n*w,p+b*w,p-b*w))
                  for j in range(len(pw)-1):
                      a=base+j*4; q=base+(j+1)*4
                      faces.append((a,a+1,q+1,q))
                      faces.append((a+2,a+3,q+3,q+2))
                  used+=1
              if not faces:
                  hair_fail.append({'name':src_name,'reason':'no_faces'})
                  return None
              me=bpy.data.meshes.new('A8V97_MESH_'+src_name)
              me.from_pydata([tuple(v) for v in verts],[],faces)
              me.update()
              ob=bpy.data.objects.new('A8V97_STRANDS_'+src_name,me)
              clean.objects.link(ob)
              ob.data.materials.append(mats['hair'])
              for p in ob.data.polygons:p.use_smooth=True
              hair_report.append({
                  'name':src_name,'source_curves':len(curves),'source_points':len(pts),
                  'stride':stride,'used_curves':used,'verts':len(verts),'polys':len(faces),
                  'width':width,'world_min':list(minv),'world_max':list(maxv)
              })
              return ob

          for hn,stride,width in hair_specs:
              ho=add_ribbon_strands(hn,stride,width)
              if ho is not None:snapshots.append(ho)

          print('V97_HAIR_REPORT=',json.dumps(hair_report,indent=2))
          print('V97_HAIR_FAIL=',json.dumps(hair_fail,indent=2))
          assert any(r['name']=='GEO-einar_hair' and r['polys']>0 for r in hair_report), 'V97_MAIN_HAIR_CURVES_CONVERSION_FAILED'
          assert any(r['name']=='GEO-einar_eyebrows' and r['polys']>0 for r in hair_report), 'V97_BROW_CURVES_CONVERSION_FAILED'

          # Preserve raw source maps for visual diagnosis instead of guessing their semantics.
          diag={}
          for label,path in [('skin-source',tex.get('skin_color')),('eyes-source',tex.get('eye_color')),('hair-source',tex.get('hair_color'))]:
              try:
                  im=img(path,False)
                  if im:
                      oldpath=im.filepath_raw
                      oldfmt=im.file_format
                      im.filepath_raw=OUT+'/'+label+'.png'
                      im.file_format='PNG'
                      im.save()
                      diag[label]=OUT+'/'+label+'.png'
                      im.filepath_raw=oldpath; im.file_format=oldfmt
              except Exception as e:
                  diag[label]='ERROR:'+repr(e)
          print('V97_DIAGNOSTIC_MAPS=',json.dumps(diag,indent=2))
          chosen=snapshots

          for o in bpy.context.view_layer.objects:
              try:o.select_set(False)
              except:pass
          selected=[]
          for o in chosen:
              try:
                  o.hide_set(False);o.hide_viewport=False;o.hide_render=False;o.select_set(True)
                  selected.append(o.name)
              except Exception as e:
                  print('SELECT_FAIL',o.name,e)
          assert any('GEO-einar_head' in n for n in selected)
          assert any('A8V97_STRANDS_GEO-einar_hair' in n for n in selected)
          assert any('A8V97_STRANDS_GEO-einar_eyebrows' in n for n in selected)

          inv={'textures':tex,'selected':selected,'missing':missing,'snapshot_fail':snap_fail,'snapshot_polys':{o.name:len(o.data.polygons) for o in snapshots},'modifier_report':modifier_report,'hair_report':hair_report,'hair_fail':hair_fail}
          json.dump(inv,open(OUT+'/v9-inventory.json','w'),indent=2)

          bpy.ops.export_scene.gltf(
              filepath=OUT+'/einar-hero-v9.glb',
              export_format='GLB',
              use_selection=True,
              export_apply=True,
              export_texcoords=True,
              export_normals=True,
              export_tangents=True,
              export_materials='EXPORT',
              export_colors=True,
              export_cameras=False,
              export_lights=False,
              export_skins=False,
              export_morph=False,
              export_animations=False,
              export_yup=True,
          )
          p=OUT+'/einar-hero-v9.glb'
          assert os.path.getsize(p)>500000
          print('V9_GLB_BYTES=',os.path.getsize(p))
          PY
          BLENDER=$(find /tmp/a8-einar-v9/bin -maxdepth 2 -type f -name blender | head -n1)
          cd /tmp/a8-einar-v9/src/einar
          "$BLENDER" --background --enable-autoexec einar_release_v1.blend --python /tmp/a8-einar-v9/src/hero_export.py 2>&1 | tee /tmp/a8-einar-v9/out/blender.log
          sha256sum /tmp/a8-einar-v9/out/einar-hero-v9.glb > /tmp/a8-einar-v9/out/einar-hero-v9.sha256

      - name: Install Godot 4.6
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/a8-einar-v9/src/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/a8-einar-v9/src/godot.zip -d /tmp/a8-einar-v9/bin
          chmod +x /tmp/a8-einar-v9/bin/Godot_v4.6-stable_linux.x86_64

      - name: Build controlled Godot hero probe
        run: |
          set -euxo pipefail
          PROJ=/tmp/a8-einar-v9/godot
          cp /tmp/a8-einar-v9/out/einar-hero-v9.glb "$PROJ/einar-hero-v9.glb"
          cat > "$PROJ/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="A8 Einar Hero V9"
          run/main_scene="res://hero.tscn"
          [display]
          window/size/viewport_width=896
          window/size/viewport_height=896
          [rendering]
          renderer/rendering_method="forward_plus"
          renderer/rendering_method.mobile="forward_plus"
          EOF
          cat > "$PROJ/hero.tscn" <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://hero.gd" id="1"]
          [node name="Hero" type="Node3D"]
          script = ExtResource("1")
          EOF
          cat > "$PROJ/hero.gd" <<'EOF'
          extends Node3D
          var model:Node3D
          var camera:Camera3D
          var bounds:=AABB()
          var have_bounds=false
          var head_bounds:=AABB()
          var have_head=false
          var shot=0
          var settle=0

          func _ready():
              var ps:=load("res://einar-hero-v9.glb") as PackedScene
              if ps==null:
                  push_error("V9_GLB_LOAD_NULL"); get_tree().quit(41); return
              model=ps.instantiate() as Node3D
              add_child(model)
              _collect(model)
              print("V9_BOUNDS=",bounds)
              _tune_materials(model)
              _env()
              _lights()
              camera=Camera3D.new()
              camera.current=true
              camera.fov=34.0
              camera.near=0.01
              camera.far=100.0
              add_child(camera)
              get_viewport().msaa_3d=Viewport.MSAA_4X
              _place(0)

          func _process(_d):
              settle+=1
              if settle<10:return
              get_viewport().get_texture().get_image().save_png("/tmp/a8-einar-v9/out/H%02d.png" % (shot+1))
              shot+=1
              if shot>=8:
                  get_tree().quit(); return
              settle=0
              _place(shot)

          func _collect(n:Node):
              if n is MeshInstance3D:
                  var mi:=n as MeshInstance3D
                  if mi.mesh:
                      var a:=mi.global_transform * mi.get_aabb()
                      if not have_bounds: bounds=a; have_bounds=true
                      else: bounds=bounds.merge(a)
                      var nn:=str(mi.name).to_lower()
                      if "einar_head" in nn or nn.ends_with("_head") or "geo-einar_head" in nn:
                          if not have_head: head_bounds=a; have_head=true
                          else: head_bounds=head_bounds.merge(a)
              for c in n.get_children(): _collect(c)

          func _tune_materials(n:Node):
              if n is MeshInstance3D:
                  var mi:=n as MeshInstance3D
                  if mi.mesh:
                      for i in range(mi.mesh.get_surface_count()):
                          var m:=mi.get_active_material(i)
                          if m is StandardMaterial3D:
                              var sm:=m as StandardMaterial3D
                              var nm:=sm.resource_name
                              if "A8V97_SKIN" in nm:
                                  sm.roughness=0.56
                                  sm.metallic_specular=0.10
                                  sm.subsurf_scatter_enabled=true
                                  sm.subsurf_scatter_skin_mode=true
                                  sm.subsurf_scatter_strength=0.16
                              elif "A8V97_IRIS" in nm or "A8V97_PUPIL" in nm:
                                  sm.roughness=0.11
                              elif "A8V97_SCLERA" in nm:
                                  sm.roughness=0.24
                              elif "A8V97_CORNEA" in nm or "A8V97_MENISCUS" in nm:
                                  sm.roughness=0.035
                                  sm.transparency=BaseMaterial3D.TRANSPARENCY_ALPHA
                              elif "A8V97_HAIR" in nm:
                                  sm.roughness=0.48
                                  sm.cull_mode=BaseMaterial3D.CULL_DISABLED
                                  sm.diffuse_mode=BaseMaterial3D.DIFFUSE_LAMBERT_WRAP
              for c in n.get_children(): _tune_materials(c)

          func _env():
              var sky_mat:=ProceduralSkyMaterial.new()
              sky_mat.sky_top_color=Color(0.055,0.065,0.085)
              sky_mat.sky_horizon_color=Color(0.16,0.17,0.19)
              sky_mat.ground_horizon_color=Color(0.10,0.11,0.13)
              sky_mat.ground_bottom_color=Color(0.035,0.04,0.05)
              var sky:=Sky.new(); sky.sky_material=sky_mat
              var env:=Environment.new()
              env.background_mode=Environment.BG_SKY
              env.sky=sky
              env.ambient_light_source=Environment.AMBIENT_SOURCE_SKY
              env.ambient_light_energy=0.72
              env.tonemap_mode=Environment.TONE_MAPPER_AGX
              env.tonemap_exposure=1.15
              env.glow_enabled=true
              env.glow_intensity=0.12
              var we:=WorldEnvironment.new(); we.environment=env; add_child(we)

          func _lights():
              var key:=DirectionalLight3D.new()
              key.light_color=Color(1.0,0.79,0.66)
              key.light_energy=1.85
              key.rotation_degrees=Vector3(-32,-48,0)
              key.shadow_enabled=true
              add_child(key)
              var fill:=DirectionalLight3D.new()
              fill.light_color=Color(0.34,0.48,0.72)
              fill.light_energy=1.15
              fill.rotation_degrees=Vector3(-15,55,0)
              add_child(fill)
              var rim:=DirectionalLight3D.new()
              rim.light_color=Color(0.35,0.55,1.0)
              rim.light_energy=0.85
              rim.rotation_degrees=Vector3(-18,145,0)
              add_child(rim)
              var front:=OmniLight3D.new()
              front.light_color=Color(1.0,0.86,0.76)
              front.light_energy=2.2
              front.omni_range=4.0
              front.shadow_enabled=false
              front.position=Vector3(0.0,1.72,1.15)
              add_child(front)

          func _place(i:int):
              var b:=head_bounds if have_head else bounds
              var target:=b.get_center()+Vector3(0,b.size.y*0.02,0)
              var r=maxf(b.size.y*2.15,0.42)
              var angles=[0.0,45.0,90.0,135.0,180.0,225.0,270.0,315.0]
              var a:=deg_to_rad(angles[i])
              camera.global_position=target+Vector3(sin(a)*r,b.size.y*0.02,cos(a)*r)
              camera.look_at(target,Vector3.UP)
              print("V9_1_CAMERA",i," head=",head_bounds," target=",target," pos=",camera.global_position)
          EOF

      - name: Import and render hero in Godot
        run: |
          set -euxo pipefail
          GODOT=/tmp/a8-einar-v9/bin/Godot_v4.6-stable_linux.x86_64
          PROJ=/tmp/a8-einar-v9/godot
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          "$GODOT" --headless --editor --path "$PROJ" --import 2>&1 | tee /tmp/a8-einar-v9/out/godot-import.log
          xvfb-run -a "$GODOT" --path "$PROJ" --rendering-method forward_plus --audio-driver Dummy res://hero.tscn 2>&1 | tee /tmp/a8-einar-v9/out/godot.log
          test -s /tmp/a8-einar-v9/out/H01.png
          test -s /tmp/a8-einar-v9/out/H08.png
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/a8-einar-v9/out/godot.log; then echo 'Godot runtime errors'; exit 1; fi
          sha256sum /tmp/a8-einar-v9/out/H*.png > /tmp/a8-einar-v9/out/hero-frames.sha256

      - name: Receipt and bounded artifact
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,os
          inv=json.load(open('/tmp/a8-einar-v9/out/v9-inventory.json'))
          receipt={
            'route':'R02C',
            'recipe':'EINAR_V9_8_FRONT_FILL_NORMAL_RESPONSE',
            'source':'official Blender Studio Einar v1',
            'source_license':'CC-BY',
            'source_archive_sha256':'3cbb5a1dd9ffd3ca39edab420a83ea7f7db337b435a78ef27a0c87ff3e6977f7',
            'selected_objects':inv['selected'],
            'texture_map':inv['textures'],
            'goal':'isolate remaining black-nose defect as lighting/normal response using explicit frontal fill while preserving V9.7 source skin/eyes and real groom unchanged',
            'glb_bytes':os.path.getsize('/tmp/a8-einar-v9/out/einar-hero-v9.glb')
          }
          json.dump(receipt,open('/tmp/a8-einar-v9/out/receipt.json','w'),indent=2)
          PY
          cp /tmp/a8-einar-v9/out/{v9-inventory.json,blender.log,einar-hero-v9.sha256,godot-import.log,godot.log,hero-frames.sha256,receipt.json,H01.png,H02.png,H03.png,H04.png,H05.png,H06.png,H07.png,H08.png} /tmp/a8-einar-v9/publish/
          for f in /tmp/a8-einar-v9/out/skin-source.png /tmp/a8-einar-v9/out/eyes-source.png /tmp/a8-einar-v9/out/hair-source.png; do [ ! -s "$f" ] || cp "$f" /tmp/a8-einar-v9/publish/; done

      - name: Upload V9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: a8-r02c-einar-clean-hero-v9
          path: /tmp/a8-einar-v9/publish
          retention-days: 7
