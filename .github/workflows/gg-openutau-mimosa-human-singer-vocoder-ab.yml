name: GG Mimosa Dark human singer + vocoder A-B
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".nd-labs/gg-vfs/GGVfsUfrOpenUtauQcTest.cs"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  render-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare OpenUtau native DiffSinger runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGVfsUfrOpenUtauQcTest.cs" />\n  </ItemGroup>\n'
          if 'GGVfsUfrOpenUtauQcTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          cp .nd-labs/gg-vfs/GGVfsUfrOpenUtauQcTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGVfsUfrOpenUtauQcTest.cs

      - name: Recover UFR pack
        uses: actions/download-artifact@v4
        with:
          name: gg-vfs-kumi-discovery
          run-id: 37178003583
          github-token: ${{ github.token }}
          path: /tmp/ufr-cache

      - name: Prepare stock and EZV Mimosa Dark banks
        shell: bash
        run: |
          set -euo pipefail
          pack="$(find /tmp/ufr-cache -type f -name 'ufr-pack.download' -print -quit)"
          test -n "$pack"
          mkdir -p /tmp/ufr
          unzip -q "$pack" -d /tmp/ufr
          root="$(find /tmp/ufr -type f -path '*/0_CORE/dsacoustic/millefeuille_v001.phonemes.json' -printf '%h\n' | sed 's#/0_CORE/dsacoustic$##' | head -n 1)"
          bank="$root/Millefeuille_Mimosa"
          test -f "$bank/dsconfig.yaml"
          test -f "$bank/dsdur/dsdict-ru.yaml"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Millefeuille Mimosa\nauthor=UFR\nvoice=UFR\nversion=OpenUtau human singer audition\n' > "$bank/character.txt"
          fi

          # Keep stock bank in its original UFR tree so shared ../0_CORE paths remain valid.
          stock_bank="$bank"
          # EZV trial gets an isolated bank copy; shared UFR core remains read-only via symlink.
          cp -a "$bank" /tmp/Mimosa_ezv
          ln -s "$root/0_CORE" /tmp/0_CORE

          echo "=== STOCK VOCODER EVIDENCE ==="
          grep -nE '^(vocoder|sample_rate|hop_size|num_mel_bins)' "$stock_bank/dsconfig.yaml" || true
          find "$stock_bank" -maxdepth 2 -type f -name 'vocoder.yaml' -print -exec sed -n '1,80p' {} \; || true

          # Official upstream release only. License permits commercial rendered audio
          # but prohibits redistribution/modification of the vocoder itself.
          curl -fL --retry 3 \
            https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger_v2.0.zip \
            -o /tmp/ezv.zip
          echo "02305b5814e8cc832b20b1c84daa95505b6fa7445c496269227ce5ec49ff9129  /tmp/ezv.zip" | sha256sum -c -
          mkdir -p /tmp/ezv_unpack
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('/tmp/ezv_unpack')
          with zipfile.ZipFile('/tmp/ezv.zip') as z:
              for info in z.infolist():
                  rel=Path(*info.filename.replace('\\\\','/').replace('\\','/').split('/'))
                  if not str(rel) or str(rel)=='.': continue
                  dst=root/rel
                  if info.is_dir():
                      dst.mkdir(parents=True,exist_ok=True)
                  else:
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as src, open(dst,'wb') as out:
                          out.write(src.read())
          PY
          ezv_cfg="$(find /tmp/ezv_unpack -type f -name vocoder.yaml -print -quit)"
          test -n "$ezv_cfg"
          ezv_dir="$(dirname "$ezv_cfg")"
          rm -rf /tmp/Mimosa_ezv/dsvocoder
          mkdir -p /tmp/Mimosa_ezv/dsvocoder
          cp -a "$ezv_dir"/. /tmp/Mimosa_ezv/dsvocoder/
          test -f /tmp/Mimosa_ezv/dsvocoder/vocoder.yaml
          echo "=== EZV VOCODER EVIDENCE ==="
          sed -n '1,100p' /tmp/Mimosa_ezv/dsvocoder/vocoder.yaml

          echo "MIMOSA_STOCK=$stock_bank" >> "$GITHUB_ENV"
          echo "MIMOSA_EZV=/tmp/Mimosa_ezv" >> "$GITHUB_ENV"

      - name: Build OpenUtau
        working-directory: /tmp/openutau
        run: dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release

      - name: Render singer physics with stock vocoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/human-singer/all"
          cd /tmp/openutau
          for style in singer_a singer_b singer_c; do
            OPENUTAU_TEST_SINGERS="$MIMOSA_STOCK" \
            GG_VFS_OUT="${GITHUB_WORKSPACE}/human-singer/all" \
            GG_VFS_TAG="Mimosa_Dark_${style}_STOCK" \
            GG_VFS_SPEAKER_HINT="Dark" \
            GG_VFS_VARIANT="$style" \
            GG_VFS_L_OFFSET_TICKS="55" \
            GG_VFS_STEPS="64" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj --configuration Release --no-build \
              --filter RenderUfrVoiceWithOfficialRussianPhonemizer
          done

      - name: Render same performances with EZV v2 vocoder
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          for style in singer_a singer_b singer_c; do
            OPENUTAU_TEST_SINGERS="$MIMOSA_EZV" \
            GG_VFS_OUT="${GITHUB_WORKSPACE}/human-singer/all" \
            GG_VFS_TAG="Mimosa_Dark_${style}_EZV2" \
            GG_VFS_SPEAKER_HINT="Dark" \
            GG_VFS_VARIANT="$style" \
            GG_VFS_L_OFFSET_TICKS="55" \
            GG_VFS_STEPS="64" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj --configuration Release --no-build \
              --filter RenderUfrVoiceWithOfficialRussianPhonemizer
          done
          test "$(find "${GITHUB_WORKSPACE}/human-singer/all" -name '*.wav' | wc -l)" -eq 6

      - name: Install independent audio QC
        run: python -m pip install faster-whisper librosa==0.10.2.post1 soundfile numpy scipy

      - name: Gate diction, melodic arc, dynamics and spectral diagnostics
        shell: bash
        run: |
          cat > /tmp/qc.py <<'PY'
          import json,re,hashlib,shutil
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          import librosa
          from faster_whisper import WhisperModel

          root=Path("human-singer/all"); out=Path("human-singer/passed"); out.mkdir(parents=True,exist_ok=True)
          model=WhisperModel("small",device="cpu",compute_type="int8")
          target="я говорил не с ним"
          results=[]

          def norm(x):
              x=x.lower().replace("ё","е")
              x=re.sub(r"[^а-я\s]"," ",x)
              return re.sub(r"\s+"," ",x).strip()

          for p in sorted(root.glob("*.wav")):
              m=re.search(r"Mimosa_Dark_(singer_[abc])_(STOCK|EZV2)",p.name)
              if not m: continue
              style,vocoder=m.group(1),m.group(2)
              segs,_=model.transcribe(str(p),language="ru",beam_size=5,word_timestamps=True,
                  temperature=0.0,condition_on_previous_text=False)
              segs=list(segs); words=[]; texts=[]
              for s in segs:
                  texts.append(s.text.strip())
                  for w in s.words or []:
                      ww=norm(w.word)
                      if ww: words.append({"word":ww,"start":float(w.start),"end":float(w.end),"p":float(w.probability)})
              transcript=norm(" ".join(texts))
              ne=max((w for w in words if w["word"]=="не"),key=lambda x:x["p"],default=None)
              gov=max((w for w in words if w["word"]=="говорил"),key=lambda x:x["p"],default=None)

              y,sr=sf.read(p)
              if y.ndim>1: y=y.mean(axis=1)
              hop=256
              f0,_,_=librosa.pyin(y,fmin=librosa.note_to_hz("C2"),fmax=librosa.note_to_hz("C6"),
                                  sr=sr,frame_length=2048,hop_length=hop)
              idx=np.where(np.isfinite(f0))[0]
              pitch_span=0.; local_motion=0.; gross_jump=1.
              if len(idx)>4:
                  vals=f0[idx]
                  cents=1200*np.log2(vals/np.median(vals))
                  pitch_span=float(np.percentile(cents,95)-np.percentile(cents,5))
                  d=1200*np.log2(vals[1:]/vals[:-1])
                  cont=np.diff(idx)==1
                  d=d[cont]
                  if len(d):
                      gross_jump=float(np.mean(np.abs(d)>350))
                      local=d[np.abs(d)<100]
                      local_motion=float(np.mean(np.abs(local))) if len(local) else 0.

              rms=librosa.feature.rms(y=y,frame_length=2048,hop_length=hop)[0]
              active=rms>np.max(rms)*0.01
              db=librosa.amplitude_to_db(rms,ref=np.max)
              loud_span=float(np.percentile(db[active],90)-np.percentile(db[active],10)) if np.any(active) else 0.
              energy_jump=float(np.percentile(np.abs(np.diff(rms)),99)) if len(rms)>1 else 1.

              S=np.abs(librosa.stft(y,n_fft=4096,hop_length=hop,win_length=4096))
              freqs=librosa.fft_frequencies(sr=sr,n_fft=4096)
              powS=S*S+1e-12
              active_frames=np.where(np.sum(powS,axis=0)>np.max(np.sum(powS,axis=0))*0.01)[0]
              band=(freqs>=2500)&(freqs<=6000)
              upper=(freqs>=8000)
              total=np.sum(powS[:,active_frames],axis=0)+1e-12 if len(active_frames) else np.array([1.])
              band_ratio=float(np.median(np.sum(powS[band][:,active_frames],axis=0)/total)) if len(active_frames) else 0.
              upper_ratio=float(np.median(np.sum(powS[upper][:,active_frames],axis=0)/total)) if len(active_frames) else 0.
              flat=librosa.feature.spectral_flatness(S=S)[0]
              flat_med=float(np.median(flat[active_frames])) if len(active_frames) else 0.

              ne_p=float(ne["p"]) if ne else 0.; gov_p=float(gov["p"]) if gov else 0.
              mean_word=float(np.mean([w["p"] for w in words])) if words else 0.
              manifest=p.with_name(p.name.replace("__OPENUTAU_RU_QC.wav","__manifest.txt"))
              mt=manifest.read_text(encoding="utf8") if manifest.exists() else ""
              native_ok=("ru/rj ru/i ru/l" in mt and "ru/nj ru/e" in mt and
                         "l_offset_ticks=55" in mt and "manual_frame_f0=false" in mt and
                         "manual_phoneme_durations=false" in mt and "render_steps=64" in mt)

              # This is deliberately permissive on expressive note transitions;
              # it rejects only true glitches while requiring a visibly musical contour.
              passed=bool(transcript==target and native_ok and ne_p>=0.80 and gov_p>=0.72 and
                          pitch_span>=380 and local_motion>=2.5 and loud_span>=6.0 and
                          gross_jump<0.02 and energy_jump<0.02)
              score=(mean_word+ne_p+gov_p + 0.0015*pitch_span + 0.03*loud_span +
                     0.04*local_motion - 5*gross_jump)
              results.append({"file":p.name,"style":style,"vocoder":vocoder,"text":transcript,
                  "ne":ne_p,"govoril":gov_p,"word":mean_word,"pitch_span_cents":pitch_span,
                  "local_pitch_motion_cents":local_motion,"loudness_span_db":loud_span,
                  "gross_jump_rate":gross_jump,"energy_jump_p99":energy_jump,
                  "band_2p5_6k_ratio":band_ratio,"upper_8k_ratio":upper_ratio,
                  "spectral_flatness":flat_med,"native_ok":native_ok,"pass":passed,"score":score})

          passed=sorted([x for x in results if x["pass"]],key=lambda x:x["score"],reverse=True)
          Path("human-singer/qc-report.json").write_text(json.dumps({"target":target,"results":results},ensure_ascii=False,indent=2))
          if len(passed)<2:
              print(json.dumps(results,ensure_ascii=False,indent=2))
              raise SystemExit("Fewer than two human-singer candidates passed")

          # Keep the best distinct candidate from each vocoder if possible, plus best remaining.
          selected=[]; hashes=set()
          for voc in ["STOCK","EZV2"]:
              c=next((x for x in passed if x["vocoder"]==voc),None)
              if c:
                  h=hashlib.sha256((root/c["file"]).read_bytes()).hexdigest()
                  if h not in hashes: hashes.add(h); selected.append(c)
          for x in passed:
              if len(selected)>=4: break
              h=hashlib.sha256((root/x["file"]).read_bytes()).hexdigest()
              if h in hashes: continue
              hashes.add(h); selected.append(x)

          for i,x in enumerate(selected,1):
              src=root/x["file"]
              dst=out/f"{i:02d}_Mimosa_Dark_{x['style']}_{x['vocoder']}.wav"
              shutil.copy2(src,dst)
              x["selected_as"]=dst.name
              x["sha256"]=hashlib.sha256(src.read_bytes()).hexdigest()

          Path("human-singer/qc-report.json").write_text(json.dumps(
              {"target":target,"selected":selected,"results":results},ensure_ascii=False,indent=2))
          with Path("human-singer/qc-summary.txt").open("w",encoding="utf8") as f:
              for x in selected:
                  f.write(f"{x['selected_as']} | text={x['text']} | не={x['ne']:.3f} | говорил={x['govoril']:.3f} | "
                          f"pitch_span={x['pitch_span_cents']:.1f}c | local={x['local_pitch_motion_cents']:.2f}c | "
                          f"dyn={x['loudness_span_db']:.2f}dB | 2.5-6k={x['band_2p5_6k_ratio']:.6f} | "
                          f">8k={x['upper_8k_ratio']:.6f} | flat={x['spectral_flatness']:.8f} | "
                          f"sha256={x['sha256']}\n")
          print(Path("human-singer/qc-summary.txt").read_text())
          PY
          python /tmp/qc.py

      - name: Prove vocoder software is not redistributed
        shell: bash
        run: |
          set -euo pipefail
          ! find human-singer -type f \( -name '*.onnx' -o -name 'vocoder.yaml' -o -name '*.oudep' \) | grep .
          find human-singer/passed -type f -maxdepth 1 -printf '%f %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-mimosa-dark-human-singer-vocoder-ab
          path: |
            human-singer/passed/
            human-singer/qc-report.json
            human-singer/qc-summary.txt
          retention-days: 3
          if-no-files-found: warn
