name: Mind Tides PWA integration
on:
  push:
    paths:
      - '.github/workflows/mind-tides-pwa-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate manifest and offline worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mind-tides/index.html')
          s=p.read_text()
          manifest='<link rel="manifest" href="/mind-tides/manifest.webmanifest"><meta name="theme-color" content="#111111">'
          registration="<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/mind-tides/sw.js',{scope:'/mind-tides/'}).catch(()=>{}))}</script>"
          if 'manifest.webmanifest' not in s:
              s=s.replace('</head>',manifest+'</head>',1)
          if "serviceWorker.register('/mind-tides/sw.js'" not in s:
              s=s.replace('</body>',registration+'</body>',1)
          p.write_text(s)
          assert 'manifest.webmanifest' in s
          assert "serviceWorker.register('/mind-tides/sw.js'" in s
          PY
      - name: Commit integrated shell
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mind-tides/index.html
          git commit -m 'Mind Tides: integrate installable offline shell'
          git push
