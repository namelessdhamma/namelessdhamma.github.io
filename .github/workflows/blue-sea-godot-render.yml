name: Blue Sea Godot Cinematic Render

on:
  push:
    branches: [main]
    paths:
      - "sinee-more-godot/.nd/render-request.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_PROJECT: ${{ github.workspace }}/sinee-more-godot
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve render request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p="sinee-more-godot/.nd/render-request.json"
          obj=json.load(open(p,encoding="utf-8"))
          ref=obj.get("ref","a5-landscape-16x9-repair")
          scene=obj.get("scene","res://intro/storm_intro_render.tscn")
          fps=int(obj.get("fps",24))
          frames=int(obj.get("frames",312))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"RENDER_REF={ref}\n")
              f.write(f"RENDER_SCENE={scene}\n")
              f.write(f"RENDER_FPS={fps}\n")
              f.write(f"RENDER_FRAMES={frames}\n")
          print(json.dumps({"ref":ref,"scene":scene,"fps":fps,"frames":frames}))
          PY

      - name: Install pinned Godot developer stack
        run: bash sinee-more-godot/ci/setup_godot_cloud.sh

      - name: Checkout requested source ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RENDER_REF"
          git checkout --detach FETCH_HEAD
          echo "source_commit=$(git rev-parse HEAD)"

      - name: Render Godot movie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_PROJECT/ci-out/render"
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >"$GODOT_PROJECT/ci-out/render/xvfb.log" 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          trap 'kill "$XVFB_PID" >/dev/null 2>&1 || true' EXIT

          godot --headless --path "$GODOT_PROJECT" --editor --quit             >"$GODOT_PROJECT/ci-out/render/import.log" 2>&1

          godot --path "$GODOT_PROJECT"             --fixed-fps "$RENDER_FPS"             --write-movie "$GODOT_PROJECT/ci-out/render/storm.avi"             --quit-after "$RENDER_FRAMES"             "$RENDER_SCENE"             >"$GODOT_PROJECT/ci-out/render/godot-render.log" 2>&1

          test -s "$GODOT_PROJECT/ci-out/render/storm.avi"

          ffmpeg -y -hide_banner -loglevel error             -i "$GODOT_PROJECT/ci-out/render/storm.avi"             -an -c:v libx264 -preset medium -crf 20             -pix_fmt yuv420p -r "$RENDER_FPS"             -movflags +faststart             "$GODOT_PROJECT/ci-out/render/blue-sea-godot-storm.mp4"

          test -s "$GODOT_PROJECT/ci-out/render/blue-sea-godot-storm.mp4"

          ffprobe -v error             -select_streams v:0             -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames             -show_entries format=duration,size             -of json             "$GODOT_PROJECT/ci-out/render/blue-sea-godot-storm.mp4"             >"$GODOT_PROJECT/ci-out/render/ffprobe.json"

          mkdir -p "$GODOT_PROJECT/ci-out/render/proof"
          for t in 1 3 6 10 12; do
            ffmpeg -y -hide_banner -loglevel error               -ss "$t"               -i "$GODOT_PROJECT/ci-out/render/blue-sea-godot-storm.mp4"               -frames:v 1               "$GODOT_PROJECT/ci-out/render/proof/frame-${t}s.jpg"
          done

      - name: Upload Godot render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blue-sea-godot-render-${{ github.run_id }}
          path: |
            sinee-more-godot/ci-out/render/blue-sea-godot-storm.mp4
            sinee-more-godot/ci-out/render/ffprobe.json
            sinee-more-godot/ci-out/render/proof/
            sinee-more-godot/ci-out/render/godot-render.log
            sinee-more-godot/ci-out/render/import.log
          if-no-files-found: warn
          retention-days: 14
