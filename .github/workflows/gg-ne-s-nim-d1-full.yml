name: GG Nezrimy Gost D1R5 Production Qualification

on:
  push:
    branches:
      - compute/gg-nezrimy-gost-d1r5-20261006
    paths:
      - '.github/workflows/gg-ne-s-nim-d1-full.yml'
      - 'docs/gg/songs/ne-s-nim-d1-full-v3.json'
      - '.nd-labs/gg-songs/GGNeSNimD1FullTest.cs'
      - 'tools/gg_ne_s_nim_d1_full_arrange.py'
      - 'tools/gg_audio_qa.py'
      - 'tools/gg_d1r5_phrase_repair.py'
      - 'tools/gg_d1r5_guide_identity_repair.py'
      - 'tools/gg_d1r5_vfs_envelope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Applio runtime
        uses: actions/cache/restore@v4
        with:
          path: .gg-applio-cache
          key: gg-applio-cpu-v2-\${{ runner.os }}-324f4d89

      - name: Restore Awata RVC
        uses: actions/cache/restore@v4
        with:
          path: .gg-rvc-model-cache
          key: gg-rvc-awata-v1.2-\${{ runner.os }}

      - name: Install audio and analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git unzip ffmpeg fluidsynth fluid-soundfont-gm build-essential \
            libsndfile1 libportaudio2 patchelf libicu-dev
          python -m pip install -q \
            mido numpy scipy soundfile librosa==0.10.2.post1 pyyaml \
            faster-whisper==1.1.1 jiwer==3.0.4

      - name: Verify Drive-authoritative D1 projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib
          p=pathlib.Path('docs/gg/songs/ne-s-nim-d1-full-v3.json')
          s=json.loads(p.read_text())
          assert s['version']=='D1_FULL_V3', s.get('version')
          assert s['bars']==120, s['bars']
          assert len(s['chords'])==120, len(s['chords'])
          assert len(s['phrases'])==30, len(s['phrases'])
          assert s['form']['verse_I']==[4,27]
          assert s['form']['chorus_I']==[28,39]
          assert s['form']['verse_II']==[44,55]
          assert s['form']['chorus_II']==[56,67]
          assert s['form']['bridge']==[68,79]
          assert s['form']['instrumental_development']==[80,95]
          assert s['form']['final']==[96,107]
          assert s['form']['coda']==[108,113]
          assert s['form']['outro']==[114,119]
          clean=lambda x: re.sub(r'[^а-яё0-9 ]+',' ',x.lower()).split()
          target=clean(s['target_text'])
          rendered=[w['text'].lower() for ph in s['phrases'] for w in ph['words']]
          assert len(target)==168, len(target)
          assert target==rendered, (len(target),len(rendered))
          for ph in s['phrases']:
              assert ph['offset']%240==0
              t=ph['bar']*1920+ph['offset']
              for w in ph['words']:
                  assert len(w['pitches'])==len(w['durations'])>0
                  assert 0<=w['stress']<len(w['pitches'])
                  t+=sum(w['durations'])+w['rest']
              assert t<=ph['bar']*1920+3*1920, (ph['id'],t-(ph['bar']*1920+3*1920))
          print(json.dumps({'status':'PASS','version':s['version'],'bars':s['bars'],'phrases':len(s['phrases']),'words':len(rendered)},ensure_ascii=False))
          PY

      - name: Render arrangement from shared score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p song/arrangement
          python tools/gg_ne_s_nim_d1_full_arrange.py \
            docs/gg/songs/ne-s-nim-d1-full-v3.json \
            "$GITHUB_WORKSPACE/song/arrangement"

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimD1FullTest.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimD1FullTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimD1FullTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimD1FullTest.cs

          curl -fL --retry 3 -o /tmp/awata.zip \
            https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"
          fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          if not (dst/'vocoder.yaml').exists():
              arc=pathlib.Path('/tmp/ezv.oudep')
              arc.write_bytes(urllib.request.urlopen(
                  'https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',
                  timeout=300).read())
              dst.mkdir(exist_ok=True)
              with zipfile.ZipFile(arc) as z:
                  names={n.replace('\\','/'):n for n in z.namelist()}
                  cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
                  data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
                  m=next(n for n in names if n.split('/')[-1]==model)
                  (dst/'vocoder.yaml').write_bytes(data)
                  with z.open(names[m]) as inf,(dst/model).open('wb') as out:
                      shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Render clean vocal guide from same shared score
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release
          mkdir -p "$GITHUB_WORKSPACE/song/vocal"
          OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
          GG_VFS_OUT="$GITHUB_WORKSPACE/song/vocal" \
          GG_VFS_TAG="NE_S_NIM_D1_FULL_GUIDE" \
          GG_VFS_SPEAKER_HINT="Mature" \
          GG_VFS_VARIANT="shared_d1" \
          GG_VFS_STEPS="64" \
          GG_VFS_L_OFFSET_TICKS="-60" \
          GG_SHARED_SCORE="$GITHUB_WORKSPACE/docs/gg/songs/ne-s-nim-d1-full-v3.json" \
          dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj \
            --configuration Release --no-build --filter RenderNeSNimD1Full
          guide="$(find "$GITHUB_WORKSPACE/song/vocal" -name '*OPENUTAU_RU_QC.wav' -print -quit)"
          test -s "$guide"
          cp "$guide" "$GITHUB_WORKSPACE/song/vocal/00_GUIDE_D1.wav"

      - name: Repair degraded identical guide repetitions
        shell: bash
        run: |
          set -euo pipefail
          cp song/vocal/00_GUIDE_D1.wav song/vocal/00_GUIDE_D1_RAW.wav
          python tools/gg_d1r5_guide_identity_repair.py \
            --score docs/gg/songs/ne-s-nim-d1-full-v3.json \
            --input song/vocal/00_GUIDE_D1_RAW.wav \
            --output song/vocal/00_GUIDE_D1.wav \
            --report song/guide-identity-repair.json

      - name: Render D North Star
        shell: bash
        env:
          GG_APPLIO_CACHE_DIR: \${{ github.workspace }}/.gg-applio-cache
          GG_RVC_MODEL_CACHE_DIR: \${{ github.workspace }}/.gg-rvc-model-cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,runpy,subprocess
          ns=runpy.run_path('tools/gg_cloud_music_worker.py',run_name='gg_shared_d1')
          work=pathlib.Path('/tmp/applio-d1'); work.mkdir(exist_ok=True)
          root,vpy,rt=ns['ensure_applio_runtime'](work)
          model,index,meta=ns['install_rvc_model']('awata-weak-rvc-v1.2','Original',work)
          guide=pathlib.Path('song/vocal/00_GUIDE_D1.wav').resolve()
          out=pathlib.Path('song/vocal/D_D1_RAW.wav').resolve()
          code="import os,sys; root,source,out,model,index=sys.argv[1:6]; os.chdir(root); sys.path.insert(0,root); from core import run_infer_script; run_infer_script(input_path=source,output_path=out,pth_path=model,index_path=index,export_format='WAV',embedder_model='contentvec',pitch=0,index_rate=0.50,volume_envelope=1.0,protect=0.30,f0_method='fcpe',split_audio=True,f0_autotune=False,f0_autotune_strength=1.0,proposed_pitch=False,proposed_pitch_threshold=155.0,clean_audio=False,clean_strength=0.5,formant_shifting=False,formant_qfrency=1.0,formant_timbre=1.0,post_process=False,reverb=False,pitch_shift=False,limiter=False,gain=False,distortion=False,chorus=False,bitcrush=False,clipping=False,compressor=False,delay=False,reverb_room_size=0.5,reverb_damping=0.5,reverb_wet_gain=0.33,reverb_dry_gain=0.4,reverb_width=1.0,reverb_freeze_mode=0.0,pitch_shift_semitones=0.0,limiter_threshold=-6.0,limiter_release_time=0.01,gain_db=0.0,distortion_gain=25.0,chorus_rate=1.0,chorus_depth=0.25,chorus_center_delay=7.0,chorus_feedback=0.0,chorus_mix=0.5,bitcrush_bit_depth=8,clipping_threshold=-6.0,compressor_threshold=0.0,compressor_ratio=1.0,compressor_attack=1.0,compressor_release=100.0,delay_seconds=0.5,delay_feedback=0.0,delay_mix=0.5,sid=0)"
          p=subprocess.run([str(vpy),'-c',code,str(root),str(guide),str(out),str(model),str(index)],
                           cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=2400)
          print(p.stdout[-12000:])
          if p.returncode or not out.exists() or out.stat().st_size==0:
              raise SystemExit('Applio D1 full failed')
          PY

      - name: Phrase-local diction repair search
        shell: bash
        run: |
          set +e
          python tools/gg_d1r5_phrase_repair.py \
            --score docs/gg/songs/ne-s-nim-d1-full-v3.json \
            --guide song/vocal/00_GUIDE_D1.wav \
            --raw-d song/vocal/D_D1_RAW.wav \
            --out song/vocal/D_D1_REPAIRED.wav \
            --report song/diction-repair.json \
            --threshold 0.20
          echo "phrase_repair_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Render Voice-from-Silence envelope on D vocal
        shell: bash
        run: |
          set -euo pipefail
          python tools/gg_d1r5_vfs_envelope.py \
            --input song/vocal/D_D1_REPAIRED.wav \
            --score docs/gg/songs/ne-s-nim-d1-full-v3.json \
            --output song/vocal/D_D1_FCPE_IDX050.wav \
            --report song/vfs-envelope.json

      - name: Mix qualification cut
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p song/master
          ffmpeg -y -v error -i song/vocal/D_D1_FCPE_IDX050.wav \
            -af "highpass=f=75,equalizer=f=2600:t=q:w=1:g=0.6,acompressor=threshold=-10dB:ratio=1.25:attack=26:release=210,aresample=48000,volume=0.92" \
            song/vocal/D_D1_MIX.wav
          ffmpeg -y -v error \
            -i song/arrangement/instrumental.wav \
            -i song/vocal/D_D1_MIX.wav \
            -filter_complex "[0:a]volume=1.00[inst];[inst][1:a]amix=inputs=2:duration=longest:normalize=0,acompressor=threshold=-7dB:ratio=1.20:attack=28:release=230,alimiter=limit=0.96,loudnorm=I=-15.8:LRA=12:TP=-1.0[out]" \
            -map "[out]" -ar 48000 -c:a pcm_s24le song/master/NEZRIMY_GOST_D1R5.wav
          ffmpeg -y -v error -i song/master/NEZRIMY_GOST_D1R5.wav \
            -codec:a libmp3lame -b:a 320k song/master/NEZRIMY_GOST_D1R5.mp3

      - name: Rendered-audio QA
        shell: bash
        run: |
          set +e
          python tools/gg_audio_qa.py \
            --vocal song/vocal/D_D1_FCPE_IDX050.wav \
            --instrumental song/arrangement/instrumental.wav \
            --drums song/arrangement/processed/drums.wav \
            --riff song/arrangement/processed/riff.wav \
            --master song/master/NEZRIMY_GOST_D1R5.wav \
            --score docs/gg/songs/ne-s-nim-d1-full-v3.json \
            --bpm 108 \
            --out song/qa-audio.json
          echo "audio_qa_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Russian singing ASR QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib,tempfile
          import soundfile as sf
          from faster_whisper import WhisperModel
          from jiwer import wer,cer

          score=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-d1-full-v3.json').read_text())
          tpb=score['ticks_per_beat']; bpm=score['bpm']; BAR=tpb*4
          tempo_map=sorted(score.get('tempo_map') or [{'bar':0,'bpm':bpm}],key=lambda x:x['bar'])
          tempo_pts=[(int(x['bar'])*BAR,float(x['bpm'])) for x in tempo_map]
          def tick_to_sec(tick):
              total=0.0; last=0; cur=tempo_pts[0][1]
              for pos,nbpm in tempo_pts[1:]:
                  if tick<=pos: break
                  total+=(pos-last)*60.0/(cur*tpb); last=pos; cur=nbpm
              total+=(tick-last)*60.0/(cur*tpb)
              return total

          def norm(s):
              s=s.lower().replace('ё','е')
              s=re.sub(r'[^а-я0-9 ]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def phrase_target(ph):
              return ' '.join(w['text'] for w in ph['words'])

          model=WhisperModel('small',device='cpu',compute_type='int8')
          outputs={}
          for label,path in [
              ('guide','song/vocal/00_GUIDE_D1.wav'),
              ('d','song/vocal/D_D1_FCPE_IDX050.wav')]:
              y,sr=sf.read(path)
              if getattr(y,'ndim',1)>1: y=y.mean(axis=1)
              phrase_results=[]
              for ph in score['phrases']:
                  start_tick=ph['bar']*tpb*4+ph['offset']
                  end_tick=start_tick
                  for w in ph['words']:
                      end_tick+=sum(w['durations'])+w['rest']
                  start=max(0.0,tick_to_sec(start_tick)-0.12)
                  end=min(len(y)/sr,tick_to_sec(end_tick)+0.18)
                  seg=y[int(start*sr):int(end*sr)]
                  tmp=pathlib.Path(tempfile.gettempdir())/f"{label}-{ph['id']}.wav"
                  sf.write(tmp,seg,sr)
                  segments,info=model.transcribe(
                      str(tmp),language='ru',beam_size=5,vad_filter=False,
                      condition_on_previous_text=False,temperature=0.0)
                  text=' '.join(s.text.strip() for s in list(segments)).strip()
                  target=phrase_target(ph)
                  nt,nr=norm(target),norm(text)
                  phrase_results.append({
                      'id':ph['id'],'target':target,'transcript':text,
                      'wer':float(wer(nt,nr)),'cer':float(cer(nt,nr)),
                      'start':start,'end':end
                  })
              full_target=' '.join(x['target'] for x in phrase_results)
              full_text=' '.join(x['transcript'] for x in phrase_results)
              nt,nr=norm(full_target),norm(full_text)
              result={
                  'wer':float(wer(nt,nr)),
                  'cer':float(cer(nt,nr)),
                  'mean_phrase_wer':sum(x['wer'] for x in phrase_results)/len(phrase_results),
                  'mean_phrase_cer':sum(x['cer'] for x in phrase_results)/len(phrase_results),
                  'max_phrase_cer':max(x['cer'] for x in phrase_results),
                  'transcript':full_text,
                  'phrases':phrase_results
              }
              pathlib.Path(f'song/qa-asr-{label}.json').write_text(
                  json.dumps(result,ensure_ascii=False,indent=2))
              print(label,json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Critic gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,sys
          aq=json.loads(pathlib.Path('song/qa-audio.json').read_text())
          gd=json.loads(pathlib.Path('song/qa-asr-guide.json').read_text())
          dd=json.loads(pathlib.Path('song/qa-asr-d.json').read_text())
          failures=list(aq.get('failures',[]))

          # Repeated chorus must remain the same musical/textual object acoustically.
          def by_id(obj,prefix):
              return [x for x in obj['phrases'] if x['id'].startswith(prefix)]
          # IDs of chorus II use c2l* in the Drive full score.
          g1=by_id(gd,'c1l'); g2=by_id(gd,'c2l')
          d1=by_id(dd,'c1l'); d2=by_id(dd,'c2l')
          if len(g1)==4 and len(g2)==4:
              if abs(sum(x['cer'] for x in g1)/4-sum(x['cer'] for x in g2)/4)>0.25:
                  failures.append('guide_chorus_consistency')
          if len(d1)==4 and len(d2)==4:
              if abs(sum(x['cer'] for x in d1)/4-sum(x['cer'] for x in d2)/4)>0.30:
                  failures.append('d_chorus_consistency')

          if gd['wer']>0.30: failures.append('guide_asr_wer')
          if gd['cer']>0.15: failures.append('guide_asr_cer')
          if gd['max_phrase_cer']>0.20: failures.append('guide_phrase_intelligibility')
          if dd['wer']>0.32: failures.append('d_asr_wer')
          if dd['cer']>0.20: failures.append('d_asr_cer')
          if dd['max_phrase_cer']>0.20: failures.append('d_phrase_intelligibility')
          if any(x['cer']>0.20 for x in dd['phrases']): failures.append('d_phrase_over_strict_limit')

          result={
            'status':'PASS' if not failures else 'REJECT',
            'audio':aq,
            'asr_guide':gd,
            'asr_d':dd,
            'failures':failures,
            'gate_version':'D1R5B'
          }
          pathlib.Path('song/qualification.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if failures: sys.exit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ne-s-nim-d1-full
          path: |
            song/master/
            song/vocal/00_GUIDE_D1.wav
            song/vocal/00_GUIDE_D1_RAW.wav
            song/guide-identity-repair.json
            song/vocal/D_D1_FCPE_IDX050.wav
            song/vocal/D_D1_REPAIRED.wav
            song/vocal/D_D1_RAW.wav
            song/diction-repair.json
            song/vfs-envelope.json
            song/arrangement/instrumental.mp3
            song/arrangement/processed/riff.wav
            song/arrangement/composition-map.json
            song/qa-audio.json
            song/qa-asr-guide.json
            song/qa-asr-d.json
            song/qualification.json
          retention-days: 7
          if-no-files-found: warn