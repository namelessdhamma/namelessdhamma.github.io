name: TEMP NotebookLM Ensure Fresh Patch

on:
  push:
    branches:
      - notebooklm-remote-mcp
    paths:
      - '.github/workflows/_tmp-notebooklm-ensure-fresh-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notebooklm-remote-mcp
      - name: Patch bounded source_ensure_fresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/notebooklm-mcp/remote-vercel-oauth/app.py')
          s = p.read_text()
          anchor = '''            elif operation == "source_sync_drive":\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'anchor_count={s.count(anchor)}')
          block = '''            elif operation == "source_ensure_fresh":\n                if args.get("confirm") is not True:\n                    return JSONResponse({"ok": False, "error": "confirm_required"}, status_code=400)\n                nb_id = await resolve_notebook(client, str(args.get("notebook") or ""))\n                source_id = str(args.get("source_id") or "").strip()\n                if not source_id:\n                    return JSONResponse({"ok": False, "error": "missing_source_id"}, status_code=400)\n                try:\n                    max_checks = int(args.get("max_checks", 8))\n                    poll_seconds = float(args.get("poll_seconds", 4.0))\n                except (TypeError, ValueError):\n                    return JSONResponse({"ok": False, "error": "invalid_poll_settings"}, status_code=400)\n                max_checks = max(1, min(max_checks, 10))\n                poll_seconds = max(1.0, min(poll_seconds, 5.0))\n                initial_fresh = await client.sources.check_freshness(nb_id, source_id)\n                final_fresh = bool(initial_fresh)\n                refreshed = None\n                checks = 0\n                if initial_fresh:\n                    final_fresh = True\n                else:\n                    refreshed = await client.sources.refresh(nb_id, source_id)\n                    for attempt in range(max_checks):\n                        await asyncio.sleep(poll_seconds)\n                        checks = attempt + 1\n                        final_fresh = await client.sources.check_freshness(nb_id, source_id)\n                        if final_fresh:\n                            break\n                fulltext_ready = False\n                if final_fresh:\n                    try:\n                        await client.sources.get_fulltext(nb_id, source_id)\n                        fulltext_ready = True\n                    except Exception:\n                        fulltext_ready = False\n                result = {\n                    "notebook_id": nb_id,\n                    "source_id": source_id,\n                    "initial_fresh": bool(initial_fresh),\n                    "refreshed": not bool(initial_fresh),\n                    "refresh_result": to_jsonable(refreshed),\n                    "is_fresh": bool(final_fresh),\n                    "needs_refresh": not bool(final_fresh),\n                    "fulltext_ready": fulltext_ready,\n                    "checks": checks,\n                    "max_checks": max_checks,\n                    "poll_seconds": poll_seconds,\n                }\n\n'''
          p.write_text(s.replace(anchor, block + anchor, 1))
          PY
          python -m py_compile tools/notebooklm-mcp/remote-vercel-oauth/app.py
          python -m unittest tools/notebooklm-mcp/remote-vercel-oauth/tests/test_drive_source_contract.py
          git diff --check
      - name: Commit bridge delta
        shell: bash
        run: |
          git config user.name 'nd-bounded-patch'
          git config user.email 'namelessdhamma@gmail.com'
          git add tools/notebooklm-mcp/remote-vercel-oauth/app.py
          git diff --cached --check
          git commit -m 'feat(notebooklm): add bounded ensure-fresh Drive operation'
          git push origin HEAD:notebooklm-remote-mcp
