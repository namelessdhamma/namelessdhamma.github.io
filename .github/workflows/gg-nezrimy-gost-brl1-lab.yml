name: GG Nezrimy Gost BRL1 Lab

on:
  push:
    branches:
      - compute/gg-nezrimy-gost-brl1-lab-20261007
    paths:
      - '.github/workflows/gg-nezrimy-gost-brl1-lab.yml'
      - '.nd-labs/gg-songs/GGNeSNimD1FullTest.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gg-nezrimy-gost-brl1-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brl1-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git unzip ffmpeg build-essential libsndfile1 libportaudio2 patchelf libicu-dev
          python -m pip install -q numpy scipy soundfile requests faster-whisper==1.1.1 jiwer==3.0.4 pyyaml

      - name: Build BRL1 score variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p brl1-lab
          python - <<'PY'
          import copy,json,pathlib
          src=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-d1-full-v3.json').read_text())
          p=copy.deepcopy(next(x for x in src['phrases'] if x['id']=='brl1'))
          p['bar']=0; p['offset']=240
          base={'version':'BRL1_LAB','title':'BRL1 micro lab','bpm':108,'ticks_per_beat':src['ticks_per_beat'],'bars':4,
                'phrases':[p],'target_text':' '.join(w['text'] for w in p['words'])}
          pathlib.Path('brl1-lab/score-r0.json').write_text(json.dumps(base,ensure_ascii=False,indent=2))
          q=copy.deepcopy(base)
          wp=next(w for w in q['phrases'][0]['words'] if w['text']=='в')
          assert wp['durations']==[240]
          wp['durations']=[120]; wp['rest']=120
          pathlib.Path('brl1-lab/score-r120.json').write_text(json.dumps(q,ensure_ascii=False,indent=2))
          PY

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimD1FullTest.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimD1FullTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimD1FullTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimD1FullTest.cs
          curl -fL --retry 3 -o /tmp/awata.zip https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"; fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          arc=pathlib.Path('/tmp/ezv.oudep')
          arc.write_bytes(urllib.request.urlopen('https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',timeout=300).read())
          dst.mkdir(exist_ok=True)
          with zipfile.ZipFile(arc) as z:
              names={n.replace('\\','/'):n for n in z.namelist()}
              cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
              data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
              m=next(n for n in names if n.split('/')[-1]==model)
              (dst/'vocoder.yaml').write_bytes(data)
              with z.open(names[m]) as inf,(dst/model).open('wb') as out: shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Build OpenUtau test host
        shell: bash
        run: |
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release

      - name: Render BRL1 variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/brl1-lab/renders"
          cd /tmp/openutau
          render_one () {
            tag="$1"; score="$2"; voff="$3"
            out="$GITHUB_WORKSPACE/brl1-lab/renders/$tag"; mkdir -p "$out"
            OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
            GG_VFS_OUT="$out" \
            GG_VFS_TAG="$tag" \
            GG_VFS_SPEAKER_HINT="Mature" \
            GG_VFS_VARIANT="shared_d1" \
            GG_D1_GUIDE_PROFILE="articulation" \
            GG_D1_IGNORE_TEMPO_MAP="1" \
            GG_VFS_STEPS="56" \
            GG_VFS_L_OFFSET_TICKS="0" \
            GG_BRL1_V_OFFSET_TICKS="$voff" \
            GG_SHARED_SCORE="$GITHUB_WORKSPACE/$score" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj --configuration Release --no-build --filter RenderNeSNimD1Full
            wav="$(find "$out" -name '*OPENUTAU_RU_QC.wav' -print -quit)"
            test -s "$wav"; cp "$wav" "$GITHUB_WORKSPACE/brl1-lab/$tag.wav"
          }
          render_one V60_R0 brl1-lab/score-r0.json 60
          render_one V90_R0 brl1-lab/score-r0.json 90
          render_one V60_R120 brl1-lab/score-r120.json 60
          render_one V90_R120 brl1-lab/score-r120.json 90

      - name: ASR select BRL1 winner
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json,re,pathlib,tempfile
          from faster_whisper import WhisperModel
          from jiwer import wer,cer
          target='взирали сквозь друг друга в давний год'
          def norm(s):
              s=s.lower().replace('ё','е'); s=re.sub(r'[^а-я0-9 ]+',' ',s); return re.sub(r'\s+',' ',s).strip()
          model=WhisperModel('small',device='cpu',compute_type='int8')
          rows=[]
          for tag in ['V60_R0','V90_R0','V60_R120','V90_R120']:
              segs,_=model.transcribe(f'brl1-lab/{tag}.wav',language='ru',beam_size=5,vad_filter=False,condition_on_previous_text=False,temperature=0.0)
              txt=' '.join(s.text.strip() for s in list(segs)).strip()
              rows.append({'tag':tag,'transcript':txt,'wer':float(wer(norm(target),norm(txt))),'cer':float(cer(norm(target),norm(txt)))})
          rows.sort(key=lambda x:(x['cer'],x['wer']))
          result={'target':target,'winner':rows[0],'variants':rows,'status':'PASS' if rows[0]['cer']<=.20 else 'REJECT'}
          pathlib.Path('brl1-lab/qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Upload BRL1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-nezrimy-gost-brl1-lab
          path: brl1-lab/

      - name: BRL1 gate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          q=json.load(open('brl1-lab/qa.json'))
          if q['status']!='PASS': sys.exit(2)
          PY
