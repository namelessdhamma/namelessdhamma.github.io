name: GG Nezrimy Z15 North Star Vocal Reuse
on:
  push:
    branches: [experiment/gg-nezrimy-z11-20261009]
    paths: [.github/workflows/gg-nezrimy-z15-northstar.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  humanize:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact pinned Applio
        uses: actions/cache/restore@v4
        with:
          path: .gg-applio-cache
          key: gg-applio-cpu-v2-${{ runner.os }}-324f4d89
      - name: Restore original Awata RVC model
        uses: actions/cache/restore@v4
        with:
          path: .gg-rvc-model-cache
          key: gg-rvc-awata-v1.2-${{ runner.os }}
      - name: Download original whole-line performances (one single dry singer)
        uses: actions/download-artifact@v4
        with:
          name: GG-NEZRIMY-Z14-WHOLE-LINE-DIRECT-VOICE
          path: z15_voice_source/whole
          run-id: 37880600866
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download corrected /bv/ and /sh/ phonemes
        uses: actions/download-artifact@v4
        with:
          name: GG-NEZRIMY-Z14-CORRECTED-NEW-WORDS
          path: z15_voice_source/corrected
          run-id: 37880652749
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download original source pronunciation of remaining words
        uses: actions/download-artifact@v4
        with:
          name: GG-NEZRIMY-Z13-TRUE-PHONEME-SOURCES
          path: z15_voice_source/words
          run-id: 37878112957
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned phoneme inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates python3 python3-pip git unzip gcc g++ build-essential libsndfile1 libportaudio2
          python3 -m pip install --disable-pip-version-check --quiet --break-system-packages "numpy>=1.26,<3"
      - name: Restore North Star C and D human vocal on newly corrected sources
        shell: bash
        env:
          GG_APPLIO_CACHE_DIR: ${{ github.workspace }}/.gg-applio-cache
          GG_RVC_MODEL_CACHE_DIR: ${{ github.workspace }}/.gg-rvc-model-cache
        run: |
          set -euo pipefail
          python3 -m tools.gg_nezrimy_z15_northstar_rvc
      - name: Preserve independent actual phoneme humanized sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GG-NEZRIMY-Z15-NORTHSTAR-C-D-WAVS
          path: z15_voice_out/
          if-no-files-found: warn
          retention-days: 8
