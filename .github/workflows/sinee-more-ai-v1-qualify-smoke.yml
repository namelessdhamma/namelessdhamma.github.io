name: Sinee More AI v1 Qualification Smoke
# calibration-sample: 7

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-qualify-smoke.yml'

permissions:
  contents: read

jobs:
  qualify-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualification smoke
        run: node tools/qualification.js --games-per-pair 8 --budget-scale 0.04 --corpus-size 100 --json qualification-smoke.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-qualification-smoke
          path: sinee-more/qualification-smoke.json
          if-no-files-found: ignore
