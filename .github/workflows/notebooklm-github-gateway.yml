name: ND NotebookLM GitHub Gateway

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  notebooklm:
    if: >-
      github.event.issue.pull_request == null &&
      github.actor == 'namelessdhamma' &&
      startsWith(github.event.comment.body, '/notebooklm ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Mint short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nd-notebooklm")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run NotebookLM gateway
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
        run: python3 tools/notebooklm-github-gateway/gateway.py
