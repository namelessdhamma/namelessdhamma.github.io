name: GG Vocal Mutate Qualification

on:
  push:
    branches:
      - experiment/gg-vocal-mutate-applio-20261006-worker
    paths:
      - 'tools/gg_cloud_music_worker.py'
      - '.github/workflows/gg-vocal-mutate-qualify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate GG worker adapter
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/gg_cloud_music_worker.py
          grep -q 'def vocal_mutate' tools/gg_cloud_music_worker.py
          grep -q 'APPLIO_COMMIT="324f4d89c3e0e8dc0e555a3d53784e3282c16e09"' tools/gg_cloud_music_worker.py
          grep -q 'elif op=="vocal_mutate"' tools/gg_cloud_music_worker.py
          echo GG_VOCAL_MUTATE_STATIC=PASS

      - name: Install pinned Applio CPU smoke environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q uv
          git clone --filter=blob:none --no-checkout https://github.com/IAHispano/Applio.git /tmp/applio
          git -C /tmp/applio checkout --detach 324f4d89c3e0e8dc0e555a3d53784e3282c16e09
          uv venv /tmp/applio-venv --python 3.12
          uv pip install --python /tmp/applio-venv/bin/python torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/applio/requirements.txt').read_text().splitlines()
          out=[]
          for line in src:
              low=line.strip().lower()
              if low.startswith('torch==') or low.startswith('torchaudio==') or low.startswith('onnxruntime-gpu=='):
                  continue
              out.append(line)
          out.append('onnxruntime>=1.22,<2')
          Path('/tmp/applio-requirements-cpu.txt').write_text('\n'.join(out)+'\n')
          PY
          uv pip install --python /tmp/applio-venv/bin/python -r /tmp/applio-requirements-cpu.txt

      - name: Qualify headless Applio import and controls
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/applio
          /tmp/applio-venv/bin/python core.py --help >/tmp/applio-help.txt
          /tmp/applio-venv/bin/python - <<'PY'
          from rvc.configs.config import Config
          from rvc.infer.infer import VoiceConverter
          c=Config()
          v=VoiceConverter()
          assert c.device
          assert hasattr(v,'convert_audio')
          print('GG_APPLIO_HEADLESS_IMPORT=PASS', c.device)
          PY
          grep -q -- '--protect' /tmp/applio-help.txt
          grep -q -- '--formant-shifting' /tmp/applio-help.txt
          grep -q -- '--f0-method' /tmp/applio-help.txt
          echo GG_APPLIO_CONTROLS=PASS
