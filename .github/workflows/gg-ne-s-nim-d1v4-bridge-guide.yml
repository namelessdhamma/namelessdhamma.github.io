name: GG Ne S Nim D1v4 Bridge Guide Test

on:
  push:
    branches:
      - compute/gg-ne-s-nim-d1v4-bridge-guide-20261006
    paths:
      - '.github/workflows/gg-ne-s-nim-d1v4-bridge-guide.yml'
      - 'docs/gg/songs/ne-s-nim-d1-v4-bridge-guide-test.json'
      - '.nd-labs/gg-songs/GGNeSNimBridgeGuideTest.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git unzip ffmpeg libicu-dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ASR runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q faster-whisper==1.1.1 jiwer==3.0.4 soundfile

      - name: Verify 9-bar score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-d1-v4-bridge-guide-test.json').read_text())
          assert s['version']=='D1_V4_BRIDGE_GUIDE_TEST'
          assert s['bars']==9
          assert [p['id'] for p in s['phrases']]==['brl2','brl4','c2l4']
          print({'status':'PASS','phrases':[p['id'] for p in s['phrases']]})
          PY

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimBridgeGuideTest.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimBridgeGuideTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimBridgeGuideTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimBridgeGuideTest.cs

          curl -fL --retry 3 -o /tmp/awata.zip \
            https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"
          fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          if not (dst/'vocoder.yaml').exists():
              arc=pathlib.Path('/tmp/ezv.oudep')
              arc.write_bytes(urllib.request.urlopen(
                  'https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',
                  timeout=300).read())
              dst.mkdir(exist_ok=True)
              with zipfile.ZipFile(arc) as z:
                  names={n.replace('\\','/'):n for n in z.namelist()}
                  cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
                  data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
                  m=next(n for n in names if n.split('/')[-1]==model)
                  (dst/'vocoder.yaml').write_bytes(data)
                  with z.open(names[m]) as inf,(dst/model).open('wb') as out:
                      shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Render 9-bar clean guide
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release
          mkdir -p "$GITHUB_WORKSPACE/guide"
          OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
          GG_VFS_OUT="$GITHUB_WORKSPACE/guide" \
          GG_VFS_TAG="NE_S_NIM_D1V4_BRIDGE_GUIDE" \
          GG_VFS_SPEAKER_HINT="Mature" \
          GG_VFS_VARIANT="bridge_test" \
          GG_VFS_STEPS="64" \
          GG_SHARED_SCORE="$GITHUB_WORKSPACE/docs/gg/songs/ne-s-nim-d1-v4-bridge-guide-test.json" \
          dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj \
            --configuration Release --no-build --filter RenderNeSNimBridgeGuideTest
          g="$(find "$GITHUB_WORKSPACE/guide" -name '*OPENUTAU_RU_QC.wav' -print -quit)"
          test -s "$g"
          cp "$g" "$GITHUB_WORKSPACE/guide/BRIDGE_GUIDE.wav"

      - name: Phrase ASR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,pathlib,tempfile
          import soundfile as sf
          from faster_whisper import WhisperModel
          from jiwer import wer,cer

          score=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-d1-v4-bridge-guide-test.json').read_text())
          y,sr=sf.read('guide/BRIDGE_GUIDE.wav')
          if getattr(y,'ndim',1)>1:y=y.mean(axis=1)
          tick_sec=60/score['bpm']/score['ticks_per_beat']

          def norm(s):
              s=s.lower().replace('ё','е')
              s=re.sub(r'[^а-я0-9 ]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          model=WhisperModel('small',device='cpu',compute_type='int8')
          rows=[]
          for ph in score['phrases']:
              st=(ph['bar']*score['ticks_per_beat']*4+ph['offset'])*tick_sec
              ticks=sum(sum(w['durations'])+w['rest'] for w in ph['words'])
              en=st+ticks*tick_sec
              seg=y[int(max(0,st-.12)*sr):int(min(len(y)/sr,en+.18)*sr)]
              tmp=pathlib.Path(tempfile.gettempdir())/(ph['id']+'.wav')
              sf.write(tmp,seg,sr)
              segs,_=model.transcribe(str(tmp),language='ru',beam_size=5,vad_filter=False,
                                      condition_on_previous_text=False,temperature=0.0)
              txt=' '.join(x.text.strip() for x in list(segs)).strip()
              target=' '.join(w['text'] for w in ph['words'])
              nt,nr=norm(target),norm(txt)
              rows.append({'id':ph['id'],'target':target,'transcript':txt,
                           'wer':float(wer(nt,nr)),'cer':float(cer(nt,nr))})
          result={'phrases':rows,'max_cer':max(x['cer'] for x in rows),
                  'status':'PASS' if all(x['cer']<=0.20 for x in rows[:2]) else 'REJECT'}
          pathlib.Path('guide/qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['status']!='PASS': raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-ne-s-nim-d1v4-bridge-guide
          path: |
            guide/BRIDGE_GUIDE.wav
            guide/qa.json
          retention-days: 7
          if-no-files-found: warn
