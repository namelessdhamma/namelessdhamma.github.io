name: GG Nezrimy Gost Guide Lab

on:
  push:
    branches:
      - compute/gg-nezrimy-gost-guide-lab-20261007
    paths:
      - '.github/workflows/gg-nezrimy-gost-guide-lab.yml'
      - '.nd-labs/gg-songs/GGNeSNimD1FullTest.cs'
      - 'docs/gg/songs/ne-s-nim-d1-full-v3.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gg-nezrimy-gost-guide-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap action prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install guide-lab runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git unzip ffmpeg build-essential \
            libsndfile1 libportaudio2 patchelf libicu-dev
          python -m pip install -q numpy scipy soundfile faster-whisper==1.1.1 jiwer==3.0.4 pyyaml

      - name: Build compact blocker score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guide-lab
          python - <<'PY'
          import copy,json,pathlib
          src=json.loads(pathlib.Path('docs/gg/songs/ne-s-nim-d1-full-v3.json').read_text())
          ids=['v1l3','c1l2','c1l4','c2l2','c2l4','brl1','brl2','brl3','brl4']
          by={p['id']:p for p in src['phrases']}
          phrases=[]
          for i,pid in enumerate(ids):
              p=copy.deepcopy(by[pid])
              p['bar']=i*3
              p['offset']=240
              phrases.append(p)
          lab={
              'version':'D1R5_GUIDE_LAB_1',
              'title':'Незримый гость — compact diction blocker score',
              'bpm':108,
              'ticks_per_beat':src['ticks_per_beat'],
              'bars':len(ids)*3+1,
              'phrases':phrases,
              'target_text':' '.join(' '.join(w['text'] for w in p['words']) for p in phrases),
          }
          pathlib.Path('guide-lab/score.json').write_text(json.dumps(lab,ensure_ascii=False,indent=2))
          print(json.dumps({'status':'PASS','ids':ids,'bars':lab['bars']},ensure_ascii=False))
          PY

      - name: Prepare OpenUtau and Awata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGNeSNimD1FullTest.cs" />\n  </ItemGroup>\n'
          if 'GGNeSNimD1FullTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-songs/GGNeSNimD1FullTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGNeSNimD1FullTest.cs

          curl -fL --retry 3 -o /tmp/awata.zip \
            https://github.com/hhskt/Awata_Weak/releases/download/diffsinger_v3.0/Awata_Weak_DS_v3.zip
          mkdir -p /tmp/awata
          unzip -q /tmp/awata.zip -d /tmp/awata
          bank="$(find /tmp/awata -type f -name dsconfig.yaml -printf '%h\n' | head -n1)"
          test -n "$bank"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Awata Weak\nauthor=hhskt\nvoice=Awata Weak\n' > "$bank/character.txt"
          fi
          echo "AWATA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Install EZV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,urllib.request,zipfile,yaml,shutil,os
          bank=pathlib.Path(os.environ['AWATA_BANK']); dst=bank/'dsvocoder'
          arc=pathlib.Path('/tmp/ezv.oudep')
          arc.write_bytes(urllib.request.urlopen(
              'https://github.com/matax2bi/ezv-for-diffsinger/releases/download/v2.0.0/ezv_for_diffsinger.oudep',
              timeout=300).read())
          dst.mkdir(exist_ok=True)
          with zipfile.ZipFile(arc) as z:
              names={n.replace('\\','/'):n for n in z.namelist()}
              cfg=next(n for n in names if n.endswith('/vocoder.yaml') or n=='vocoder.yaml')
              data=z.read(names[cfg]); model=yaml.safe_load(data)['model']
              m=next(n for n in names if n.split('/')[-1]==model)
              (dst/'vocoder.yaml').write_bytes(data)
              with z.open(names[m]) as inf,(dst/model).open('wb') as out:
                  shutil.copyfileobj(inf,out,1024*1024)
          PY

      - name: Render articulation and neutral guides
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/openutau
          dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release
          mkdir -p "$GITHUB_WORKSPACE/guide-lab/guides"
          for profile in articulation neutral; do
            out="$GITHUB_WORKSPACE/guide-lab/render-$profile"
            mkdir -p "$out"
            OPENUTAU_TEST_SINGERS="$AWATA_BANK" \
            GG_VFS_OUT="$out" \
            GG_VFS_TAG="GUIDE_LAB_$profile" \
            GG_VFS_SPEAKER_HINT="Mature" \
            GG_VFS_VARIANT="shared_d1" \
            GG_D1_GUIDE_PROFILE="$profile" \
            GG_D1_IGNORE_TEMPO_MAP="1" \
            GG_VFS_STEPS="56" \
            GG_VFS_L_OFFSET_TICKS="0" \
            GG_SHARED_SCORE="$GITHUB_WORKSPACE/guide-lab/score.json" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj \
              --configuration Release --no-build --filter RenderNeSNimD1Full
            wav="$(find "$out" -name '*OPENUTAU_RU_QC.wav' -print -quit)"
            test -s "$wav"
            cp "$wav" "$GITHUB_WORKSPACE/guide-lab/guides/$profile.wav"
          done

      - name: Phrase ASR, select winners and verify best-of
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re,tempfile
          import numpy as np
          import soundfile as sf
          from faster_whisper import WhisperModel
          from jiwer import wer,cer

          root=pathlib.Path('guide-lab')
          score=json.loads((root/'score.json').read_text())
          model=WhisperModel('small',device='cpu',compute_type='int8')
          tpb=score['ticks_per_beat']; BAR=tpb*4; bpm=score['bpm']; tick_sec=60.0/bpm/tpb
          profiles={}
          for name in ['articulation','neutral']:
              y,sr=sf.read(root/'guides'/f'{name}.wav')
              if getattr(y,'ndim',1)>1:y=y.mean(axis=1)
              profiles[name]=(np.asarray(y,dtype=np.float32),sr)

          def norm(s):
              s=s.lower().replace('ё','е')
              s=re.sub(r'[^а-я0-9 ]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          def target(ph): return ' '.join(w['text'] for w in ph['words'])
          def bounds(ph,sr):
              st=ph['bar']*BAR+ph['offset']; en=st
              for w in ph['words']: en+=sum(w['durations'])+w['rest']
              return max(0,int((st*tick_sec-.12)*sr)),int((en*tick_sec+.18)*sr)
          td=pathlib.Path(tempfile.mkdtemp(prefix='gg-guide-lab-'))
          def tx(x,sr,fn):
              sf.write(fn,x,sr)
              segs,_=model.transcribe(str(fn),language='ru',beam_size=5,vad_filter=False,
                                      condition_on_previous_text=False,temperature=0.0)
              return ' '.join(s.text.strip() for s in list(segs)).strip()

          rows=[]
          for ph in score['phrases']:
              trg=target(ph); nt=norm(trg); cand={}
              for name,(y,sr) in profiles.items():
                  a,b=bounds(ph,sr); text=tx(y[a:b],sr,td/f"{ph['id']}-{name}.wav")
                  nr=norm(text)
                  cand[name]={'transcript':text,'wer':float(wer(nt,nr)),'cer':float(cer(nt,nr))}
              winner=min(cand,key=lambda n:(cand[n]['cer'],cand[n]['wer']))
              rows.append({'id':ph['id'],'target':trg,'candidates':cand,'winner':winner,'best':cand[winner]})

          # Assemble phrase-wise best guide on articulation timeline.
          base,sr=profiles['articulation']; best=base.copy()
          for ph,row in zip(score['phrases'],rows):
              winner=row['winner']
              if winner=='articulation': continue
              src,ssr=profiles[winner]
              assert ssr==sr
              a,b=bounds(ph,sr)
              seg=src[a:b].copy()
              fade=min(max(1,int(.06*sr)),max(1,(b-a)//4))
              env=np.ones(b-a,dtype=np.float32)
              if b-a>=2*fade:
                  env[:fade]=np.linspace(0,1,fade,endpoint=False)
                  env[-fade:]=np.linspace(1,0,fade,endpoint=False)
              best[a:b]=best[a:b]*(1-env)+seg*env
          sf.write(root/'best-of.wav',best,sr,subtype='PCM_24')

          final=[]
          for ph in score['phrases']:
              trg=target(ph); nt=norm(trg); a,b=bounds(ph,sr)
              text=tx(best[a:b],sr,td/f"{ph['id']}-best.wav")
              nr=norm(text)
              final.append({'id':ph['id'],'target':trg,'transcript':text,
                            'wer':float(wer(nt,nr)),'cer':float(cer(nt,nr))})
          blockers=[x for x in final if x['cer']>.20]
          report={'threshold':.20,'profiles':rows,'final':final,'blockers':blockers,
                  'status':'PASS' if not blockers else 'REJECT'}
          (root/'guide-lab-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          (root/'winner-map.json').write_text(json.dumps(
              {x['id']:x['winner'] for x in rows},ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload guide lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-nezrimy-gost-guide-lab
          path: |
            guide-lab/score.json
            guide-lab/guides/*.wav
            guide-lab/best-of.wav
            guide-lab/guide-lab-report.json
            guide-lab/winner-map.json
            guide-lab/render-*/*manifest.txt

      - name: Guide lab gate
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          j=json.load(open('guide-lab/guide-lab-report.json'))
          if j['status']!='PASS':
              print('GUIDE_LAB_REJECT',j['blockers'])
              sys.exit(2)
          print('GUIDE_LAB_PASS')
          PY