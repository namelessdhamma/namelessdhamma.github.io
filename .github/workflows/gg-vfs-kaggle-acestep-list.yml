name: GG VFS ACE-Step list metadata
on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths: [".github/workflows/gg-vfs-kaggle-acestep-list.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - name: Inspect exact repaint provider output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,os,requests
          from pathlib import Path
          token=os.environ["KAGGLE_API_TOKEN"].strip(); user=os.environ["KAGGLE_USERNAME_SLUG"].strip()
          h={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json","User-Agent":"nd-vfs-list/1.1"}
          api="https://api.kaggle.com/v1"
          slug="gg-vfs-ace8423-repaint-28c84d9bfd4c23e6"
          r=requests.post(api+"/kernels.KernelsApiService/ListKernels",headers=h,json={"user":user,"search":"ACE8423 Repaint","pageSize":50},timeout=30)
          print("LIST_HTTP",r.status_code,r.text[:4000],flush=True)
          Path("out/list.txt").write_text(f"HTTP {r.status_code}\n"+r.text)
          o=requests.post(api+"/kernels.KernelsApiService/ListKernelSessionOutput",headers=h,json={"userName":user,"kernelSlug":slug,"versionLabel":"v1","pageSize":100},timeout=40)
          print("OUTPUT_HTTP",o.status_code,flush=True)
          print(o.text[-16000:],flush=True)
          Path("out/output.txt").write_text(f"HTTP {o.status_code}\n"+o.text)
          if not o.ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vfs-ace8423-repaint-provider-inspect
          path: out/
          retention-days: 30
          if-no-files-found: error
