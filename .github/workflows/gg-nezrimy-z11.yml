name: GG Nezrimy Gost Z11 Bounded Local Vocal Repair
on:
  push:
    branches:
      - experiment/gg-nezrimy-z11-20261009
    paths:
      - '.github/workflows/gg-nezrimy-z11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: debian:sid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pinned Applio inference cache
        uses: actions/cache/restore@v4
        with:
          path: .gg-applio-cache
          key: gg-applio-cpu-v2-${{ runner.os }}-324f4d89
      - name: Restore original Awata RVC model
        uses: actions/cache/restore@v4
        with:
          path: .gg-rvc-model-cache
          key: gg-rvc-awata-v1.2-${{ runner.os }}
      - name: Install audio and inference prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates python3 python3-pip git unzip gcc g++ build-essential libsndfile1 libportaudio2
          python3 -m pip install --disable-pip-version-check --quiet --break-system-packages "numpy>=1.26,<3"
      - name: Convert only two problematic single-voice windows and preserve M3
        shell: bash
        env:
          GG_APPLIO_CACHE_DIR: ${{ github.workspace }}/.gg-applio-cache
          GG_RVC_MODEL_CACHE_DIR: ${{ github.workspace }}/.gg-rvc-model-cache
        run: |
          set -euo pipefail
          python3 tools/gg_nezrimy_z11.py
      - name: Preserve review candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GG-NEZRIMY-Z11-M3-REVIEW
          path: z11_out/
          if-no-files-found: warn
          retention-days: 7
