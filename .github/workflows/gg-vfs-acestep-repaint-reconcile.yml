name: GG VFS ACE8423 repaint reconcile

on:
  push:
    branches: ["experiment/gg-openutau-mcp-20261004"]
    paths:
      - ".github/workflows/gg-vfs-acestep-repaint-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SLUG: ${{ secrets.KAGGLE_USERNAME_SLUG }}
    steps:
      - name: Reconcile existing repaint v1 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          import requests

          token=os.environ["KAGGLE_API_TOKEN"].strip()
          user=os.environ["KAGGLE_USERNAME_SLUG"].strip()
          slug="gg-vfs-ace8423-repaint-6e1ad7e93603370a"
          version=1
          api="https://api.kaggle.com/v1"
          H={"Authorization":"Bearer "+token,"Accept":"application/json","Content-Type":"application/json","User-Agent":"nd-vfs-repaint-reconcile/1.1"}
          out=Path("out")
          expected=[
              "gg-vfs-ace-repaint-output/result.json",
              "gg-vfs-ace-repaint-output/REPRODUCTION_RECIPE.md",
              "gg-vfs-ace-repaint-output/BASELINE_8423_EXACT.wav",
              "gg-vfs-ace-repaint-output/GG-VFS-F01_ACE8423_REPAINT_0p2.wav",
              "gg-vfs-ace-repaint-output/GG-VFS-F01_ACE8423_REPAINT_0p4.wav",
          ]

          def provider_post(name):
              return requests.post(
                  f"{api}/kernels.KernelsApiService/DownloadKernelOutput",
                  headers=H,
                  json={"ownerSlug":user,"kernelSlug":slug,"filePath":name,"versionNumber":version},
                  timeout=40,
                  allow_redirects=False,
              )

          def resolved_bytes(name):
              r=provider_post(name)
              if 300 <= r.status_code < 400 and r.headers.get("location"):
                  g=requests.get(r.headers["location"],timeout=180)
                  if not g.ok or not g.content:
                      return None, f"redirect_get_{g.status_code}_{len(g.content)}"
                  return g.content, f"redirect_get_{g.status_code}_{len(g.content)}"
              if r.ok and r.content:
                  if "json" in r.headers.get("content-type",""):
                      try:
                          obj=r.json()
                          url=(obj.get("url") or obj.get("redirectUrl") or obj.get("redirect_url")
                               or obj.get("downloadUrl") or obj.get("download_url"))
                      except Exception:
                          url=None
                      if url:
                          g=requests.get(url,timeout=180)
                          if not g.ok or not g.content:
                              return None, f"jsonurl_get_{g.status_code}_{len(g.content)}"
                          return g.content, f"jsonurl_get_{g.status_code}_{len(g.content)}"
                  return r.content, f"direct_{r.status_code}_{len(r.content)}"
              return None, f"post_{r.status_code}_{len(r.content)}"

          deadline=time.time()+22*60
          result_bytes=None
          while time.time() < deadline:
              data,state=resolved_bytes(expected[0])
              ready=False
              if data:
                  try:
                      parsed=json.loads(data.decode("utf-8"))
                      ready=isinstance(parsed,dict) and "ok" in parsed
                  except Exception:
                      ready=False
              print("RESULT_PROBE",state,"READY",ready,flush=True)
              if ready:
                  result_bytes=data
                  break
              time.sleep(30)

          if result_bytes is None:
              raise RuntimeError("existing repaint effect did not expose valid terminal result within bounded reconcile")

          def save_bytes(name,data):
              p=out/Path(name).name
              p.write_bytes(data)
              return {"provider":name,"file":p.name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          got=[save_bytes(expected[0],result_bytes)]
          result=json.loads(result_bytes.decode("utf-8"))
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)

          if not result.get("ok"):
              idx={"state":"FAILED","provider_ref":f"{user}/{slug}/v{version}","downloads":got,"result":result}
              (out/"result-index.json").write_text(json.dumps(idx,ensure_ascii=False,indent=2))
              raise SystemExit(3)

          for name in expected[1:]:
              data,state=resolved_bytes(name)
              if data is None:
                  raise RuntimeError(f"expected deliverable unavailable: {name} ({state})")
              got.append(save_bytes(name,data))

          idx={"state":"READY","provider_ref":f"{user}/{slug}/v{version}","downloads":got,"result":result}
          (out/"result-index.json").write_text(json.dumps(idx,ensure_ascii=False,indent=2))
          print(json.dumps(idx,ensure_ascii=False,indent=2),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vfs-ace8423-repaint-reconciled
          path: out/
          retention-days: 30
          if-no-files-found: error
