name: GG VFS natural Russian QC
on:
  push:
    branches:
      - "experiment/gg-vfs-female-sweep-20261004"
    paths:
      - ".github/workflows/gg-vfs-natural-qc.yml"
      - ".nd-labs/gg-vfs/ufr_natural_qc.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  render-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DiffSinger pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install numpy==1.26.4 scipy==1.13.1 librosa==0.9.2 onnxruntime==1.16.3 pyyaml pypinyin soundfile tqdm diffsinger-utau==0.3.8
      - name: Recover cached UFR pack
        uses: actions/download-artifact@v4
        with:
          name: gg-vfs-kumi-discovery
          run-id: 37178003583
          github-token: ${{ github.token }}
          path: /tmp/ufr-cache
      - name: Extract pack and render natural pipeline
        shell: bash
        run: |
          set -euo pipefail
          pack="$(find /tmp/ufr-cache -type f -name 'ufr-pack.download' -print -quit)"
          test -n "$pack"
          mkdir -p /tmp/ufr
          unzip -q "$pack" -d /tmp/ufr
          root="$(find /tmp/ufr -type f -path '*/0_CORE/dsacoustic/millefeuille_v001.phonemes.json' -printf '%h\n' | sed 's#/0_CORE/dsacoustic$##' | head -n 1)"
          test -n "$root"
          python .nd-labs/gg-vfs/ufr_natural_qc.py "$root" gg-vocal-natural-qc
          cat gg-vocal-natural-qc/summary.json

      - name: Install autonomous listening QC
        run: |
          python -m pip install faster-whisper allosaurus

      - name: Listen to every rendered WAV before qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, unicodedata
          import numpy as np
          import librosa
          from faster_whisper import WhisperModel
          from allosaurus.app import read_recognizer

          root=Path("gg-vocal-natural-qc")
          expected="я говорил не с ним"

          def norm(s):
              s=unicodedata.normalize("NFKC",s).lower().replace("ё","е")
              s=re.sub(r"[^а-яa-z0-9 ]+"," ",s)
              return " ".join(s.split())

          whisper=WhisperModel("small",device="cpu",compute_type="int8")
          phones=read_recognizer()
          report={"expected":expected,"files":[]}

          for wav in sorted(root.glob("*.wav")):
              segs,info=whisper.transcribe(
                  str(wav),language="ru",beam_size=5,word_timestamps=True,
                  temperature=0.0,condition_on_previous_text=False)
              segs=list(segs)
              transcript=" ".join(s.text.strip() for s in segs).strip()
              words=[]
              for s in segs:
                  for w in (s.words or []):
                      words.append({
                          "text":w.word.strip(),
                          "start":round(float(w.start),3),
                          "end":round(float(w.end),3),
                          "probability":round(float(w.probability),4),
                      })
              ne_probs=[w["probability"] for w in words if norm(w["text"])=="не"]
              transcript_pass=norm(transcript)==expected

              try:
                  phone_trace=phones.recognize(str(wav),lang_id="rus")
              except Exception:
                  phone_trace=phones.recognize(str(wav))
              compact=" ".join(str(phone_trace).split())
              # This is deliberately a reject-only diagnostic. A singing-phone
              # recognizer is noisy, but a hard/open n+ɛ realization is exactly
              # the user-observed failure and must not be accepted silently.
              hard_ne=bool(re.search(r"(^|\s)n\s+ɛ($|\s)",compact))

              y,sr=librosa.load(str(wav),sr=None,mono=True)
              hop=512
              rms=librosa.feature.rms(y=y,frame_length=2048,hop_length=hop)[0]
              n=len(rms)
              core=rms[max(1,n//20):max(2,n-n//20)]
              peak=max(float(core.max()),1e-9)
              db=20*np.log10(np.maximum(core,1e-9)/peak)
              silence_frac=float(np.mean(db<-28))
              rms_jump=np.abs(np.diff(20*np.log10(np.maximum(core,1e-9))))
              rms_p95=float(np.percentile(rms_jump,95)) if len(rms_jump) else 0.0
              S=np.abs(librosa.stft(y,n_fft=2048,hop_length=hop))
              Sn=S/(np.linalg.norm(S,axis=0,keepdims=True)+1e-8)
              flux=np.sqrt(np.sum(np.diff(Sn,axis=1)**2,axis=0))
              flux_p95=float(np.percentile(flux,95)) if len(flux) else 0.0

              # Loose reject-only screen for obvious chopped/silent artifacts.
              # Passing this is not equivalent to human-naturalness qualification.
              naturalness_screen=(
                  silence_frac < 0.15 and
                  rms_p95 < 6.0 and
                  flux_p95 < 0.80
              )
              phonetics_pass=transcript_pass and (not hard_ne)
              item={
                  "file":wav.name,
                  "transcript":transcript,
                  "transcript_pass":transcript_pass,
                  "words":words,
                  "critical_ne_probability":min(ne_probs) if ne_probs else None,
                  "phone_trace":compact,
                  "hard_open_ne_detected":hard_ne,
                  "phonetics_pass":phonetics_pass,
                  "naturalness_screen_pass":naturalness_screen,
                  "silence_like_fraction_db28":round(silence_frac,4),
                  "rms_jump_p95_db":round(rms_p95,3),
                  "spectral_flux_p95":round(flux_p95,4),
                  # HARD user-exposure gate stays false until stronger
                  # naturalness evidence (OpenUtau-native audition and/or
                  # singing-MOS/human-equivalent review) also passes.
                  "user_exposure_pass":False,
              }
              report["files"].append(item)
              print(json.dumps(item,ensure_ascii=False),flush=True)

          (root/"autonomous-listening-qc.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          cat gg-vocal-natural-qc/autonomous-listening-qc.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-vocal-natural-russian-qc
          path: gg-vocal-natural-qc/
          retention-days: 3
