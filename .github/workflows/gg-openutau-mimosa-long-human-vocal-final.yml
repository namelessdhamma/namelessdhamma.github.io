name: GG Mimosa Dark long human vocal final
on:
  push:
    branches:
      - "experiment/gg-openutau-mcp-20261004"
    paths:
      - ".github/workflows/gg-openutau-mimosa-long-human-vocal-final.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read

jobs:
  render-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare OpenUtau
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openutau/OpenUtau.git /tmp/openutau
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/openutau/OpenUtau.Test/OpenUtau.Test.csproj')
          x=p.read_text()
          if '<EnableDefaultCompileItems>false</EnableDefaultCompileItems>' not in x:
              x=x.replace('<PropertyGroup>', '<PropertyGroup>\n    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>', 1)
          item='  <ItemGroup>\n    <Compile Include="Core/DiffSinger/GGVfsLongHumanVocalTest.cs" />\n  </ItemGroup>\n'
          if 'GGVfsLongHumanVocalTest.cs' not in x:
              x=x.replace('</Project>', item+'</Project>')
          p.write_text(x)
          Path('/tmp/openutau/global.json').write_text(json.dumps({'test':{'runner':'Microsoft.Testing.Platform'}},indent=2))
          PY
          mkdir -p /tmp/openutau/OpenUtau.Test/Core/DiffSinger
          cp .nd-labs/gg-vfs/GGVfsLongHumanVocalTest.cs /tmp/openutau/OpenUtau.Test/Core/DiffSinger/GGVfsLongHumanVocalTest.cs

      - name: Recover Mimosa
        uses: actions/download-artifact@v4
        with:
          name: gg-vfs-kumi-discovery
          run-id: 37178003583
          github-token: ${{ github.token }}
          path: /tmp/ufr-cache

      - name: Prepare stock bank
        shell: bash
        run: |
          set -euo pipefail
          pack="$(find /tmp/ufr-cache -type f -name 'ufr-pack.download' -print -quit)"
          mkdir -p /tmp/ufr
          unzip -q "$pack" -d /tmp/ufr
          root="$(find /tmp/ufr -type f -path '*/0_CORE/dsacoustic/millefeuille_v001.phonemes.json' -printf '%h\n' | sed 's#/0_CORE/dsacoustic$##' | head -n 1)"
          bank="$root/Millefeuille_Mimosa"
          test -f "$bank/dsconfig.yaml"
          if [ ! -f "$bank/character.txt" ]; then
            printf 'name=Millefeuille Mimosa\nauthor=UFR\nvoice=UFR\n' > "$bank/character.txt"
          fi
          echo "MIMOSA_BANK=$bank" >> "$GITHUB_ENV"

      - name: Build
        working-directory: /tmp/openutau
        run: dotnet build OpenUtau.Test/OpenUtau.Test.csproj --configuration Release

      - name: Render conservative and Human-B profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/final/all"
          cd /tmp/openutau
          for style in long_a long_b; do
            OPENUTAU_TEST_SINGERS="$MIMOSA_BANK" \
            GG_VFS_OUT="${GITHUB_WORKSPACE}/final/all" \
            GG_VFS_TAG="Mimosa_Dark_${style}_STOCK_Final" \
            GG_VFS_SPEAKER_HINT="Dark" \
            GG_VFS_VARIANT="$style" \
            GG_VFS_L_OFFSET_TICKS="55" \
            GG_VFS_STEPS="64" \
            dotnet test --project OpenUtau.Test/OpenUtau.Test.csproj --configuration Release --no-build \
              --filter RenderLongHumanVocal
          done
          test "$(find "${GITHUB_WORKSPACE}/final/all" -name '*.wav' | wc -l)" -eq 2

      - name: Install QC
        run: python -m pip install faster-whisper librosa==0.10.2.post1 soundfile numpy scipy

      - name: Independent final gate
        shell: bash
        run: |
          cat > /tmp/final_qc.py <<'PY'
          import json,re,hashlib,shutil
          from pathlib import Path
          import numpy as np, soundfile as sf, librosa
          from faster_whisper import WhisperModel

          root=Path("final/all"); out=Path("final/passed"); out.mkdir(parents=True,exist_ok=True)
          model=WhisperModel("small",device="cpu",compute_type="int8")
          target="я говорил не с ним а с тем кто долго стоял у окна и ждал"
          critical={"говорил","не","ним","тем","долго","стоял","окна","ждал"}
          def norm(x):
              x=x.lower().replace("ё","е"); x=re.sub(r"[^а-я\s]"," ",x)
              return re.sub(r"\s+"," ",x).strip()

          results=[]
          for p in sorted(root.glob("*.wav")):
              style="long_b" if "long_b" in p.name else "long_a"
              segs,_=model.transcribe(str(p),language="ru",beam_size=5,word_timestamps=True,
                  temperature=0.0,condition_on_previous_text=False)
              segs=list(segs); words=[]; texts=[]
              for seg in segs:
                  texts.append(seg.text.strip())
                  for w in seg.words or []:
                      ww=norm(w.word)
                      if ww: words.append({"word":ww,"p":float(w.probability)})
              transcript=norm(" ".join(texts)); present={w["word"] for w in words}
              ne=max((w["p"] for w in words if w["word"]=="не"),default=0.)
              stood=max((w["p"] for w in words if w["word"]=="стоял"),default=0.)
              mean=float(np.mean([w["p"] for w in words])) if words else 0.

              y,sr=sf.read(p)
              if y.ndim>1:y=y.mean(axis=1)
              hop=256
              f0,_,_=librosa.pyin(y,fmin=librosa.note_to_hz("C2"),fmax=librosa.note_to_hz("C6"),
                                  sr=sr,frame_length=2048,hop_length=hop)
              idx=np.where(np.isfinite(f0))[0]
              span=0.; motion=0.; gross=1.
              if len(idx)>5:
                  vals=f0[idx]; cents=1200*np.log2(vals/np.median(vals))
                  span=float(np.percentile(cents,95)-np.percentile(cents,5))
                  d=1200*np.log2(vals[1:]/vals[:-1]); d=d[np.diff(idx)==1]
                  if len(d):
                      gross=float(np.mean(np.abs(d)>350))
                      local=d[np.abs(d)<100]; motion=float(np.mean(np.abs(local))) if len(local) else 0.
              rms=librosa.feature.rms(y=y,frame_length=2048,hop_length=hop)[0]
              active=rms>np.max(rms)*0.01; db=librosa.amplitude_to_db(rms,ref=np.max)
              dyn=float(np.percentile(db[active],90)-np.percentile(db[active],10))
              ej=float(np.percentile(np.abs(np.diff(rms)),99))

              S=np.abs(librosa.stft(y,n_fft=4096,hop_length=hop,win_length=4096))
              freqs=librosa.fft_frequencies(sr=sr,n_fft=4096); P=S*S+1e-12
              frames=np.where(np.sum(P,axis=0)>np.max(np.sum(P,axis=0))*0.01)[0]
              upper=freqs>=8000; total=np.sum(P[:,frames],axis=0)+1e-12
              upper_ratio=float(np.median(np.sum(P[upper][:,frames],axis=0)/total))
              flat=float(np.median(librosa.feature.spectral_flatness(S=S)[0][frames]))

              mp=p.with_name(p.name.replace("__OPENUTAU_RU_QC.wav","__manifest.txt"))
              mt=mp.read_text(encoding="utf8")
              provenance=("dark" in mt.lower() and "l_offset_ticks=55" in mt and
                          "render_steps=64" in mt and "manual_frame_f0=false" in mt and
                          "manual_phoneme_durations=false" in mt and
                          "route=official_ru_phonemizer+openutau_timing+native_dspitch" in mt)
              exact=(transcript==target)
              passed=bool(provenance and exact and critical.issubset(present) and ne>=0.75 and stood>=0.65
                          and 520<=span<=800 and 2.4<=motion<=5.8 and 6<=dyn<=13.5
                          and gross<0.02 and ej<0.025)
              score=2*mean+ne+stood-0.08*abs(motion-4.0)-0.03*abs(dyn-9.0)
              results.append({"file":p.name,"style":style,"text":transcript,"exact":exact,
                  "ne":ne,"stoyal":stood,"mean_word":mean,"pitch_span_cents":span,
                  "local_pitch_motion_cents":motion,"loudness_span_db":dyn,
                  "gross_jump_rate":gross,"energy_jump_p99":ej,"upper_8k_ratio":upper_ratio,
                  "spectral_flatness":flat,"provenance":provenance,"pass":passed,"score":score})

          passed=sorted([x for x in results if x["pass"]],key=lambda x:x["score"],reverse=True)
          if not passed:
              Path("final/qc-report.json").write_text(json.dumps({"results":results},ensure_ascii=False,indent=2))
              print(json.dumps(results,ensure_ascii=False,indent=2))
              raise SystemExit("No final candidate passed")
          for i,x in enumerate(passed,1):
              src=root/x["file"]
              dst=out/f"{i:02d}_Mimosa_Dark_Long_Human_{x['style'].upper()}_STOCK.wav"
              shutil.copy2(src,dst); x["selected_as"]=dst.name
              x["sha256"]=hashlib.sha256(src.read_bytes()).hexdigest()
          Path("final/qc-report.json").write_text(json.dumps({"target":target,"selected":passed,"results":results},ensure_ascii=False,indent=2))
          with Path("final/qc-summary.txt").open("w",encoding="utf8") as f:
              for x in passed:
                  f.write(f"{x['selected_as']} | text={x['text']} | не={x['ne']:.3f} | стоял={x['stoyal']:.3f} | "
                          f"pitch={x['pitch_span_cents']:.1f}c | local={x['local_pitch_motion_cents']:.2f}c | "
                          f"dyn={x['loudness_span_db']:.2f}dB | jump={x['gross_jump_rate']:.4f} | "
                          f">8k={x['upper_8k_ratio']:.6f} | flat={x['spectral_flatness']:.8f}\n")
          print(Path("final/qc-summary.txt").read_text())
          PY
          python /tmp/final_qc.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-mimosa-dark-long-human-vocal-final
          path: |
            final/passed/
            final/qc-report.json
            final/qc-summary.txt
          retention-days: 3
          if-no-files-found: warn
