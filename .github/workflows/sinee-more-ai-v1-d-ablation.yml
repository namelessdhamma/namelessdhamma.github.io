name: Sinee More AI v1 D Evaluation Ablation
# diagnostic-sample: 2

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-ablation.yml'

permissions:
  contents: read

jobs:
  d-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply global-plan ablation
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/evaluation.js')
          s=p.read_text()
          s=s.replace('ladderGlobalCapacity: 16,','ladderGlobalCapacity: 0,')
          s=s.replace('ladderResourceConflict: 8','ladderResourceConflict: 0')
          p.write_text(s)
          PY

      - name: Confirm D at scaled qualification budget
        continue-on-error: true
        run: node tools/qualification.js --strength-only --rules D --games-per-pair 24 --budget-scale 0.10 --json d-global-ablation-scaled.json

      - name: Confirm D at production budget
        continue-on-error: true
        run: node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 1.0 --json d-global-ablation-production.json

      - name: Restore evaluation
        if: always()
        run: cp /tmp/evaluation.js ai/evaluation.js

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-global-ablation-confirm
          path: sinee-more/d-global-ablation-*.json
          if-no-files-found: ignore
