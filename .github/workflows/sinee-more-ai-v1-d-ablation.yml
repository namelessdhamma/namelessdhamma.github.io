name: Sinee More AI v1 D Evaluation Ablation
# diagnostic-sample: 1

on:
  workflow_dispatch:
  push:
    branches: [sinee-more-ai-v1]
    paths:
      - '.github/workflows/sinee-more-ai-v1-d-ablation.yml'

permissions:
  contents: read

jobs:
  d-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sinee-more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ablation A - remove diffuse ladder flexibility and raw plan count
        continue-on-error: true
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/evaluation.js')
          s=p.read_text()
          s=s.replace('ladderPlan: 0.45,','ladderPlan: 0,')
          s=s.replace('ladderStructuralFlex: 1.5,','ladderStructuralFlex: 0,')
          p.write_text(s)
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-ablation-diffuse.json
          cp /tmp/evaluation.js ai/evaluation.js

      - name: Ablation B - remove global active-plan capacity and conflict
        continue-on-error: true
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/evaluation.js')
          s=p.read_text()
          s=s.replace('ladderGlobalCapacity: 16,','ladderGlobalCapacity: 0,')
          s=s.replace('ladderResourceConflict: 8','ladderResourceConflict: 0')
          p.write_text(s)
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-ablation-global.json
          cp /tmp/evaluation.js ai/evaluation.js

      - name: Ablation C - remove extra D rank-resource valuation
        continue-on-error: true
        shell: bash
        run: |
          cp ai/evaluation.js /tmp/evaluation.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/evaluation.js')
          s=p.read_text().replace('ladderResource: 0.35,','ladderResource: 0,')
          p.write_text(s)
          PY
          node tools/qualification.js --strength-only --rules D --games-per-pair 8 --budget-scale 0.10 --json d-ablation-resource.json
          cp /tmp/evaluation.js ai/evaluation.js

      - name: Restore evaluation
        if: always()
        run: git checkout -- ai/evaluation.js

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinee-more-ai-v1-d-evaluation-ablation
          path: sinee-more/d-ablation-*.json
          if-no-files-found: ignore
