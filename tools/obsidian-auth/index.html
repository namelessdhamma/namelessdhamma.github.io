<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ND Obsidian MCP Authorization</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0d;color:#f4f4f5;margin:0}
main{max-width:520px;margin:48px auto;padding:24px}
.card{background:#151518;border:1px solid #2b2b31;border-radius:18px;padding:24px}
h1{font-size:1.35rem;margin:0 0 10px}
p{color:#b7b7bf;line-height:1.5}
input{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #3a3a42;background:#0f0f12;color:#fff;font-size:1rem}
button{margin-top:16px;width:100%;padding:13px 16px;border:0;border-radius:10px;background:#f4f4f5;color:#111;font-size:1rem;font-weight:600}
.note{font-size:.88rem}
#error{color:#ff8b8b;display:none}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>ND Obsidian MCP</h1>
    <p>Authorize ChatGPT read-only access to the True Memory Obsidian vault.</p>
    <form id="auth" method="post" action="https://zkbmkhpyrddsiuynjgzd.supabase.co/functions/v1/nd-true-memory-obsidian/oauth/approve">
      <input type="hidden" name="client_id">
      <input type="hidden" name="redirect_uri">
      <input type="hidden" name="code_challenge">
      <input type="hidden" name="state">
      <input type="hidden" name="scope">
      <input name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Authorize</button>
    </form>
    <p class="note">This grants access only to the non-authoritative True Memory Obsidian projection during qualification.</p>
    <p id="error">OAuth request is missing required parameters. Return to ChatGPT and start the connection again.</p>
  </div>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const required = ['client_id','redirect_uri','code_challenge'];
  const form = document.getElementById('auth');
  let ok = true;
  for (const name of ['client_id','redirect_uri','code_challenge','state','scope']) {
    const el = form.elements.namedItem(name);
    if (el) el.value = q.get(name) || (name === 'scope' ? 'mcp' : '');
  }
  for (const name of required) if (!q.get(name)) ok = false;
  if (!ok) {
    form.style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
})();
</script>
</body>
</html>
